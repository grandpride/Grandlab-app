<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>Grandlab Marketing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#080808;--card:#141414;--card2:#1c1c1c;--gold:#F5C518;--text:#fff;--text2:#9a9a9a;--border:#2a2a2a;--ok:#3ec06a;--red:#e0533d}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:640px;margin:0 auto;min-height:100dvh;padding:44px 16px 60px}
.back{position:fixed;top:8px;left:8px;z-index:60;background:rgba(0,0,0,.65);color:var(--gold);text-decoration:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;backdrop-filter:blur(4px)}
.hdr{padding:14px 4px 18px;text-align:center}
.logo{font-weight:900;font-size:26px;letter-spacing:1px}
.logo span{color:var(--gold)}
.tag{font-size:11px;color:var(--text2);letter-spacing:.25em;text-transform:uppercase;margin-top:6px}

.monthbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.mb-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;font-family:inherit;flex-shrink:0}
.mb-btn:active{transform:scale(.95)}
.mb-mid{flex:1;text-align:center}
.mb-m{font-weight:800;font-size:16px}
.mb-s{font-size:11px;color:var(--text2);margin-top:2px}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:13px}
.card h2{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.hero-t{font-weight:800;font-size:19px;margin-bottom:7px}
.hero-d{font-size:13px;color:var(--text2);line-height:1.55}
.seg{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;background:var(--card2);color:var(--gold);padding:4px 9px;border-radius:20px;text-transform:uppercase;margin-bottom:10px}
.bundle{background:var(--card2);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6}
.bundle .row{display:flex;justify-content:space-between;gap:10px}
.bundle .row.tot{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;font-weight:800}
.bundle .row.tot .v{color:var(--gold)}
.bundle .lbl{color:var(--text2)}

.sec-h{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;font-weight:700}
.task{display:flex;gap:11px;align-items:flex-start;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px;margin-bottom:7px;cursor:pointer;transition:.12s}
.task:active{transform:scale(.99)}
.task.done{opacity:.45;border-color:var(--ok)}
.task.done .tx{text-decoration:line-through}
.box{width:21px;height:21px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#080808;margin-top:1px}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.tx{font-size:13.5px;line-height:1.5;flex:1}
.tsub{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.45}

.prog{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:13px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog-n{font-weight:800;font-size:15px}
.prog-p{font-size:12px;color:var(--text2)}
.bar{height:7px;background:var(--card2);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:20px;transition:.3s;width:0}

.note{font-size:12px;color:var(--text2);line-height:1.55;background:var(--card2);border-radius:10px;padding:11px;margin-top:10px}
.warn{border-left:3px solid var(--gold)}

.status{font-size:12px;color:var(--text2);text-align:center;min-height:17px;margin:8px 0}
.foot{text-align:center;font-size:11px;color:var(--text2);margin-top:22px;line-height:1.6}

.gate{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.gate.hidden{display:none}
.gate-box{width:100%;max-width:340px}
.gate label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600}
.gate input{width:100%;background:#1e1e1a;border:1px solid var(--border);border-radius:12px;color:#fff;padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:12px;outline:none}
.gate input:focus{border-color:var(--gold)}
.gate button{width:100%;background:var(--gold);color:#080808;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}
.err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

/* ---------------- task template ---------------- */
function tasksFor(ym){
  const p=PLAN[ym]; if(!p) return [];
  const t=[];
  const add=(key,section,label,sub)=>t.push({key,section,label,sub:sub||''});

  add('prep_offer','Prep — before month starts','Confirm this month\'s offer & final prices','Check bundle margin against material cost before publishing.');
  add('prep_copy','Prep — before month starts','Write ad copy (English + Malay)','Show the car and the result first. Price last.');
  add('prep_clips','Prep — before month starts','Shoot 3–5 clips for this offer','Phone on tripod. Application, squeegee/buff, reveal.');

  add('lch_ad','Launch — week 1','Launch Meta ad','One hero offer only. Don\'t run five at once.');
  add('lch_wa','Launch — week 1','WhatsApp broadcast to the right segment','Manual batches. Stay under the daily cap.');
  add('lch_board','Launch — week 1','Update TV board promo card + website','');

  for(let w=1;w<=4;w++){
    add('post_'+w+'a','Content — 2 posts per week','Week '+w+' · Post 1','IG Reels + TikTok + Facebook — same video, three places.');
    add('post_'+w+'b','Content — 2 posts per week','Week '+w+' · Post 2','');
  }

  add('ops_reviews','Ongoing','Ask every paid customer for a Google review','Build it into the POS checkout habit.');
  add('ops_followup','Ongoing','Follow up every enquiry that didn\'t convert','The ones who went quiet are the cheapest to win back.');

  if(p.extra) add('special','This month only',p.extra,'');

  add('rev_numbers','Review — week 4','Log the numbers','Enquiries · quoted · converted · revenue from hero offer · average ticket.');
  add('rev_next','Review — week 4','Plan next month\'s offer','');

  return t;
}

/* ---------------- helpers ---------------- */
function ymOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthName(d){
  return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }
function money(n){ return 'RM'+Number(n||0).toLocaleString('en-MY'); }

/* ---------------- render ---------------- */
function renderHero(){
  const ym=ymOf(CUR), p=PLAN[ym];
  $('mLabel').textContent=monthName(CUR);
  $('mSub').textContent=p?p.n:'No plan for this month';

  if(!p){
    $('heroCard').innerHTML='<h2><i class="ti ti-calendar-off"></i> No plan</h2>'+
      '<div class="hero-d">The calendar covers Sept 2026 → Aug 2027. Use the arrows to move to a month in range.</div>';
    return;
  }
  let body='<div class="seg">'+esc(p.seg)+'</div>'+
    '<div class="hero-t">'+esc(p.hero)+'</div>'+
    '<div class="hero-d">'+esc(p.desc)+'</div>';

  if(p.tiers){
    body+='<div class="bundle">';
    p.tiers.forEach(tr=>{
      body+='<div class="row"><span class="lbl">'+esc(tr[0])+'</span><span class="v" style="color:var(--gold);font-weight:800">'+esc(tr[3])+'</span></div>'+
            '<div style="font-size:11.5px;color:var(--text2);margin:-2px 0 9px">'+esc(tr[1])+' · list '+esc(tr[2])+'</div>';
    });
    body+='</div>';
  } else if(p.lines && p.lines.length){
    body+='<div class="bundle">';
    let list=0;
    p.lines.forEach(l=>{
      list+=l[1];
      body+='<div class="row"><span class="lbl">'+esc(l[0])+'</span><span>'+(l[1]?money(l[1]):'—')+'</span></div>';
    });
    if(p.bundle){
      body+='<div class="row"><span class="lbl">List total</span><span>'+money(list)+'</span></div>'+
            '<div class="row tot"><span>Bundle price</span><span class="v">'+money(p.bundle)+'</span></div>';
    }
    body+='</div>';
  }

  if(p.bonus) body+='<div class="note warn"><b style="color:var(--gold)">Bonus / upsell:</b> '+esc(p.bonus)+'</div>';
  if(p.content) body+='<div class="note"><b>Content angle:</b> '+esc(p.content)+'</div>';

  $('heroCard').innerHTML='<h2><i class="ti ti-target-arrow"></i> Hero offer</h2>'+body;
}

function renderTasks(){
  const ym=ymOf(CUR), list=tasksFor(ym);
  if(!list.length){ $('taskWrap').innerHTML=''; setProg(0,0); return; }

  let html='', lastSec='';
  list.forEach((t,i)=>{
    if(t.section!==lastSec){ html+='<div class="sec-h">'+esc(t.section)+'</div>'; lastSec=t.section; }
    const d=!!DONE[t.key];
    html+='<div class="task'+(d?' done':'')+'" onclick="toggle('+i+')">'+
            '<div class="box">'+(d?'<i class="ti ti-check"></i>':'')+'</div>'+
            '<div class="tx">'+esc(t.label)+
              (t.sub?'<div class="tsub">'+esc(t.sub)+'</div>':'')+
            '</div>'+
          '</div>';
  });
  $('taskWrap').innerHTML=html;
  window._list=list;
  const n=list.filter(t=>DONE[t.key]).length;
  setProg(n,list.length);
}

function setProg(n,total){
  $('progN').textContent=n+' of '+total+' done';
  const pct=total?Math.round(n/total*100):0;
  $('progP').textContent=pct+'%';
  $('progBar').style.width=pct+'%';
}

/* ---------------- data ---------------- */
async function loadMonth(){
  const ym=ymOf(CUR);
  DONE={};
  renderHero(); renderTasks();
  $('status').textContent='Loading…';
  try{
    const {data,error}=await sb.from('gl_mkt_tasks').select('task_key,done').eq('ym',ym);
    if(error) throw error;
    (data||[]).forEach(r=>{ if(r.done) DONE[r.task_key]=true; });
    $('status').textContent='';
  }catch(e){
    $('status').textContent='Could not load progress — check gl_mkt_tasks exists.';
  }
  renderTasks();
}

async function toggle(i){
  const t=(window._list||[])[i]; if(!t) return;
  const ym=ymOf(CUR);
  const next=!DONE[t.key];
  DONE[t.key]=next;
  renderTasks();
  try{
    const {error}=await sb.from('gl_mkt_tasks').upsert({
      ym, task_key:t.key, label:t.label, section:t.section,
      done:next, done_at: next? new Date().toISOString(): null,
      done_by: next? WHO : null
    },{onConflict:'ym,task_key'});
    if(error) throw error;
  }catch(e){
    DONE[t.key]=!next; renderTasks();
    toast('Could not save — try again');
  }
}

function shiftMonth(d){
  CUR=new Date(CUR.getFullYear(), CUR.getMonth()+d, 1);
  loadMonth();
}

/* ---------------- auth ---------------- */
async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  $('loginErr').textContent='';
  if(!email||!pass){ $('loginErr').textContent='Enter email and password.'; return; }
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ $('loginErr').textContent=error.message; return; }
  start();
}

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('gate').classList.remove('hidden'); return; }
  WHO=(session.user.email||'').split('@')[0].toUpperCase();
  $('gate').classList.add('hidden');
  CUR=new Date(); CUR.setDate(1);
  loadMonth();
}

$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
start();
</script>
