/* ---------------------------------------------------------------------------
   BOOKING FROM THE CUSTOMER'S FORM REPLY (24 Nov). When the customer answers the
   booking form ("Name: ...", "Plate: ..." lines, BM/EN/ZH), the fields are parsed
   and shown in an editable card. ONE click books it into gl_bookings exactly the
   way gl-staff-appointment-FINAL.html does (walk-in: customer_id null, details
   packed in notes, status pending, source whatsapp, same 5 slots, 2 per slot) and
   queues the confirmation through gl_wa_outbox. Never automatic; it checks for a
   double booking and a full slot first.
   --------------------------------------------------------------------------- */
const BK_SLOTS=['9:00 AM','10:00 AM','11:00 AM','1:30 PM','3:00 PM'];
const BK_SLOT24={'9:00 AM':'09:00','10:00 AM':'10:00','11:00 AM':'11:00','1:30 PM':'13:30','3:00 PM':'15:00'};
const BK_KEYS=[['name',/^(name|nama|full name|姓名|名字)$/i],['plate',/^(plate|plate no|plate number|no\.? ?plat|nombor plat|plat|车牌|车牌号)$/i],
  ['car',/^(car|car model|model|kereta|model kereta|车型|车)$/i],['service',/^(service|servis|perkhidmatan|jenis servis|服务|项目)$/i],
  ['date',/^(preferred date|date|tarikh|tarikh pilihan|日期)$/i],['time',/^(preferred time|time|masa|masa pilihan|时间)$/i]];
const BK_DONE={};
function bkParse(text){
  const f={};
  String(text||'').split(/\n+/).forEach(line=>{
    const m=/^\s*([^:：]{2,26})\s*[:：]\s*(.+?)\s*$/.exec(line); if(!m) return;
    const k=BK_KEYS.find(([n,re])=>re.test(m[1].trim())); if(k&&!f[k[0]]) f[k[0]]=m[2].trim();
  });
  return f;
}
function bkDate(txt){
  const t=String(txt||'').trim().toLowerCase(); if(!t) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(/^(today|hari ini|今天)/.test(t)) return iso(today);
  if(/^(tomorrow|esok|明天)/.test(t)){ const d=new Date(today); d.setDate(d.getDate()+1); return iso(d); }
  let m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,ogos:8,sep:9,sept:9,oct:10,okt:10,nov:11,dec:12,dis:12};
  m=/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/.exec(t);
  let d,mo,y;
  if(m){ d=+m[1]; mo=+m[2]; y=m[3]?+m[3]:0; }
  else{ m=/(\d{1,2})\s*(?:st|nd|rd|th)?\s*([a-z]{3,9})\.?\s*(\d{4})?/.exec(t); if(!m||!MON[m[2].slice(0,4)]&&!MON[m[2].slice(0,3)]) return ''; d=+m[1]; mo=MON[m[2].slice(0,4)]||MON[m[2].slice(0,3)]; y=m[3]?+m[3]:0; }
  if(!y){ y=today.getFullYear(); if(new Date(y,mo-1,d)<today) y++; } else if(y<100) y+=2000;
  if(mo<1||mo>12||d<1||d>31) return '';
  return iso(new Date(y,mo-1,d));
}
function bkSlot(txt){
  const m=/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m|p\.m)?/i.exec(String(txt||'')); if(!m) return '';
  let h=+m[1], mi=m[2]?+m[2]:0; const ap=(m[3]||'').toLowerCase();
  if(ap.startsWith('p')&&h<12) h+=12; if(ap.startsWith('a')&&h===12) h=0;
  if(!ap&&h>=1&&h<=6) h+=12;                         // "3" / "1.30" means afternoon
  const mins=h*60+mi; let best='',bd=1e9;
  BK_SLOTS.forEach(sl=>{ const [a,b]=BK_SLOT24[sl].split(':'); const dd=Math.abs((+a)*60+(+b)-mins); if(dd<bd){ bd=dd; best=sl; } });
  return bd<=45?best:'';
}
function bkDetect(jid){
  const rows=CUR_ROWS[jid]||[]; const c=CHATS.find(x=>x.chat_jid===jid);
  const q=miaQuestion(rows); if(!q) return null;
  const f=bkParse(q);
  const n=Object.keys(f).length;
  if(n<3||!(f.date||f.time)||!(f.plate||f.name)) return null;
  const li=miaLastIn(rows);
  return {jid,li,name:f.name||(c&&c.name)||'',phone:String((c&&c.phone)||'').replace(/\D/g,''),plate:(f.plate||'').toUpperCase(),car:f.car||'',
    service:f.service||'',date:bkDate(f.date),slot:bkSlot(f.time)||'',timeRaw:f.time||'',remark:''};
}
let BK=null; const MANUALBK={}; let SVC=null;
async function loadSvc(){
  if(SVC) return SVC;
  try{ const {data}=await sb.from('gl_services').select('name,category,hidden,sort_order').order('sort_order',{ascending:true}).limit(1000);
    SVC=(data||[]).filter(x=>x.name&&!x.hidden); }catch(e){ SVC=[]; }
  return SVC;
}
function bkManual(){
  if(!CUR) return; const r=window.__REC||{};
  const tm=new Date(Date.now()+86400000+8*3600000).toISOString().slice(0,10);
  MANUALBK[CUR.chat_jid]={jid:CUR.chat_jid,li:'m',manual:true,name:r.name||CUR.name||'',phone:String(CUR.phone||'').replace(/\D/g,''),plate:(r.plate||'').toUpperCase(),car:r.model||'',service:'',date:tm,slot:'',timeRaw:'',remark:''};
  delete BK_DONE[CUR.chat_jid+'|m'];
  drawBook(); const el=$('tBook'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
}
function bkSvcDraw(){
  const box=$('bk_svbox'); if(!box||!SVC) return;
  const q=(($('bk_svq')||{}).value||'').toLowerCase().trim();
  const cur=(($('bk_service')||{}).value||'').split(' + ').map(x=>x.trim()).filter(Boolean);
  let list=SVC.filter(x=>!q||(x.name+' '+(x.category||'')).toLowerCase().includes(q));
  const more=list.length>40; list=list.slice(0,40);
  box.innerHTML=list.map((x,i)=>'<button type="button" class="mvbtn" style="margin:2px;'+(cur.includes(x.name)?'background:#0EA5E9;color:#fff':'')+'" data-n="'+esc(x.name)+'" onclick="bkSvcPick(this)">'+esc(x.name)+'</button>').join('')
    +(more?'<div class="why">Type to narrow the list…</div>':'')+(!list.length?'<div class="why">No match.</div>':'');
}
function bkSvcPick(b){
  const n=b.getAttribute('data-n'); const el=$('bk_service'); if(!el) return;
  let cur=el.value.split(' + ').map(x=>x.trim()).filter(Boolean);
  cur=cur.includes(n)?cur.filter(x=>x!==n):cur.concat([n]);
  el.value=cur.join(' + '); bkSvcDraw();
}
async function bkAvail(){
  const d=($('bk_date')||{}).value, sel=$('bk_slot'); if(!d||!sel) return;
  try{
    const {data}=await sb.from('gl_bookings').select('notes,status').gte('scheduled_at',d+'T00:00:00+08:00').lte('scheduled_at',d+'T23:59:59+08:00');
    const live=(data||[]).filter(r=>String(r.status||'').toLowerCase()!=='cancelled');
    const keep=sel.value;
    sel.innerHTML='<option value="">(pick a slot)</option>'+BK_SLOTS.map(x=>{ const n=live.filter(r=>String(r.notes||'').includes('[slot:'+x+']')).length;
      return '<option value="'+x+'"'+(n>=2?' disabled':'')+'>'+x+(n>=2?' — FULL':(n?' — '+n+' booked':''))+'</option>'; }).join('');
    if(keep) sel.value=keep;
  }catch(e){}
}
function drawBook(){
  const el=$('tBook'); if(!el) return;
  BK=CUR?(bkDetect(CUR.chat_jid)||MANUALBK[CUR.chat_jid]||null):null;
  if(!BK){ el.classList.add('hide'); el.innerHTML=''; return; }
  const ab=AUTOBK.map[BK.jid+'|'+BK.li];
  if(ab&&ab.info&&ab.info!=='claiming'){
    el.classList.remove('hide');
    el.innerHTML='<div class="mh"><b>Auto-booking</b><span>'+esc(ab.info)+'</span>'
      +(ab.booking_id&&/^booked/.test(ab.info)?' <button class="mvbtn" onclick="bkUndo('+JSON.stringify(BK.jid+'|'+BK.li).replace(/"/g,'&quot;')+')">Undo (cancel)</button>':'')+'</div>'
      +(/^skipped|^failed/.test(ab.info)?'<div class="why">Not booked automatically. You can still book it by hand below.</div>':'');
    if(/^booked|^cancelled/.test(ab.info)) return;
  }
  if(BK_DONE[BK.jid+'|'+BK.li]){ el.classList.remove('hide'); el.innerHTML='<div class="mh"><b>Booking request</b><span>'+esc(BK_DONE[BK.jid+'|'+BK.li])+'</span></div>'; return; }
  const inp=(id,lbl,v,type)=>'<label style="font-size:11px;color:var(--text2);display:block;margin-top:4px">'+lbl+'<input id="bk_'+id+'" type="'+(type||'text')+'" value="'+esc(v||'')+'" style="width:100%;display:block"></label>';
  el.classList.remove('hide');
  el.innerHTML='<div class="mh"><b>Booking request detected</b><span>Check the values, fix anything, then press the button. Nothing is booked until you do.</span></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">'+inp('name','Name',BK.name)+inp('phone','Phone',BK.phone)+inp('plate','Plate',BK.plate)+inp('car','Car model',BK.car)+'</div>'
    +inp('service','Service (click below to add / remove)',BK.service)
    +'<input id="bk_svq" placeholder="Search services…" oninput="bkSvcDraw()" style="width:100%;display:block;margin-top:4px"><div id="bk_svbox" style="max-height:120px;overflow:auto;margin-top:2px"></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">'+inp('date','Date',BK.date,'date')
    +'<label style="font-size:11px;color:var(--text2);display:block;margin-top:4px">Time slot<select id="bk_slot" style="width:100%;display:block"><option value="">(pick a slot)</option>'
    +BK_SLOTS.map(x=>'<option'+(x===BK.slot?' selected':'')+'>'+x+'</option>').join('')+'</select></label></div>'
    +(BK.timeRaw&&!BK.slot?'<div class="why">Customer wrote the time as &ldquo;'+esc(BK.timeRaw)+'&rdquo;, which is not one of the 5 slots. Pick a slot.</div>':'')
    +inp('remark','Remark (optional)','')
    +'<div class="mh" style="margin-top:8px"><button class="lg on" id="bk_go" onclick="bkBook()">Book it + send confirmation</button><span id="bk_note" style="font-size:11.5px"></span></div>';
  if(BK.manual) el.querySelector('.mh b').textContent='Book appointment'; el.querySelector('.mh span').textContent='Click the services, pick date and slot, then press the button. Nothing is booked until you do.';
  const dEl=$('bk_date'); if(dEl) dEl.addEventListener('change',bkAvail);
  loadSvc().then(()=>{ bkSvcDraw(); bkAvail(); });
}
async function bkBook(){
  const g=id=>(($('bk_'+id)||{}).value||'').trim();
  const note=$('bk_note'), btn=$('bk_go');
  const fail=t=>{ note.className='err'; note.textContent=t; btn.disabled=false; };
  if(!BK||!CUR) return;
  const v={name:g('name'),phone:g('phone').replace(/\D/g,''),plate:g('plate').toUpperCase(),car:g('car'),service:g('service'),date:g('date'),slot:g('slot'),remark:g('remark')};
  if(!v.date) return fail('Date is needed.'); if(!v.slot) return fail('Pick a time slot.'); if(!v.service) return fail('Service is needed.');
  if(!v.phone&&!v.plate) return fail('Need a phone or a plate.');
  if(staffMode()&&!ME) return fail('Pick who you are first, above the reply box.');
  btn.disabled=true; note.className=''; note.textContent='Checking…';
  try{
    // 1. double booking / full slot
    const {data:day,error:de}=await sb.from('gl_bookings').select('scheduled_at,notes,status').gte('scheduled_at',v.date+'T00:00:00+08:00').lte('scheduled_at',v.date+'T23:59:59+08:00');
    if(de) throw de;
    const live=(day||[]).filter(r=>String(r.status||'').toLowerCase()!=='cancelled');
    const same=live.find(r=>{ const n=String(r.notes||''); return (v.plate&&n.toUpperCase().includes('PLATE: '+v.plate)) || (v.phone&&n.replace(/\D/g,'').includes(v.phone.slice(-8))&&/Phone:/i.test(n)); });
    if(same) return fail('Already booked on that date for this plate/phone. Not booked again.');
    const used=live.filter(r=>String(r.notes||'').includes('[slot:'+v.slot+']')).length;
    if(used>=2) return fail('That slot is full (2 of 2). Pick another.');
    // 2. same insert as the staff appointment page (walk-in: details in notes)
    let custId=null;
    if(v.phone){ try{ const {data:ex}=await sb.from('gl_profiles').select('id').or('phone.eq.+'+v.phone+',phone.eq.'+v.phone).limit(1).maybeSingle(); if(ex) custId=ex.id; }catch(e){} }
    const notes=['Name: '+v.name,'Phone: '+v.phone,'Car: '+v.car,'Plate: '+v.plate].concat(v.remark?['Remark: '+v.remark]:[]).concat(['[slot:'+v.slot+']']).join(' | ');
    const {error:ie}=await sb.from('gl_bookings').insert({customer_id:custId,vehicle_id:null,service_id:null,service_name:v.service,
      scheduled_at:v.date+'T'+BK_SLOT24[v.slot]+':00+08:00',status:'pending',source:'whatsapp',lead_source:null,is_returning:false,
      referral_by_name:null,referral_by_ref:null,notes});
    if(ie) throw ie;
    // 3. confirmation: queued through the outbox, skipped if the same text went to this chat in the last 10 minutes
    const dt=new Date(v.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    const tpl=(TPLS.find(t=>/appointment confirmation/i.test(t.name)&&t.active)||{}).body
      ||'Hi {name}, your appointment is confirmed:\nDate: {date}\nTime: {time}\nService: {service}\nSee you at Grandlab.';
    const text=tpl.replace(/\{name\}/g,v.name||'').replace(/\{date\}/g,dt).replace(/\{time\}/g,v.slot).replace(/\{service\}/g,v.service).replace(/ ,/g,',').replace(/ {2,}/g,' ');
    const body=withAgent(text);
    let sent=false;
    const {data:dup}=await sb.from('gl_wa_outbox').select('id').eq('chat_jid',CUR.chat_jid).eq('body',body).gte('created_at',new Date(Date.now()-600000).toISOString()).limit(1);
    if(!(dup&&dup.length)){
      const {error:oe}=await sb.from('gl_wa_outbox').insert({chat_jid:CUR.chat_jid,phone:CUR.phone||null,body,staff_name:replyName()||null});
      if(oe) throw oe; sent=true; optSent(CUR,body);
    }
    BK_DONE[BK.jid+'|'+BK.li]='Booked '+dt+', '+v.slot+(sent?'. Confirmation queued.':'. Confirmation was already queued.');
    drawBook();
  }catch(e){ fail('Could not book: '+(e.message||e)); }
}

/* AUTO-BOOK (step 1 only). Off by default; the switch lives in Settings and is shared by every device
   (row 'enabled' in gl_crm_autobook). It only acts on the structured booking FORM the customer sends back,
   and only when everything is clear. One claim row per form means two open screens can never book twice.
   It books and shows an Undo on the chat. It does NOT send any WhatsApp confirmation. */
const AUTOBK={on:false,map:{},busy:false};
async function loadAutoBook(){
  try{
    const {data,error}=await sb.from('gl_crm_autobook').select('key,info,booking_id,at').order('at',{ascending:false}).limit(300);
    if(error) return;
    AUTOBK.map={}; (data||[]).forEach(r=>{ if(r.key==='enabled') AUTOBK.on=r.info==='on'; else AUTOBK.map[r.key]=r; });
  }catch(e){}
}
async function autoBookToggle(){
  const next=!AUTOBK.on;
  if(next&&!confirm('Switch ON auto-booking?\n\nWhen a customer sends back the filled booking form with everything clear, the CRM creates the booking by itself (no WhatsApp confirmation is sent). You can undo each one on the chat.')) return;
  const {error}=await sb.from('gl_crm_autobook').upsert({key:'enabled',info:next?'on':'off',at:new Date().toISOString()},{onConflict:'key'});
  if(error){ alert('Could not change it: '+error.message); return; }
  AUTOBK.on=next; renderSettings();
}
function autoBookSettingsHtml(){
  return '<div class="panel2" style="margin-top:14px"><div class="pt">Auto-booking (step 1)'
    +'<button class="mvbtn" style="float:right;margin-top:-3px" onclick="autoBookToggle()">'+(AUTOBK.on?'Switch off':'Switch on')+'</button></div>'
    +'<div style="padding:8px 12px;font-size:12px">Status: '+(AUTOBK.on?'<span class="chip rm">ON</span>':'<span class="chip chk">OFF</span>')
    +'<div style="color:var(--ink2);margin-top:4px">Books by itself only when the customer sends back the filled booking form with name, plate, service, a future date (within 60 days) and one of the 5 time slots, the slot is not full and there is no double booking. No WhatsApp confirmation is sent. Each one shows an Undo on the chat.</div></div></div>';
}
function bkDetectRows(rows,c){
  const q=miaQuestion(rows); if(!q) return null;
  const f=bkParse(q); const n=Object.keys(f).length;
  if(n<3||!(f.date||f.time)||!(f.plate||f.name)) return null;
  return {jid:c.chat_jid,li:miaLastIn(rows),n,name:f.name||c.name||'',phone:String(c.phone||'').replace(/\D/g,''),plate:(f.plate||'').toUpperCase(),
    car:f.car||'',service:f.service||'',date:bkDate(f.date),slot:bkSlot(f.time)||''};
}
function bkIsoToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function bkClear(d){
  if(!d||!d.li) return 'no form';
  if(!d.name||!d.plate||!d.service) return 'name, plate or service missing';
  if(d.phone.length<9) return 'no phone on the chat';
  if(!d.date||!d.slot) return 'date or slot unclear';
  const t=bkIsoToday(); const max=new Date(); max.setDate(max.getDate()+60);
  const mx=max.getFullYear()+'-'+String(max.getMonth()+1).padStart(2,'0')+'-'+String(max.getDate()).padStart(2,'0');
  if(d.date<t||d.date>mx) return 'date not within the next 60 days';
  return '';
}
async function bkAuto(d){
  const key=d.jid+'|'+d.li;
  if(AUTOBK.map[key]) return;
  const {error:ce}=await sb.from('gl_crm_autobook').insert({key,info:'claiming'});
  if(ce) return;                                                    // another screen already took it (or no access)
  AUTOBK.map[key]={key,info:'claiming'};
  const done=async(info,id)=>{ AUTOBK.map[key]={key,info,booking_id:id||null}; try{ await sb.from('gl_crm_autobook').update({info,booking_id:id||null}).eq('key',key); }catch(e){} if(CUR&&CUR.chat_jid===d.jid) drawBook(); };
  try{
    const {data:day,error:de}=await sb.from('gl_bookings').select('scheduled_at,notes,status').gte('scheduled_at',d.date+'T00:00:00+08:00').lte('scheduled_at',d.date+'T23:59:59+08:00');
    if(de) throw de;
    const live=(day||[]).filter(r=>String(r.status||'').toLowerCase()!=='cancelled');
    const same=live.find(r=>{ const n=String(r.notes||''); return (d.plate&&n.toUpperCase().includes('PLATE: '+d.plate)) || (d.phone&&n.replace(/\D/g,'').includes(d.phone.slice(-8))&&/Phone:/i.test(n)); });
    if(same) return done('skipped: already booked that day');
    const used=live.filter(r=>String(r.notes||'').includes('[slot:'+d.slot+']')).length;
    if(used>=2) return done('skipped: slot full');
    let custId=null;
    try{ const {data:ex}=await sb.from('gl_profiles').select('id').or('phone.eq.+'+d.phone+',phone.eq.'+d.phone).limit(1).maybeSingle(); if(ex) custId=ex.id; }catch(e){}
    const notes=['Name: '+d.name,'Phone: '+d.phone,'Car: '+d.car,'Plate: '+d.plate,'Auto-booked from WhatsApp form','[slot:'+d.slot+']'].join(' | ');
    const {data:ins,error:ie}=await sb.from('gl_bookings').insert({customer_id:custId,vehicle_id:null,service_id:null,service_name:d.service,
      scheduled_at:d.date+'T'+BK_SLOT24[d.slot]+':00+08:00',status:'pending',source:'whatsapp',lead_source:null,is_returning:false,
      referral_by_name:null,referral_by_ref:null,notes}).select('id').single();
    if(ie) throw ie;
    await done('booked '+d.date+' '+d.slot+' '+d.service,String(ins&&ins.id||''));
  }catch(e){ await done('failed: '+String(e.message||e).slice(0,120)); }
}
async function bkUndo(key){
  const r=AUTOBK.map[key]; if(!r||!r.booking_id) return;
  if(!confirm('Cancel this booking?')) return;
  const {error}=await sb.from('gl_bookings').update({status:'cancelled'}).eq('id',r.booking_id);
  if(error){ alert('Could not cancel: '+error.message); return; }
  r.info='cancelled by staff'; try{ await sb.from('gl_crm_autobook').update({info:r.info}).eq('key',key); }catch(e){}
  drawBook();
}
async function autoBookScan(jids){
  if(!AUTOBK.on||AUTOBK.busy) return;
  AUTOBK.busy=true;
  try{
    for(const jid of (jids||[]).slice(0,5)){
      const c=CHATS.find(x=>x.chat_jid===jid); if(!c) continue;
      const lm=LASTMSG[jid]; if(!lm||lm.direction!=='in') continue;
      const {data}=await sb.from('gl_wa_msg').select('direction,sent_by,msg_type,body,wa_ts').eq('chat_jid',jid).order('wa_ts',{ascending:false}).limit(30);
      const rows=(data||[]).slice().reverse();
      const d=bkDetectRows(rows,c); if(!d||bkClear(d)) continue;
      await bkAuto(d);
    }
  }catch(e){}
  AUTOBK.busy=false;
}

/* ---------------------------------------------------------------------------
   PHONE ALERTS / WEB PUSH (24 Nov). Each person taps "Phone alerts" once on their
   own phone or computer and allows notifications. The subscription is saved with
   gl_crm_push_save (reception only); the bridge on the shop PC sends the pushes
   (staged: NEW-FROM-CLAUDE\push). Android Chrome works as normal. iPhone only
   works after "Add to Home Screen", iOS 16.4 or newer.
   --------------------------------------------------------------------------- */
const VAPID_PUBLIC='BCkM_OFFX66gIN6m63Jo6oCKoU0bfnV50pNZsm8BUm5RctDXWFBYHwTJHjCSSZ5g_wembAeVx0iaH4Vru6Uyhvo';
function b64u(s){ const p='='.repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function pushReg(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return null;
  const scope=new URL('gl-crm.html',location.href).pathname;
  return navigator.serviceWorker.register('gl-crm-sw.js',{scope});
}
async function pushDraw(){
  const b=$('pushBtn'); if(!b) return;
  let on=false;
  try{ const r=await pushReg(); if(r){ const sub=await r.pushManager.getSubscription(); on=!!sub&&Notification.permission==='granted'; } }catch(e){}
  b.innerHTML='&#128241; Phone alerts '+(on?'on':'off'); b.style.background=on?'var(--gold)':'';
}
async function pushToggle(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      alert('This browser cannot do phone alerts. On iPhone: open the CRM in Safari, tap Share, Add to Home Screen, open it from the home screen, then try again (iOS 16.4 or newer).'); return; }
    const r=await pushReg(); await navigator.serviceWorker.ready;
    let sub=await r.pushManager.getSubscription();
    if(sub){ await sub.unsubscribe(); await pushDraw(); return; }   // the saved row stays; the bridge ignores dead ones
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ alert('Notifications were not allowed. Allow them for this site in the browser settings, then try again.'); return; }
    sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const {error}=await sb.rpc('gl_crm_push_save',{p_sub:sub.toJSON(),p_staff:(typeof replyName==='function'&&replyName())||null});
    if(error) throw error;
    await pushDraw();
    alert('Done. This device will get a notification when a customer writes (once the shop PC bridge push is switched on).');
  }catch(e){ alert('Could not turn on phone alerts: '+(e.message||e)); }
}

async function boot(){
  try{ ALERTS = localStorage.getItem('gl_crm_alerts')==='1' && Notification.permission==='granted'; }catch(e){}
  setTimeout(checkForUpdate, 20000);
  setInterval(checkForUpdate, 15*60000);
  setAlertBtn();
  pushDraw();
  setInterval(()=>{ if(!document.hidden && $('ov').classList.contains('hide')) load(); }, 5*60000);   // full reload is rare now
  liveStart();
  const want=(location.hash||'').replace('#','');
  if(NAV.some(n=>n.id===want)) VIEW=want;
  drawNav(); go(VIEW);
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); load(); }
  else $('gate').classList.remove('hide');
}
async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  if(!email||!pass){ $('loginErr').textContent='Enter email and password.'; return; }
  $('loginErr').textContent='Signing in…';
  let res;
  try{ res=await sb.auth.signInWithPassword({email,password:pass}); }
  catch(e){ $('loginErr').textContent='Network error: '+(e.message||e); return; }
  if(res.error){ $('loginErr').textContent='Login failed: '+res.error.message; return; }
  $('loginErr').textContent=''; $('gate').classList.add('hide');
  $('main').classList.remove('hide'); load();
}
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

$('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeThread(); });
boot();
