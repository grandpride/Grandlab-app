async function sendReply(){
  if(!CUR) return;
  const box=$('tBox'), btn=$('tSend'), note=$('tReplyNote');
  const typed=String(box.value||'').trim();
  const body=withAgent(typed);
  note.className='replyNote';
  if(!typed){ note.textContent='Nothing to send.'; return; }
  if(staffMode() && !ME){
    note.className='replyNote err';
    note.textContent='Pick who you are first, above the reply box.';
    return;
  }
  btn.disabled=true; box.disabled=true; note.textContent='Queueing…';

  // show it straight away so reception can see it went somewhere
  const pend=document.createElement('div');
  pend.className='msg pending';
  pend.textContent=body;
  const t=$('tThread'); t.appendChild(pend); t.scrollTop=t.scrollHeight;

  try{
    const {error}=await sb.from('gl_wa_outbox')
      .insert({chat_jid:CUR.chat_jid, phone:CUR.phone||null, body,
               staff_name: replyName()||null});
    if(error) throw error;
    box.value='';
    optSent(CUR,body);
    miaLogSent(CUR.chat_jid,typed);
    pend.textContent=body+'  ·  queued';
    note.textContent='Queued. The bridge on the shop PC sends it within a minute — it will appear in the thread once WhatsApp confirms.';
  }catch(e){
    pend.remove();
    note.className='replyNote err';
    note.textContent='Could not queue: '+(e.message||e);
  }finally{
    btn.disabled=false; box.disabled=false; box.focus();
  }
}

/* Voice notes / photos: press Play -> the bridge fetches that ONE file -> private bucket -> signed link.
   Nothing is downloaded in bulk. State is kept in MEDIA so a live refresh does not wipe the player. */
const MEDIA={};   // wa_id -> {st:'idle'|'wait'|'done'|'fail', url, msg}
function mediaHtml(wa,t){
  const m=MEDIA[wa]||{st:'idle'};
  if(m.st==='done'&&m.url)
    return '<div class="mbox">'+(t==='image'
      ? '<a href="'+esc(m.url)+'" target="_blank" rel="noopener"><img src="'+esc(m.url)+'" style="max-width:220px;max-height:220px;border-radius:8px"></a>'
      : '<audio controls preload="metadata" src="'+esc(m.url)+'" style="max-width:100%"></audio>')+'</div>';
  if(m.st==='wait') return '<div class="mbox"><span class="mst">Getting it from the phone… (about 10-20 s)</span></div>';
  return '<div class="mbox"><button class="mbtn" data-wa="'+esc(wa)+'" data-t="'+esc(t)+'">'+(t==='image'?'\u{1F5BC}️ Show photo':'▶ Play')+'</button>'
    +(m.st==='fail'?' <span class="mst" style="color:#c0392b">'+esc(m.msg||'could not open')+' — tap to retry</span>':'')+'</div>';
}
async function mediaSign(path){
  const {data,error}=await sb.storage.from('gl-wa-media').createSignedUrl(path,3600);
  if(error||!data) throw new Error((error&&error.message)||'no link');
  return data.signedUrl;
}
async function mediaOpen(wa,t){
  const jid=CUR&&CUR.chat_jid; if(!jid||(MEDIA[wa]&&MEDIA[wa].st==='wait')) return;
  MEDIA[wa]={st:'wait'}; loadThread(jid,true);
  try{
    let {data:ex}=await sb.from('gl_wa_media_req').select('id,status,path,error').eq('wa_id',wa).limit(1);
    let row=(ex||[])[0];
    if(!row){
      const {error}=await sb.from('gl_wa_media_req').insert({wa_id:wa,chat_jid:jid});
      if(error) throw new Error(error.message);
    }else if(row.status==='failed'){
      await sb.from('gl_wa_media_req').update({status:'queued',attempts:0,error:null}).eq('id',row.id);
    }
    const t0=Date.now();
    for(;;){
      if(Date.now()-t0>120000) throw new Error('took too long — is the bridge running?');
      const {data:r}=await sb.from('gl_wa_media_req').select('status,path,error').eq('wa_id',wa).limit(1);
      const x=(r||[])[0];
      if(x&&x.status==='done'&&x.path){ MEDIA[wa]={st:'done',url:await mediaSign(x.path)}; break; }
      if(x&&x.status==='failed') throw new Error(x.error||'could not download');
      await new Promise(r=>setTimeout(r,2000));
    }
  }catch(e){ MEDIA[wa]={st:'fail',msg:String(e.message||e).slice(0,120)}; }
  if(CUR&&CUR.chat_jid===jid) loadThread(jid,true);
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.mbtn'); if(!b) return;
  mediaOpen(b.getAttribute('data-wa'),b.getAttribute('data-t'));
});

async function loadThread(jid,quiet){
  try{
    const {data}=await sb.from('gl_wa_msg')
      .select('direction,sent_by,msg_type,body,wa_ts,wa_id')
      .eq('chat_jid',jid).order('wa_ts',{ascending:true}).limit(500);
    const rows=data||[];
    CUR_ROWS[jid]=rows;
    $('tThread').innerHTML = rows.length ? rows.map(m=>{
      const who=senderOf(m);
      // the header is shown as a label instead of inside the bubble, so the
      // thread does not read "Iqa: Iqa: ..."
      const mt=String(m.msg_type||'').toLowerCase();
      const isMedia=!String(m.body||'').trim()&&m.wa_id&&['voice','audio','image'].includes(mt);
      const body=isMedia ? (MEDIA_LABEL[mt]||'') : (who&&who.via==='crm'&&who.clean ? who.clean : msgText(m));
      return '<div class="msg '+(m.direction==='out'?'out':'in')+'">'
        +(who?'<span class="by '+(who.via==='phone'?'byph':'')+'">'+esc(who.name)+'</span>':'')
        +esc(body)
        +(isMedia?mediaHtml(m.wa_id,mt):'')
        +'<span class="t">'+esc(dmy(m.wa_ts))+'</span></div>';
    }).join('') : '<div class="msg sys">No messages recorded for this chat.</div>';
    if(CUR&&CUR.chat_jid===jid&&(!quiet||!BK||BK.li!==miaLastIn(rows))) drawBook();
    const o=OPT[jid];
    if(o&&o.body&&!(rows.length&&rows[rows.length-1].direction==='out'&&new Date(rows[rows.length-1].wa_ts).getTime()>=o.at-60000)){
      $('tThread').insertAdjacentHTML('beforeend','<div class="msg pending">'+esc(o.body)+'  ·  queued</div>');
    }
    const t=$('tThread'); t.scrollTop=t.scrollHeight;
    if(CUR && CUR.chat_jid===jid){
      const lastTs=rows.length?rows[rows.length-1].wa_ts:null;
      const known=MIA_STATE&&MIA_STATE.jid===jid&&MIA_STATE.rows.length?MIA_STATE.rows[MIA_STATE.rows.length-1].wa_ts:null;
      if(!quiet||lastTs!==known) miaOffer(jid,rows);
    }
  }catch(e){
    $('tThread').innerHTML='<div class="msg sys">Could not load messages: '+esc(e.message||e)+'</div>';
  }
}

   about them. Matched on the last 8 digits because phone formats in
   gl_profiles and gl_walkin are inconsistent. */

  try{
    const [{data:prof},{data:walk}]=await Promise.all([
      sb.from('gl_profiles')
        .select('name,phone,email,tier,tier_expires_at,wallet,wallet_member,points')
        .ilike('phone','%'+key).limit(1),
      sb.from('gl_walkin').select('name,plate,model,last_service,visit_count')
        .ilike('phone','%'+key).limit(12)
    ]);

          +(isMember?' <span class="chip mem">'+esc(p.tier||'Member')+'</span>':''));
      if(p.email) h+=row('Email',esc(p.email));

          + (Number(p.wallet_member)>0?' <span style="color:var(--text2)">('+esc(RM(p.wallet_member))+' member credit)</span>':''));
      if(Number(p.points)>0) h+=row('G Coin', esc(p.points));
    }
    if(cars.length){
      h+=row('Cars', cars.map(c=>'<b>'+esc(c.plate||'—')+'</b>'+(c.model?' '+esc(c.model):'')).join('<br>'));
      const seen=cars.map(c=>c.last_service).filter(Boolean).sort().pop();
      if(seen) h+=row('Last service', esc(dmy(seen)));
      const visits=cars.reduce((s,c)=>s+(Number(c.visit_count)||0),0);
      if(visits) h+=row('Visits', esc(visits));

    if(!h) h=row('Customer','Not in Grandlab records yet — new enquiry.');
    if(CUR&&CUR.remark) h+=row('Note', esc(CUR.remark));
    h+='<div class="row" style="margin-top:5px"><span class="k"></span><span>'
      +'<a class="btn btn2 btn-xs" target="_blank" rel="noopener" href="gl-customers.html">Open in GL Customers</a> <button class="btn btn2 btn-xs" onclick="custFormOpen()">Save customer</button> <button class="btn btn2 btn-xs" onclick="bkManual()">Book appointment</button></span></div>';
    window.__REC={name:(p&&p.name)||((cars.find(c=>c.name)||{}).name)||(CUR&&CUR.name)||'',plate:(cars[0]&&cars[0].plate)||'',model:(cars[0]&&cars[0].model)||''};
    $('tRec').innerHTML=h;
    loadRecordExtra(key,p,CUR&&CUR.chat_jid);
  }catch(e){
    $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span class="err">Lookup failed: '+esc(e.message||e)+'</span></div>';
  }
}

/* ---- alerts -------------------------------------------------------------
   Reception keeps this open all day, so the board should speak up instead of
   waiting to be looked at. Only new arrivals in "Needs reply" raise a popup,
   and never on the first load, or opening the app would fire fifteen at once. */
let ALERTS = false, KNOWN_REPLY = null;

function setAlertBtn(){
  $('alertBtn').innerHTML = ALERTS ? '&#128276; Alerts on' : '&#128276; Alerts off';
  $('alertBtn').style.background = ALERTS ? 'var(--gold)' : '';
}
async function toggleAlerts(){
  if(ALERTS){ ALERTS=false; try{localStorage.setItem('gl_crm_alerts','0');}catch(e){} setAlertBtn(); return; }
  if(!('Notification' in window)){ alert('This browser cannot show alerts.'); return; }
  let p=Notification.permission;
  if(p!=='granted') { try{ p=await Notification.requestPermission(); }catch(e){} }
  if(p!=='granted'){ alert('Alerts are blocked for this site. Allow notifications in the browser settings, then try again.'); return; }
  ALERTS=true; try{localStorage.setItem('gl_crm_alerts','1');}catch(e){} setAlertBtn();
  new Notification('Grandlab CRM', {body:'Alerts are on. You will be told when a customer is waiting.', icon:'icon-192.png'});
}
function alertNewReplies(replyList){
  const ids=new Set(replyList.map(c=>c.chat_jid));
  if(KNOWN_REPLY===null){ KNOWN_REPLY=ids; return; }          // first load: just remember
  const fresh=replyList.filter(c=>!KNOWN_REPLY.has(c.chat_jid));
  KNOWN_REPLY=ids;
  if(!ALERTS || !fresh.length || Notification.permission!=='granted') return;
  const one=fresh[0];
  const who=(one.name&&String(one.name).trim())?one.name:(one.phone||'A customer');
  const body=fresh.length===1
    ? who+' is waiting for a reply'
    : fresh.length+' customers are waiting for a reply';
  try{
    const n=new Notification('Grandlab CRM', {body, icon:'icon-192.png', tag:'gl-crm-reply', renotify:true});
    n.onclick=()=>{ window.focus(); if(fresh.length===1) openThread(one.chat_jid); n.close(); };
  }catch(e){}
}

/* ---- Dashboard ----

   Colours do a job here, they are not decoration:
   - the pipeline uses status colours (critical / warning / muted / good) and
     every row is labelled, so the dot is never the only thing saying which
     is which
   - the monthly chart has two series, so it uses a validated categorical
     pair: #2563EB in, #D97706 out. That pair clears CVD separation at
     ΔE 32 (protan) and 38 at normal vision - blue+violet, the obvious pick,
     came out at ΔE 0.4 for deuteranopes and was thrown away. */
const C_IN='#2563EB', C_OUT='#D97706';
const STAGE_COLOR={reply:'#DC2626', waiting:'#D97706', quiet:'#94A3B8', closed:'#64748B', paid:'#15803D'};

const kpi=(v,k,s,cls,ico,icoBg)=>'<div class="kpi '+(cls||'')+'">'
  +(ico?'<div class="chip-ico" style="background:'+icoBg+'">'+ico+'</div>':'')
  +'<div class="v">'+esc(v)+'</div>'
  +'<div class="k">'+esc(k)+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>';

/* Grouped bars. Thin marks, rounded data-ends anchored to the baseline, a 2px
   gap between the pair, recessive axis, legend plus hover rather than a number
   printed on every bar. */
function monthlyChart(rows){
  if(!rows.length) return '';
  const W=760,H=190, padL=38,padR=10,padT=10,padB=26;
  const n=rows.length, iw=(W-padL-padR)/n;
  const max=Math.max(1,...rows.map(r=>Math.max(r.msgs_in,r.msgs_out)));
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  const bw=Math.max(5,Math.min(16,(iw-10)/2));
  const ticks=[0,Math.round(max/2),max];

  let g='';
  ticks.forEach(t=>{ g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(t)+'" y2="'+y(t)
    +'" stroke="#E8ECF1" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y(t)+3.5)
    +'" text-anchor="end" font-size="10" fill="#94A3B8">'+t+'</text>'; });

  rows.forEach((r,i)=>{
    const cx=padL+iw*i+iw/2, base=y(0);
    [[r.msgs_in,C_IN,-1,'in'],[r.msgs_out,C_OUT,1,'out']].forEach(([v,col,side,lab])=>{
      const h=Math.max(v>0?2:0, base-y(v));
      if(!h) return;
      const x=cx+(side<0?-bw-1:1);
      g+='<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+col+'"'
        +' data-tip="'+esc(r.mon+' · '+v+' '+lab)+'"/>';
    });
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#94A3B8">'
      +esc(String(r.mon).slice(5)+'/'+String(r.mon).slice(2,4))+'</text>';
  });
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#CBD5E1" stroke-width="1"/>';

  return '<div class="legend"><span><i style="background:'+C_IN+'"></i>From customers</span>'
    +'<span><i style="background:'+C_OUT+'"></i>From us</span></div>'
    +'<div class="chartwrap" style="padding-top:0"><svg viewBox="0 0 '+W+' '+H
    +'" style="width:100%;height:auto;display:block" role="img"'
    +' aria-label="Messages per month, from customers and from us">'
    +g+'</svg></div>';
}

/* ---- Leads: where they came from, and what they asked about ---- */
let LEADFILT={src:'', enq:''};
function setLeadFilt(k,v){ LEADFILT[k]=v; renderLeads(); }

function renderLeads(){
  let rows=LEADS().slice().sort((a,b)=>new Date(b.last_in_at||0)-new Date(a.last_in_at||0));
  const info=j=>LEADINFO[j]||{};

  // group by where they came from, and by what they want
  const bySrc={}, byEnq={};
  rows.forEach(c=>{

/* ---- Ads ----
   Straight from the hourly Meta sync, so this is what Meta itself reports -
   not an estimate. The one number that is ours is "traced": conversations we
   can tie back to the advert that started them. */
/* Money earned from the chats we can actually tie to this advert.
   Only the tagged ones — see the note under the table. */
function adMoney(adId){
  let rm=0, won=0, chats=0;
  if(!adId) return {rm:0,won:0,chats:0};
  for(const c of CHATS){
    const li=LEADINFO[c.chat_jid];
    if(!li || String(li.ad_id||'')!==String(adId)) continue;
    chats++;
    const w=wonAt(c);
    if(w){ won++; rm+=Number((OVER[c.chat_jid]||{}).revenue)||0; }
  }
  return {rm,won,chats};
}

/* The verdict. Rules, not a hunch, and the card says which rule fired.
   Built only on figures that hold up: spend, results, cost per result and its
   movement across the two halves of the window, and CTR. Reach is shown but
   never judged on — see the note at the bottom of the view. */
function verdict(a, avgCpr){
  const sp=Number(a.spend||0), cv=Number(a.conversations||0);
  const days=Number(a.days_running||0);
  const cpr=cv?sp/cv:null;
  const nowC=Number(a.conv_now||0), prevC=Number(a.conv_prev||0);
  const cNow=nowC?Number(a.spend_now||0)/nowC:null;
  const cPrev=prevC?Number(a.spend_prev||0)/prevC:null;
  const st=String(a.status||'').toUpperCase();

  if(!['ACTIVE','LEARNING'].includes(st))
    return {k:'early',t:'Paused',why:'Not running. Figures below are what it did while it was on.'};
  if(sp<=0)
    return {k:'early',t:'No spend',why:'Live but it has not spent anything in this window. Either the ad set is off or it is losing every auction — worth a look in Ads Manager.'};
  if(sp>=150 && cv===0)
    return {k:'stop',t:'Stop',why:'<b>'+RM(sp)+' spent and not one conversation.</b> Nothing here is working — turn it off or rewrite it.'};
  if(days<4)
    return {k:'early',t:'Too early',why:'Only '+days+' day'+(days===1?'':'s')+' of spend. Leave it alone until it has about a week.'};
  if(cNow!=null && cPrev!=null && cNow > cPrev*1.3)
    return {k:'watch',t:'Slowing',why:'<b>Cost per enquiry has risen from '+RM(cPrev)+' to '+RM(cNow)+'</b> between the first and second half of this window. Same money is buying fewer enquiries — refresh the creative or the offer.'};
  if(cNow!=null && cPrev!=null && cNow < cPrev*0.8)
    return {k:'keep',t:'Improving',why:'<b>Cost per enquiry has fallen from '+RM(cPrev)+' to '+RM(cNow)+'.</b> It is getting cheaper, not dearer. Leave it running; this is the one to put more behind.'};
  if(cpr!=null && avgCpr && cpr <= avgCpr*0.85)
    return {k:'keep',t:'Keep',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)+' average.</b> Cheaper than the rest of your account. Steady — leave it.'};
  if(cpr!=null && avgCpr && cpr >= avgCpr*1.5)
    return {k:'watch',t:'Review',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)+' average</b> — half as efficient as the rest. Worth rewriting before it eats more budget.'};
  const rel = (cpr!=null && avgCpr) ? cpr/avgCpr : null;
  if(rel!=null && rel>1.15)
    return {k:'watch',t:'Dearer than most',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)
      +' average</b> — about '+Math.round((rel-1)*100)+'% more. Not bad enough to stop, but this is the first one to rewrite if you want cheaper enquiries.'};
  return {k:'keep',t:'Steady',why:'Holding at '+(cpr!=null?RM(cpr):'—')+' an enquiry, in line with your '+(avgCpr?RM(avgCpr):'—')+' average. Nothing to change.'};
}

async function setAdDays(d){
  ADDAYS=d;
  $('vAds').innerHTML='<div class="h1">Ads</div><div class="h1s">Loading '+d+' days…</div>';
  try{ const {data}=await sb.rpc('gl_crm_ads',{p_days:d}); ADS=data||[]; }catch(e){}
  renderAds();
}

/* Money and chats per ad code. Spend comes from Meta for every ad that carries
   the code; chats are the ones we could tie to that code (found in the welcome
   message, or picked by hand) that first wrote within the same window. */
function adCodeTable(){
  const num=v=>Number(v||0);
  const since=Date.now()-ADDAYS*86400000;
  const codes=(AD_CODES||[]).map(a=>a.code);
  if(!codes.length) return '';
  const rows=codes.map(code=>{
    const mine=ADS.filter(a=>ADCODEMAP[String(a.ad_id)]===code);
    const spend=mine.reduce((s,a)=>s+num(a.spend),0);
    const meta=mine.reduce((s,a)=>s+num(a.conversations),0);
    let chats=0, won=0, rm=0, nl=0;
    CHATS.forEach(c=>{
      const li=LEADINFO[c.chat_jid]; if(!li) return;
      if(!['tagged','code'].includes(li.src_kind) || String(li.src_label||'').toUpperCase()!==code) return;
      const t=new Date(c.first_in_at||c.last_in_at||0).getTime();
      if(!(t>=since)) return;
      if(String(c.status||'').toLowerCase()==='notlead'){ nl++; return; }
      chats++;
      if(wonAt(c)){ won++; rm+=Number((OVER[c.chat_jid]||{}).revenue)||0; }
    });
    return {code,offer:((AD_CODES.find(a=>a.code===code)||{}).offer)||'',spend,meta,chats,nl,won,rm};
  }).filter(r=>r.spend>0||r.chats>0||r.nl>0).sort((a,b)=>b.spend-a.spend||b.chats-a.chats);
  if(!rows.length) return '';
  const tot=rows.reduce((t,r)=>({spend:t.spend+r.spend,chats:t.chats+r.chats,won:t.won+r.won,rm:t.rm+r.rm}),{spend:0,chats:0,won:0,rm:0});
  return '<div class="panel2" style="margin-bottom:14px"><div class="pt">By ad code &mdash; last '+ADDAYS+' days</div>'
    +'<div style="overflow-x:auto"><table class="t2"><thead><tr><th>Code</th><th>Spent</th><th>Meta counted</th><th>Real leads</th><th>Not a lead</th><th>Cost / chat</th><th>Won</th><th>Won RM</th></tr></thead><tbody>'
    +rows.map(r=>'<tr style="cursor:default"><td><b>'+esc(r.code)+'</b>'+(r.offer?'<div style="color:var(--ink2);font-size:11px">'+esc(r.offer)+'</div>':'')+'</td>'
      +'<td>'+esc(RM(r.spend))+'</td><td>'+r.meta+'</td><td><b>'+r.chats+'</b></td><td>'+(r.nl||'&mdash;')+'</td>'
      +'<td>'+(r.chats&&r.spend?esc(RM(r.spend/r.chats)):'&mdash;')+'</td>'
      +'<td>'+r.won+'</td><td>'+(r.rm?esc(RM(r.rm)):'&mdash;')+'</td></tr>').join('')
    +'<tr style="cursor:default;font-weight:800"><td>Total</td><td>'+esc(RM(tot.spend))+'</td><td></td><td>'+tot.chats+'</td><td>'+rows.reduce((t,r)=>t+r.nl,0)+'</td>'
      +'<td>'+(tot.chats&&tot.spend?esc(RM(tot.spend/tot.chats)):'&mdash;')+'</td><td>'+tot.won+'</td><td>'+(tot.rm?esc(RM(tot.rm)):'&mdash;')+'</td></tr>'
    +'</tbody></table></div>'
    +'<div style="padding:8px 14px;font-size:11px;color:var(--ink2)">&ldquo;Chats tied&rdquo; only counts chats where the ad code was found or picked, so it is a floor. '
    +'Compare it with what Meta counted, not as a replacement for it.</div></div>';
}

function renderAds(){
  const num=v=>Number(v||0);
  const live=ADS.filter(a=>['ACTIVE','LEARNING'].includes(String(a.status||'').toUpperCase()));
  const spend=ADS.reduce((s,a)=>s+num(a.spend),0);
  const conv=ADS.reduce((s,a)=>s+num(a.conversations),0);
  const traced=ADS.reduce((s,a)=>s+num(a.traced_leads),0);
  const imps=ADS.reduce((s,a)=>s+num(a.impressions),0);
  const clicks=ADS.reduce((s,a)=>s+num(a.clicks),0);
  const avgCpr=conv?spend/conv:0;
  const tab=d=>'<span class="fchip'+(ADDAYS===d?' on':'')+'" onclick="setAdDays('+d+')">'+d+' days</span>';

  const sorted=ADS.slice().sort((a,b)=>num(b.spend)-num(a.spend));
  let dodgyReach=0;

  const cards=sorted.map(a=>{
    const sp=num(a.spend), cv=num(a.conversations), im=num(a.impressions),
          rc=num(a.reach), ck=num(a.clicks), days=num(a.days_running);
    const cpr=cv?sp/cv:null;
    const ctr=im?ck/im*100:null;
    const cpm=im?sp/im*1000:null;
    const nowC=num(a.conv_now), prevC=num(a.conv_prev);
    const cNow=nowC?num(a.spend_now)/nowC:null;
    const cPrev=prevC?num(a.spend_prev)/prevC:null;
    const v=verdict(a,avgCpr);
    const st=String(a.status||'').toUpperCase();
    const dot=st==='ACTIVE'?'#15803D':(st==='LEARNING'?'#2563EB':'#94A3B8');
    const money=adMoney(a.ad_id);
    const freq=rc?im/rc:null;
    const reachOdd = freq!=null && freq>5;
    if(reachOdd) dodgyReach++;

    let trend='<span style="color:var(--ink2)">—</span>';
    if(cNow!=null&&cPrev!=null){
      const up=cNow>cPrev;
      const pc=Math.round(Math.abs(cNow-cPrev)/cPrev*100);
      trend='<span class="'+(up?'up':'dn')+'">'+(up?'&#9650;':'&#9660;')+' '+pc+'%</span>';
    } else if(cNow!=null) trend='<span style="font-size:12px;color:var(--ink2)">new</span>';

    const cell=(l,val,sub)=>'<div class="mcell"><div class="ml">'+l+'</div>'
      +'<div class="mv">'+val+'</div>'+(sub?'<div class="ms">'+sub+'</div>':'')+'</div>';

    return '<div class="adcard">'
      +'<div class="ah">'
        +'<div class="an"><span class="dot" style="display:inline-block;background:'+dot+';margin-right:7px"></span>'
          +esc(a.ad_name||'(unnamed)')
          +(a.campaign?'<div class="ac">'+esc(a.campaign)+'</div>':'')+'</div>'
        +'<span class="verd v-'+v.k+'">'+esc(v.t)+'</span>'
      +'</div>'
      +'<div class="mgrid">'
        +cell('Spent',esc(RM(sp)),days?days+' day'+(days===1?'':'s')+' of spend':'')
        +cell('Results',String(cv),'conversations')
        +cell('Cost / result',cpr!=null?esc(RM(cpr)):'—',
              avgCpr?('avg '+RM(avgCpr)):'')
        +cell('Trend',trend, cPrev!=null?(RM(cPrev)+' &rarr; '+(cNow!=null?RM(cNow):'—')):'first period')
        +cell('Impressions',im.toLocaleString(), cpm!=null?(RM(cpm)+' per 1,000'):'')
        +cell('Clicks',ck.toLocaleString(), ctr!=null?(ctr.toFixed(2)+'% CTR'):'')
        +cell('Reach',rc?rc.toLocaleString():'—',
              reachOdd?'<span class="flagw">looks wrong</span>':(freq!=null?freq.toFixed(1)+'&times; each':''))
        +cell('Daily budget','<span style="font-size:12px;color:var(--ink2);font-weight:600">not synced</span>','')
        +cell('Traced chats',String(num(a.traced_leads)),
              money.won?(money.won+' won &middot; '+RM(money.rm)):'')
      +'</div>'
      +'<div class="why">'+v.why+'</div>'
      +'</div>';
  }).join('');

  $('vAds').innerHTML=
    '<div class="h1">Ads</div>'
   +'<div class="h1s">Straight from your Meta account, synced hourly. '
     +(ADS.length&&ADS[0].last_day?('Figures to '+esc(dmyShort(ADS[0].last_day))+'. '):'')
     +'The verdict on each advert is worked out here, and every card says which rule it used.</div>'
   +'<div class="fchips" style="padding:0 0 12px">'+tab(7)+tab(30)+tab(90)+'</div>'
   +'<div class="cards">'
     +kpi(RM(spend),'Spent','last '+ADDAYS+' days','','&#9650;','#FEF3C7')
     +kpi(conv,'Results','conversations Meta counted','','&#9993;','#EEF3FE')
     +kpi(avgCpr?RM(avgCpr):'—','Cost per result','your account average','','&#9878;','#DCFCE7')
     +kpi(imps?(clicks/imps*100).toFixed(2)+'%':'—','CTR',clicks.toLocaleString()+' clicks of '+imps.toLocaleString())
     +kpi(live.length,'Running now','of '+ADS.length+' with figures')
   +'</div>'
   +adCodeTable()
   +(ADS.length?cards
     :'<div class="panel2"><div style="padding:22px;text-align:center;color:var(--ink2)">No ad figures synced yet.</div></div>')
   +'<div class="soonbox" style="margin-top:4px">'
     +'<b>Two things on this page are not solid, so read them as such.</b><br>'
     +'&bull; <b>Daily budget is missing.</b> The hourly sync pulls each advert but not the ad set it sits in, '
       +'and the budget lives on the ad set. Every card says &ldquo;not synced&rdquo; rather than showing a guess. '
       +'One change to the sync function fixes it &mdash; it is a deploy, so it needs you.<br>'
     +'&bull; <b>Reach is unreliable.</b> '+(dodgyReach?dodgyReach+' of the adverts below report':'Some rows report')
       +' more than five views per person, a few far more, which cannot be right. '
       +'Reach is shown but no verdict is based on it, so none of the advice above leans on a bad number.<br>'
     +'&bull; <b>'+traced+' of '+conv+' conversations can be traced</b> back to the advert that started them. '
       +'That is the missing click-to-WhatsApp tag on incoming messages, not a problem with the spend figures. '
       +'Until it is closed, &ldquo;traced chats&rdquo; and the ringgit beside it are a floor, not the total.'
   +'</div>';
}

/* ---- Reports ---- */
function renderReports(){
  const over=Object.values(OVER);
  const withJobs=over.filter(o=>o.jobs>0);
  const rev=withJobs.reduce((s,o)=>s+(Number(o.revenue)||0),0);
  const avg=withJobs.length?rev/withJobs.length:0;

  // lead_source as recorded on the jobs themselves
  const bySrc={};
  withJobs.forEach(o=>{
    const keys=(o.lead_sources||'').split(',').map(s=>s.trim()).filter(Boolean);
    const list=keys.length?keys:['(not recorded)'];
    list.forEach(k=>{ bySrc[k]=bySrc[k]||{n:0,rm:0}; bySrc[k].n++; bySrc[k].rm+=Number(o.revenue)/list.length; });
  });
  const srcRows=Object.entries(bySrc).sort((a,b)=>b[1].rm-a[1].rm);
  const maxSrc=srcRows.length?srcRows[0][1].rm||1:1;

  // conversations started per month
  const byMon={};
  CHATS.forEach(c=>{ const d=c.first_in_at||c.last_in_at; if(!d) return;
    const k=String(d).slice(0,7); byMon[k]=(byMon[k]||0)+1; });
  const monRows=Object.entries(byMon).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8);
  const maxMon=monRows.reduce((m,r)=>Math.max(m,r[1]),1);

  $('vReports').innerHTML=
    '<div class="h1">Reports</div>'
   +'<div class="h1s">What your WhatsApp conversations are actually worth.</div>'
   +'<div class="cards">'
     +kpi(RM(rev),'Revenue behind chats','from '+withJobs.length+' paying customers','win')
     +kpi(RM(avg),'Average per customer')
     +kpi(Math.round(withJobs.length/Math.max(1,CHATS.length)*100)+'%','Chats that became customers')
   +'</div>'
   +'<div class="panel2"><div class="pt">Where that work was recorded as coming from</div>'
   +'<table class="t2"><thead><tr><th>Lead source</th><th>Customers</th><th>Revenue</th><th style="width:34%"></th></tr></thead><tbody>'
   +srcRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+esc(RM(v.rm))+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v.rm/maxSrc*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>'
   +'<div class="panel2"><div class="pt">New conversations per month</div>'
   +'<table class="t2"><thead><tr><th>Month</th><th>Conversations</th><th style="width:50%"></th></tr></thead><tbody>'
   +monRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v/maxMon*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>';
}

const dmyShort=s=>{const d=new Date(s);return isNaN(d)?String(s):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};

/* dated first, soonest at the top; undated last */
function taskSort(a,b){
  if(!a.due_on && !b.due_on) return b.id-a.id;

/* ---- staying up to date -------------------------------------------------
   GitHub Pages and an installed app both cache the HTML, so reception can sit
   on a version from days ago without knowing - which is exactly what happened
   on 23 Nov, where a fixed sidebar looked broken because the old page was
   still loaded. So the page checks for itself and offers a reload rather than
   relying on anyone remembering Ctrl+Shift+R. */
function hardReload(){
  const u=location.pathname+'?v='+Date.now()+(location.hash||'');
  location.replace(u);
}
async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+'?cb='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const txt=await r.text();
    const m=/const BUILD='([^']+)'/.exec(txt);
    if(m && m[1] && m[1]!==BUILD) $('updNote').classList.remove('hide');
  }catch(e){ /* offline or blocked - never let this break the page */ }
}

/* One tooltip element, delegated — every mark with data-tip gets a hover
   readout without a listener per bar. */
(function(){
  const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{
    const t=e.target && e.target.getAttribute && e.target.getAttribute('data-tip');
    if(!t){ tip.classList.remove('on'); return; }
    tip.textContent=t; tip.classList.add('on');
  });
  document.addEventListener('mousemove',e=>{
    if(!tip.classList.contains('on')) return;
    tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8, e.clientX+12)+'px';
    tip.style.top=Math.max(4, e.clientY-tip.offsetHeight-10)+'px';
  });
})();


/* ---------------------------------------------------------------------------
   LIVE UPDATES (24 Nov). Before: the whole board reloaded every 60s, and not at
   all while a chat was open or the tab was in the background, so a customer
   reply could sit unseen for minutes. Now:
   - Supabase Realtime on gl_wa_chat / gl_wa_msg pushes a change straight away
   - a light poll every 10s asks ONLY for chats changed since the watermark
     (about 60 ms, a few KB) and is the safety net if realtime is down
   - the full reload (about 1 s, 440 KB) runs every 5 minutes
   - going back to the tab refreshes at once
   --------------------------------------------------------------------------- */
const LIVE={wm:null,busy:false,lastOk:0,lastFull:0,rt:'off',chan:null,timer:null};
const OPT={};   // jid -> {at,prevOut,until,body,prev}  optimistic "we just replied"
function ms(t){ return t?new Date(t).getTime():0; }

/* A reply is queued, then the bridge sends it, then wacli reports it, then the
   bridge imports it: up to a minute. Until the server shows it, treat the chat
   as answered NOW so it moves to "Waiting on them" at once and cannot flip
   back after the next refresh. Dropped as soon as the server's own
   last_out_at moves past what it was when we sent, or after 20 minutes. */
function optSent(c,body){
  if(!c) return;
  const at=Date.now();
  OPT[c.chat_jid]={at,prevOut:ms(c.last_out_at),until:at+20*60000,body,
    prev:{chat_jid:c.chat_jid,direction:'out',body,msg_type:'text',wa_ts:new Date(at).toISOString()}};
  applyOpt(c);
  LASTMSG[c.chat_jid]=OPT[c.chat_jid].prev;
  render(); drawNav();
}
function applyOpt(c){
  const o=OPT[c.chat_jid]; if(!o) return;
  const srv=ms(c.last_out_at);
  if(srv>o.prevOut || Date.now()>o.until){ delete OPT[c.chat_jid]; return; }
  c.last_out_at=new Date(Math.max(srv,o.at)).toISOString();
}

function liveWm(){
  let m=0; CHATS.forEach(c=>{ m=Math.max(m,ms(c.updated_at),ms(c.last_in_at),ms(c.last_out_at)); });
  return m;
}
function liveMark(ok){
  if(ok) LIVE.lastOk=Date.now();
  liveDraw();
}
function liveDraw(){
  let el=$('liveDot');
  if(!el){
    el=document.createElement('div'); el.id='liveDot';
    el.style.cssText='position:fixed;left:10px;bottom:8px;z-index:50;font:11px system-ui,sans-serif;color:#667;background:rgba(255,255,255,.92);border:1px solid #dde;border-radius:10px;padding:2px 8px;display:flex;gap:5px;align-items:center;pointer-events:none';
    document.body.appendChild(el);
  }
  const age=LIVE.lastOk?Math.round((Date.now()-LIVE.lastOk)/1000):null;
  const fresh=age!==null&&age<30;
  el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:'+(fresh?'#1a9d4b':'#d33')+'"></span>'
    +(age===null?'connecting…':(fresh?'live':'stale')+' · updated '+(age<3?'just now':age+'s ago'));
}
async function liveRefresh(){
  if(LIVE.busy||!CHATS.length) return;
  LIVE.busy=true;
  try{
    const wm=new Date(Math.max(0,liveWm()-120000)).toISOString();
    const {data,error}=await sb.from('gl_wa_chat').select(CHAT_COLS)
      .or('updated_at.gt.'+wm+',last_in_at.gt.'+wm+',last_out_at.gt.'+wm).limit(200);
    if(error) throw error;
    const rows=data||[];
    const changed=[];
    rows.forEach(r=>{
      const cur=CHATS.find(c=>c.chat_jid===r.chat_jid);
      const diff=!cur||ms(cur.last_in_at)!==ms(r.last_in_at)||ms(cur.last_out_at)!==ms(r.last_out_at)
        ||cur.status!==r.status||ms(cur.ghost_at)!==ms(r.ghost_at)||cur.name!==r.name||cur.remark!==r.remark||cur.stage!==r.stage||ms(cur.updated_at)!==ms(r.updated_at);
      if(cur){ Object.assign(cur,r); applyOpt(cur); } else { applyOpt(r); CHATS.unshift(r); }
      if(diff) changed.push(r.chat_jid);
    });
    if(changed.length){
      const {data:ms_}=await sb.from('gl_wa_msg').select('chat_jid,direction,body,msg_type,wa_ts')
        .in('chat_jid',changed).order('wa_ts',{ascending:false}).limit(changed.length*4);
      const seen={};
      (ms_||[]).forEach(m=>{ if(seen[m.chat_jid]) return; seen[m.chat_jid]=1;
        const o=OPT[m.chat_jid]; if(o&&ms(m.wa_ts)<o.at) return; LASTMSG[m.chat_jid]=m; });
      staleCheck(); render(); drawNav();
      if(VIEW==='dash') renderDash(); else if(VIEW==='leads') renderLeads();
      if(CUR&&changed.includes(CUR.chat_jid)) loadThread(CUR.chat_jid,true);
      if(typeof liveAfterChange==='function') liveAfterChange(changed);
    }
    // a queued reply that failed to send must not look answered
    const pend=Object.keys(OPT);
    if(pend.length){
      try{
        const since=new Date(Math.min(...pend.map(j=>OPT[j].at))-60000).toISOString();
        const {data:ob}=await sb.from('gl_wa_outbox').select('chat_jid,status').in('chat_jid',pend).eq('status','failed').gte('created_at',since);
        (ob||[]).forEach(r=>{ delete OPT[r.chat_jid]; const c=CHATS.find(x=>x.chat_jid===r.chat_jid); if(c){ const f=ms(c.last_out_at); } });
        if((ob||[]).length) { await load(); }
      }catch(e){}
    }
    liveMark(true);
  }catch(e){ liveDraw(); }
  LIVE.busy=false;
}
function liveKick(){ clearTimeout(LIVE.kt); LIVE.kt=setTimeout(liveRefresh,300); }
function liveStart(){
  setInterval(()=>{ if(!document.hidden) liveRefresh(); },10000);
  setInterval(liveDraw,5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ liveRefresh(); if(Date.now()-LIVE.lastFull>60000 && $('ov').classList.contains('hide')) load(); } });
  try{
    const ch=sb.channel('gl-crm-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'gl_wa_chat'},liveKick)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'gl_wa_msg'},liveKick)
      .subscribe(st=>{ LIVE.rt=st; });
    LIVE.chan=ch;
  }catch(e){ LIVE.rt='off'; }
}

/* ---------------------------------------------------------------------------
   MIA IN THE BACKGROUND (24 Nov). Before: open a chat, wait for MIA, open the
   next. Now every "Needs reply" chat gets a suggestion prepared in the
   background (newest first, at most 3 calls running, at most 15 new per scan,
   skipped when the saved suggestion is still for the same last message), so
   the card says "MIA ready" and opening it is instant. Nothing is ever sent.
   --------------------------------------------------------------------------- */
const MIA_BG={run:0,max:3,cap:15,st:{},queue:[],budget:15,t0:Date.now()};   // 15 suggestions per page load; chats whose customer writes AFTER the page opened are always prepared
function miaBgOn(){ try{ return localStorage.getItem('gl_crm_mia_bg')!=='0'; }catch(e){ return true; } }
function miaBgToggle(){ try{ localStorage.setItem('gl_crm_mia_bg',miaBgOn()?'0':'1'); }catch(e){} drawSortBar(); if(miaBgOn()) miaBgScan(); }
/* The moment the suggestion is "for": the customer's last message for a Needs-reply
   chat, or OUR last message for a chat that has waited 12h+ on them (a reminder). */
function miaStamp(c){ return colOf(c)==='waiting' ? c.last_out_at : c.last_in_at; }
function miaReady(c){
  const k=MIA_CACHE[c.chat_jid]; if(!k||!k.key) return false;
  const parts=k.key.split('|');
  return ms(parts[1])===ms(miaStamp(c)) && ms(parts[1])>0 && !(k.key.split('|')[2]);
}
function miaCardState(c){
  if(miaReady(c)) return 'ready';
  const j=MIA_BG.st[c.chat_jid];
  if(j&&ms(j.lastIn)===ms(miaStamp(c))) return j.status==='thinking'||j.status==='queued'?'thinking':(j.status==='failed'?'failed':'');
  return '';
}
function miaChipHtml(c){
  const s=miaCardState(c); if(!s) return '';
  const j=JSON.stringify(c.chat_jid).replace(/"/g,'&quot;');
  if(s==='ready'){ const k=MIA_CACHE[c.chat_jid]; const q=k&&k.out&&k.out.reply&&k.out.reply.type==='clarify';
    if(colOf(c)==='waiting') return '<span class="chip miachip rdy" title="MIA wrote a reminder based on what we last told them. Open the chat, read it, press Send.">MIA reminder ready</span>';
    return q?'<span class="chip miachip rdy" title="MIA needs one quick answer from you first. Open the chat.">MIA has a question</span>':'<span class="chip miachip rdy" title="MIA has a reply ready. Open the chat.">MIA ready</span>'; }
  if(s==='thinking') return '<span class="chip miachip thk">'+(colOf(c)==='waiting'?'MIA writing reminder…':'MIA thinking…')+'</span>';
  return '<span class="chip miachip bad" title="Tap to try again" onclick="event.stopPropagation();miaBgRetry('+j+')">MIA failed · retry</span>';
}
let MIA_BG_RT=null;
function miaBgRender(){ clearTimeout(MIA_BG_RT); MIA_BG_RT=setTimeout(()=>{ try{ render(); }catch(e){} },400); }
function miaBgScan(force){
  if(!force&&!miaBgOn()) return;
  const cand=CHATS.filter(c=>{ const k=colOf(c); return k==='reply'||(k==='waiting'&&lightOf(c,'waiting')==='amber'); })
    .sort((a,b)=>(colOf(a)==='reply'?0:1)-(colOf(b)==='reply'?0:1)||ms(b.last_in_at)-ms(a.last_in_at));
  let added=0;
  for(const c of cand){
    const fresh=colOf(c)==='reply'&&ms(c.last_in_at)>MIA_BG.t0;           // arrived while the page was open
    if(!force&&!fresh&&MIA_BG.budget<=0) continue;
    if(miaReady(c)) continue;
    const l=LASTMSG[c.chat_jid];
    if(l&&l.direction==='in'&&!String(l.body||'').trim()) continue;          // voice note / photo: MIA cannot read it
    const j=MIA_BG.st[c.chat_jid];
    if(j&&ms(j.lastIn)===ms(miaStamp(c))&&(j.status==='thinking'||j.status==='queued'||(j.status==='failed'&&!force)||j.status==='skip')) continue;
    MIA_BG.st[c.chat_jid]={status:'queued',lastIn:miaStamp(c)};
    MIA_BG.queue.push(c.chat_jid); added++; if(!force&&!fresh) MIA_BG.budget--;
  }
  if(added) miaBgRender();
  miaBgPump();
}
function miaBgPrepareAll(){ miaBgScan(true); }
function miaBgRetry(jid){
  const c=CHATS.find(x=>x.chat_jid===jid); if(!c) return;
  MIA_BG.st[jid]={status:'queued',lastIn:miaStamp(c)}; MIA_BG.queue.push(jid); miaBgRender(); miaBgPump();
}
function miaBgPump(){
  while(MIA_BG.run<MIA_BG.max && MIA_BG.queue.length){
    const jid=MIA_BG.queue.shift();
    MIA_BG.run++;
    miaBgOne(jid).catch(()=>{}).then(()=>{ MIA_BG.run--; miaBgPump(); });
  }
}
async function miaBgOne(jid){
  const c=CHATS.find(x=>x.chat_jid===jid), j=MIA_BG.st[jid];
  if(!c||!j) return;
  try{
    const {data,error}=await sb.from('gl_wa_msg').select('direction,sent_by,msg_type,body,wa_ts')
      .eq('chat_jid',jid).order('wa_ts',{ascending:false}).limit(30);
    if(error) throw error;
    const rows=(data||[]).slice().reverse(); const last=rows[rows.length-1];
    const wantOut=colOf(c)==='waiting';
    if(!last||(wantOut?last.direction!=='out':last.direction!=='in')||!String(last.body||'').trim()){ j.status='skip'; return; }
    const notes=MIA_NOTES[jid]||[];
    const key=jid+'|'+last.wa_ts+'|'+notes.join('~');
    if(MIA_CACHE[jid]&&MIA_CACHE[jid].key===key){ j.status='ready'; return; }
    j.status='thinking'; miaBgRender();
    await miaFlight(jid,key,rows,notes);
    j.status='ready';
  }catch(e){ j.status='failed'; }
  miaBgRender();
}
function miaNextReady(){
  const list=CHATS.filter(c=>colOf(c)==='reply').sort((a,b)=>ms(b.last_in_at)-ms(a.last_in_at));

/* ---------------------------------------------------------------------------
   MIA LEARNING (24 Nov). The Deck is what customers get told, so it only ever
   changes with Jimmy's tap:
     1. real customer questions + what staff really sent (gl_crm_mia_log) are
        grouped by topic here;
     2. "Make Deck card" writes a DRAFT into gl_deck with hidden=true, so MIA and
        the Deck app cannot see it;
     3. only "Publish" on a draft sets hidden=false. Nothing is ever deleted;
        "Reject" just files it away.
   --------------------------------------------------------------------------- */
const LTOPICS=[
 ['Job / vacancy',/kerja kosong|vacancy|jawatan|hiring|part ?time/i],
 ['Warranty',/warranty|waranti|jaminan|guarantee|保固|保修/i],
 ['Payment',/bayar|payment|\bpay\b|instal|\btng\b|card|transfer|deposit|ewallet|duitnow/i],
 ['Promo / discount',/promo|discount|kurang|offer|diskaun|murah|cheaper/i],
 ['Coating',/coating|ceramic|cancoat|mohs|infinite|nano|gyeon|镀膜/i],
 ['PPF',/\bppf\b|paint protection/i],
 ['Tint',/\btint|solar|film/i],
 ['Wrap',/\bwrap|colour|color|warna/i],
 ['Polish / scratch',/polish|scratch|calar|swirl|buff|paint correction/i],
 ['Wash / interior',/\bwash|cuci|interior|detailing|seat|\bbau\b/i],
 ['How long it takes',/berapa lama|how long|duration|\blama\b|siap/i],
 ['Location / address',/lokasi|location|alamat|address|\bwhere\b|kat mana|di mana|waze|哪里/i],
 ['Opening hours',/\bbuka\b|\bopen\b|tutup|operating|what time|pukul|opening/i],
 ['Booking / slot',/\bbook|appointment|\bslot\b|available|esok|tomorrow|weekend|sabtu|ahad|预约/i],
 ['Price / how much',/harga|berapa|price|how much|\bcost\b|\brate\b|quote|\brm ?\d|价/i]
];
let LEARN={rows:null,deck:null,busy:false,msg:'',edit:null};
function learnState(){ try{ return JSON.parse(localStorage.getItem('gl_crm_learn_state')||'{}'); }catch(e){ return {}; } }
function learnSet(t,v){ const st=learnState(); if(v) st[t]=v; else delete st[t]; try{ localStorage.setItem('gl_crm_learn_state',JSON.stringify(st)); }catch(e){} renderLearn(); }
const LPRICE=/harga|berapa|price|how much|\bcost\b|\brate\b|quote|\brm ?\d|价/i;
const LSERV=['Coating','PPF','Tint','Wrap','Polish / scratch','Wash / interior'];
function learnTopic(q){
  if(LPRICE.test(q)){ const sv=LTOPICS.find(([n,re])=>LSERV.includes(n)&&re.test(q)); return sv?('Price \u00b7 '+sv[0]):'Price / how much'; }
  for(const [n,re] of LTOPICS) if(re.test(q)) return n; return null; }
function learnRe(topic){
  if(topic.indexOf('Price \u00b7 ')===0){ const sv=LTOPICS.find(x=>x[0]===topic.slice(8)); return sv?new RegExp('(?=.*(?:'+LPRICE.source+'))(?=.*(?:'+sv[1].source+'))','i'):LPRICE; }
  return (LTOPICS.find(x=>x[0]===topic)||[])[1]; }
async function learnLoad(){
  if(LEARN.busy) return; LEARN.busy=true; LEARN.msg='Loading…'; renderLearn();
  try{
    const [a,b]=await Promise.all([sb.rpc('gl_crm_mia_learn',{p_days:60}),
      sb.from('gl_deck').select('slug,tab,grp,title,triggers,hidden,content,sort,updated_at').order('sort',{ascending:true}).limit(500)]);
    if(a.error) throw a.error; if(b.error) throw b.error;
    LEARN.rows=a.data||[]; LEARN.deck=b.data||[]; LEARN.msg='';
  }catch(e){ LEARN.msg='Could not load: '+(e.message||e); }
  LEARN.busy=false; renderLearn();
}
function learnGroups(){
  const g={};
  (LEARN.rows||[]).forEach(r=>{
    const q=String(r.question_clean||'').trim(); if(q.length<4) return;
    const t=learnTopic(q); if(!t) return;
    const x=g[t]||(g[t]={topic:t,n:0,replies:[],phr:[],as_is:0,edited:0,own:0,crm:0});
    x.n++;
    if(!x.phr.includes(q.slice(0,90))&&x.phr.length<40) x.phr.push(q.slice(0,90));
    const sr=String(r.sent_clean||'').trim(); if(sr.length>=20) x.replies.push({t:sr,ts:r.ts});
    if(r.source==='crm'){ x.crm++; if(r.used==='as_is')x.as_is++; else if(r.used==='edited')x.edited++; else if(r.used==='own_words')x.own++; }
  });
  return Object.values(g).sort((a,b)=>b.n-a.n);
}
function learnCovered(topic){
  const re=learnRe(topic); if(!re) return [];
  return (LEARN.deck||[]).filter(c=>c.tab==='replies'&&!c.hidden&&re.test(String(c.title||'')+' '+((c.triggers||[]).join(' ')))).map(c=>c.slug);
}
function learnDrafts(){ return (LEARN.deck||[]).filter(c=>c.hidden&&String(c.grp||'')==='learned'); }
async function learnMake(topic){
  const g=learnGroups().find(x=>x.topic===topic); if(!g) return;
  const reps=g.replies.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts)).filter(r=>r.t.length<=900);
  if(!reps.length){ LEARN.msg='No real staff reply found for this topic yet.'; return renderLearn(); }
  const base=reps[0].t.replace(/\[name\]/g,'{H}');
  const lang=miaGuessLang(base);
  const say={en:'',bm:'',zh:''}; say[lang]=base;
  const shortest=reps.map(r=>r.t.replace(/\[name\]/g,'{H}')).sort((a,b)=>a.length-b.length)[0];
  const sh={en:'',bm:'',zh:''}; sh[miaGuessLang(shortest)]=shortest;
  const slug='l-'+topic.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+new Date().toISOString().slice(0,10).replace(/-/g,'');
  const maxSort=Math.max(0,...(LEARN.deck||[]).filter(c=>c.tab==='replies').map(c=>c.sort||0));
  const phr=g.phr.filter(x=>x.length<=60).slice(0,8);
  const row={tab:'replies',grp:'learned',slug,title:'"'+(phr[0]||topic)+'"',subtitle:'DRAFT from '+g.n+' real chats ('+topic+') - check every number before Publish',
    sort:maxSort+1,kb_keys:[],triggers:phr,hidden:true,
    content:{say,why:'Drafted from what staff really sent to this question. Written in the language they used; the other languages are empty, ask MIA to translate once you are happy with the wording.',
      alts:{short:sh,push:{en:'',bm:'',zh:''}},avoid:['Quoting a price you have not checked against the catalogue'],
      notes:['Real customer wording: '+g.phr.slice(0,6).join(' | '),'Needs Jimmy approval. Remove any customer-specific detail before Publish.']}};
  const {error}=await sb.from('gl_deck').insert(row);
  LEARN.msg=error?('Could not save draft: '+error.message):'Draft saved (hidden, not live). Scroll to "Draft cards waiting for you".';
  await learnLoad();
}
async function learnPublish(slug){
  if(!confirm('Publish this card? MIA and the Deck will use it with customers straight away.')) return;
  const {error}=await sb.from('gl_deck').update({hidden:false,grp:'learned-live'}).eq('slug',slug);
  LEARN.msg=error?('Could not publish: '+error.message):'Published. It is live in the Deck now (MIA sees it within 5 minutes).';
  await learnLoad();
}
async function learnReject(slug){
  const {error}=await sb.from('gl_deck').update({hidden:true,grp:'learned-rejected'}).eq('slug',slug);
  LEARN.msg=error?('Could not reject: '+error.message):'Rejected (kept, hidden, never deleted).';
  await learnLoad();
}
async function learnSaveEdit(slug){
  const c=(LEARN.deck||[]).find(x=>x.slug===slug); if(!c) return;
  const content=JSON.parse(JSON.stringify(c.content||{})); content.say=content.say||{};
  ['en','bm','zh'].forEach(l=>{ const el=$('le_'+l); if(el) content.say[l]=el.value; });
  const {error}=await sb.from('gl_deck').update({title:$('le_title').value,content}).eq('slug',slug);
  LEARN.edit=null; LEARN.msg=error?('Could not save: '+error.message):'Saved (still a hidden draft).';
  await learnLoad();
}
function renderLearn(){
  const el=$('vLearn'); if(!el) return;
  if(!LEARN.rows&&!LEARN.busy){ learnLoad(); }
  const st=learnState();
  const groups=learnGroups();
  const drafts=learnDrafts();
  const total=(LEARN.rows||[]).length, crm=(LEARN.rows||[]).filter(r=>r.source==='crm').length;
  let h='<div class="h1">MIA Learning</div><div class="h1s">Real customer questions and what the team really answered. Nothing here changes the Deck by itself.</div>'
   +'<div class="cards">'+kpi(total,'Questions logged','last 60 days (history + live)','','&#9733;','#EEF3FE')
   +kpi(crm,'With a MIA suggestion','logged live since today','','&#9679;','#DCFCE7')
   +kpi(drafts.length,'Drafts waiting','hidden, not live','','&#9998;','#FEF3C7')+'</div>';
  if(LEARN.msg) h+='<div class="note" style="margin:8px 0">'+esc(LEARN.msg)+'</div>';
  h+='<div class="panel2" style="margin-bottom:14px"><div class="pt">Draft cards waiting for you ('+drafts.length+')</div>';
  if(!drafts.length) h+='<div style="padding:10px 14px;color:var(--text2);font-size:12px">No drafts. Press "Make Deck card" on a topic below.</div>';
  drafts.forEach(c=>{
    const say=(c.content&&c.content.say)||{}; const j=JSON.stringify(c.slug).replace(/"/g,'&quot;');
    h+='<div style="padding:10px 14px;border-top:1px solid var(--line2)"><b>'+esc(c.title)+'</b> <span style="color:var(--text2);font-size:11px">'+esc(c.subtitle||'')+'</span>';
    if(LEARN.edit===c.slug){
      h+='<div style="margin-top:6px"><input id="le_title" style="width:100%" value="'+esc(c.title)+'">'
        +['en','bm','zh'].map(l=>'<div style="font-size:11px;margin-top:4px">'+l.toUpperCase()+'</div><textarea id="le_'+l+'" rows="4" style="width:100%">'+esc(say[l]||'')+'</textarea>').join('')
        +'<button class="btn btn-xs" onclick="learnSaveEdit('+j+')">Save</button> <button class="btn btn2 btn-xs" onclick="LEARN.edit=null;renderLearn()">Cancel</button></div>';
    }else{
      h+=['en','bm','zh'].filter(l=>say[l]).map(l=>'<div style="white-space:pre-wrap;font-size:12px;margin:6px 0;padding:6px 8px;background:var(--card);border:1px solid var(--line2);border-radius:6px"><b>'+l.toUpperCase()+'</b> '+esc(say[l])+'</div>').join('')
        +'<div style="font-size:11px;color:var(--text2)">Triggers: '+esc((c.triggers||[]).join(' | '))+'</div>'
        +'<div style="margin-top:6px"><button class="btn btn-xs" onclick="learnPublish('+j+')">Publish (goes live)</button> '
        +'<button class="btn btn2 btn-xs" onclick="LEARN.edit='+j+';renderLearn()">Edit</button> '
        +'<button class="btn btn2 btn-xs" onclick="learnReject('+j+')">Reject</button></div>';
    }
    h+='</div>';
  });
  h+='</div><div class="panel2"><div class="pt">Questions customers keep asking</div>';
  if(!LEARN.rows) h+='<div style="padding:12px 14px;color:var(--text2)">Loading…</div>';
  let hidden=0;
  groups.forEach(g=>{
    if(st[g.topic]){ hidden++; return; }
    const cov=learnCovered(g.topic); const t=JSON.stringify(g.topic).replace(/"/g,'&quot;');
    const last=g.replies.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
    h+='<div style="padding:10px 14px;border-top:1px solid var(--line2)"><b>'+esc(g.topic)+'</b> &middot; asked <b>'+g.n+'</b>&times; &middot; staff answered '+g.replies.length+'&times;'
      +(g.crm?' &middot; MIA used as-is '+g.as_is+', edited '+g.edited+', own words '+g.own:'')
      +' &middot; '+(cov.length?'<span class="chip rdy">Deck: '+esc(cov.slice(0,3).join(', '))+'</span>':'<span class="chip bad">No Deck card</span>')
      +'<div style="font-size:11.5px;color:var(--text2);margin-top:4px">Customers wrote: '+g.phr.slice(0,5).map(x=>'&ldquo;'+esc(x)+'&rdquo;').join(' &middot; ')+'</div>'
      +(last?'<div style="font-size:11.5px;margin-top:4px;padding:6px 8px;background:var(--card);border:1px solid var(--line2);border-radius:6px;white-space:pre-wrap"><b>Staff really sent:</b> '+esc(last.t.slice(0,320))+(last.t.length>320?'…':'')+'</div>':'')
      +'<div style="margin-top:6px"><button class="btn btn-xs" onclick="learnMake('+t+')">Make Deck card</button> '
      +'<button class="btn btn2 btn-xs" onclick="learnSet('+t+',\'covered\')">Already covered</button> '
      +'<button class="btn btn2 btn-xs" onclick="learnSet('+t+',\'ignored\')">Ignore</button></div></div>';
  });
  if(hidden) h+='<div style="padding:8px 14px;font-size:11.5px;color:var(--text2)">'+hidden+' topic(s) marked covered/ignored on this device. <a href="#learn" onclick="try{localStorage.removeItem(\'gl_crm_learn_state\')}catch(e){};renderLearn();return false">Show them again</a></div>';
  h+='</div>';
  el.innerHTML=h;
}

/* ---------------------------------------------------------------------------
   MAINTENANCE DUE (24 Nov). gl_crm_maint_due() is read-only: from the job card
   history it finds the last coating job per customer (grade from the service
   text), adds the interval (Cancoat 2 months, Cancoat Pro 3, Mohs / C0.02 4,
   Infinite / Matte 6) and returns those due in the next 7 days or overdue by up
   to 60 days, matched to chats by the last 8 digits of the phone. The chat gets a
   chip, a filter, and a reminder drafted into the reply box on request. Nothing
   is sent by itself.
   --------------------------------------------------------------------------- */
let MAINT={}, MAINT_ONLY=false;
async function loadMaint(){
  try{ const {data,error}=await sb.rpc('gl_crm_maint_due',{p_days:7,p_overdue_days:60});
    if(error||!Array.isArray(data)) return;
    MAINT={}; data.forEach(r=>{ if(r.chat_jid&&r.months) MAINT[r.chat_jid]=r; });
  }catch(e){}
}
function maintChip(c){
  const m=MAINT[c.chat_jid]; if(!m) return '';
  const d=Number(m.days_left);
  return '<span class="chip nlr" style="background:#F3E8FF" title="'+esc(m.grade+' coating, last done '+m.last_service+', due '+m.due_date)+'">Maintenance '+(d<0?'overdue '+(-d)+'d':(d===0?'due today':'due in '+d+'d'))+'</span>';
}
function maintToggle(){ MAINT_ONLY=!MAINT_ONLY; render(); }
function maintText(c,m,lang){
  const nm=(c.name&&String(c.name).trim())||m.cust_name||'';
  const car=[m.model,m.plate?('('+m.plate+')'):''].filter(Boolean).join(' ')||'kereta anda';
  const due=m.due_date;
  if(lang==='bm') return 'Hai'+(nm?' '+nm:'')+', ini Grandlab. Maintenance coating ('+m.grade+') untuk '+car+' sepatutnya dibuat sekitar '+due+'. Nak kami aturkan slot? Bagitau tarikh dan masa yang sesuai ya.';
  return 'Hi'+(nm?' '+nm:'')+', this is Grandlab. The coating maintenance ('+m.grade+') for '+car+' is due around '+due+'. Shall we book a slot for you? Just tell us the date and time that suits you.';
}
function drawMaint(){
  const el=$('tMaint'); if(!el) return;
  const m=CUR&&MAINT[CUR.chat_jid];
  if(!m){ el.classList.add('hide'); el.innerHTML=''; return; }
  const d=Number(m.days_left);
  el.classList.remove('hide');
  el.innerHTML='<div class="mh"><b>Maintenance '+(d<0?'overdue by '+(-d)+' days':(d===0?'due today':'due in '+d+' days'))+'</b>'
    +'<span>'+esc(m.grade)+' &middot; last done '+esc(m.last_service)+' &middot; every '+m.months+' months</span><span class="sp"></span>'
    +'<button class="lg" onclick="maintFill(\'en\')">Reminder EN</button><button class="lg" onclick="maintFill(\'bm\')">Reminder BM</button></div>'
    +'<div class="why">Puts a reminder in the reply box. Read it, change anything, then press Send. Nothing is sent by itself.</div>';
}
function maintFill(lang){
  const m=CUR&&MAINT[CUR.chat_jid]; if(!m) return;
  const box=$('tBox'); box.value=maintText(CUR,m,lang);
  $('tReplyNote').className='replyNote'; $('tReplyNote').textContent='Maintenance reminder is in the box. Read it, then press Send.';
  box.focus();
}

/* APPOINTMENT REMINDERS (draft only). Bookings in the next 36 hours are matched to chats by phone
   (last 8 digits). The chat gets a green tag and a panel that fills the reply box with a reminder asking
   the customer to confirm. A person reads it and presses Send. Nothing is sent by itself. */
let APPT={};
const APPT_SEEN=(()=>{ try{ return JSON.parse(localStorage.getItem('gl_crm_appt_rem')||'{}'); }catch(e){ return {}; } })();
async function loadAppt(){
  try{
    const from=new Date().toISOString(), to=new Date(Date.now()+36*3600e3).toISOString();
    const {data,error}=await sb.from('gl_bookings').select('id,customer_id,scheduled_at,status,service_name,notes').gte('scheduled_at',from).lte('scheduled_at',to).order('scheduled_at',{ascending:true}).limit(80);
    if(error||!Array.isArray(data)) return;
    const live=data.filter(b=>!/cancel|complete|done|no.?show/i.test(String(b.status||'')));
    const ids=[...new Set(live.map(b=>b.customer_id).filter(Boolean))];
    const ph={};
    if(ids.length){ try{ const {data:pr}=await sb.from('gl_profiles').select('id,phone,name').in('id',ids); (pr||[]).forEach(x=>{ ph[x.id]=x; }); }catch(e){} }
    const byKey={}; CHATS.forEach(c=>{ const k=String(c.phone||'').replace(/\D/g,'').slice(-8); if(k.length>=7) byKey[k]=c; });
    APPT={};
    live.forEach(b=>{
      const n=String(b.notes||'');
      const pm=/Phone:\s*([+\d][\d\s-]{6,})/i.exec(n);
      const phone=(pm&&pm[1])||(ph[b.customer_id]&&ph[b.customer_id].phone)||'';
      const k=String(phone).replace(/\D/g,'').slice(-8); const c=k&&byKey[k]; if(!c) return;
      const nm=(/Name:\s*([^|]+)/i.exec(n)||[])[1]||(ph[b.customer_id]&&ph[b.customer_id].name)||'';
      const plate=(/Plate:\s*([^|]+)/i.exec(n)||[])[1]||'';
      if(!APPT[c.chat_jid]) APPT[c.chat_jid]={id:b.id,at:b.scheduled_at,service:b.service_name||'',name:String(nm).trim(),plate:String(plate).trim()};
    });
  }catch(e){}
}
function apptWhen(a,lang){
  const d=new Date(a.at);
  const tz={timeZone:'Asia/Kuala_Lumpur'};
  const dayKey=x=>x.toLocaleDateString('en-CA',tz);
  const today=dayKey(new Date()), tom=dayKey(new Date(Date.now()+864e5)), day=dayKey(d);
  const time=d.toLocaleTimeString('en-US',Object.assign({hour:'numeric',minute:'2-digit'},tz));
  const date=d.toLocaleDateString('en-GB',Object.assign({weekday:'short',day:'numeric',month:'short'},tz));
  const rel=day===today?{en:'today',bm:'hari ini',zh:'今天'}:day===tom?{en:'tomorrow',bm:'esok',zh:'明天'}:{en:date,bm:date,zh:date};
  return (rel[lang]||rel.en)+' ('+date+') '+(lang==='zh'?'':(lang==='bm'?'pukul ':'at '))+time;
}
function apptText(c,a,lang){
  const nm=a.name||(c.name&&String(c.name).trim())||''; const w=apptWhen(a,lang); const sv=a.service?(' - '+a.service):'';
  if(lang==='bm') return 'Hai'+(nm?' '+nm:'')+', ingatan mesra untuk temujanji Grandlab anda '+w+sv+'. Sila balas YA untuk sahkan, atau bagitau kami kalau nak tukar masa. Jumpa nanti!';
  if(lang==='zh') return (nm?nm+' ':'老板')+'好哦 😊 提醒一下，你 '+w+' 有预约 Grandlab'+sv+'。请回复 OK 确认，要改时间也可以告诉我们哦。到时见！';
  return 'Hi'+(nm?' '+nm:'')+', a friendly reminder of your Grandlab appointment '+w+sv+'. Please reply YES to confirm, or let us know if you need to change the time. See you!';
}
function apptChip(c){
  const a=APPT[c.chat_jid]; if(!a) return '';
  const d=new Date(a.at);
  const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'});
  const isTom=d.toLocaleDateString('en-CA',{timeZone:'Asia/Kuala_Lumpur'})!==new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kuala_Lumpur'});
  return '<span class="chip nlr" style="background:#DDF5E5" title="'+esc(a.service||'Booking')+'">Booking '+(isTom?'tomorrow ':'today ')+esc(t)+(APPT_SEEN[a.id]?' &#10003;':'')+'</span>';
}
function drawAppt(){
  const el=$('tAppt'); if(!el) return;
  const a=CUR&&APPT[CUR.chat_jid];
  if(!a){ el.classList.add('hide'); el.innerHTML=''; return; }
  el.classList.remove('hide');
  el.innerHTML='<div class="mh"><b>Appointment '+esc(apptWhen(a,'en'))+'</b><span>'+esc(a.service||'')+(a.plate?' &middot; '+esc(a.plate):'')+(APPT_SEEN[a.id]?' &middot; reminder prepared':'')+'</span><span class="sp"></span>'
    +'<button class="lg" onclick="apptFill(\'en\')">Reminder EN</button><button class="lg" onclick="apptFill(\'bm\')">Reminder BM</button><button class="lg" onclick="apptFill(\'zh\')">Reminder 中文</button></div>'
    +'<div class="why">Puts a reminder in the reply box. Read it, change anything, then press Send. Nothing is sent by itself.</div>';
}
function apptFill(lang){
  const a=CUR&&APPT[CUR.chat_jid]; if(!a) return;
  const box=$('tBox'); box.value=apptText(CUR,a,lang);
  APPT_SEEN[a.id]=1; try{ localStorage.setItem('gl_crm_appt_rem',JSON.stringify(APPT_SEEN)); }catch(e){}
  $('tReplyNote').className='replyNote'; $('tReplyNote').textContent='Appointment reminder is in the box. Read it, then press Send.';
  box.focus(); drawAppt();
}

/* AFTER-JOB FOLLOW-UP (draft only). A job finished (stage 'done') in the last 4 days, at least 3 hours ago,
   is matched to its chat by phone (last 8 digits). The chat gets a tag and a panel that fills the reply box
   with a thank-you + review request. A person reads it and presses Send. Nothing is sent by itself. */
const REVIEW_URL='https://g.page/r/CQuFOKTEdhA9EBM/review';
let FOLLOW={};
const FOLLOW_SEEN=(()=>{ try{ return JSON.parse(localStorage.getItem('gl_crm_follow')||'{}'); }catch(e){ return {}; } })();
function titleCase(t){ return String(t||'').toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase()).trim(); }
async function loadFollow(){
  try{
    const since=new Date(Date.now()-4*864e5).toISOString(), until=new Date(Date.now()-3*3600e3).toISOString();
    const {data,error}=await sb.from('gl_jobs').select('id,name,hp,plate,model,services,stage,updated_at').eq('stage','done').gte('updated_at',since).lte('updated_at',until).order('updated_at',{ascending:false}).limit(120);
    if(error||!Array.isArray(data)) return;
    const byKey={}; CHATS.forEach(c=>{ const k=String(c.phone||'').replace(/\D/g,'').slice(-8); if(k.length>=7) byKey[k]=c; });
    FOLLOW={};
    data.forEach(j=>{
      const k=String(j.hp||'').replace(/\D/g,'').slice(-8); const c=k.length>=7&&byKey[k]; if(!c) return;
      const sv=(Array.isArray(j.services)?j.services:[]).map(x=>x&&x.desc).filter(Boolean).slice(0,2).join(' + ');
      if(!FOLLOW[c.chat_jid]) FOLLOW[c.chat_jid]={id:j.id,at:j.updated_at,name:titleCase(j.name),car:titleCase(j.model),plate:j.plate||'',service:sv};
    });
  }catch(e){}
}
function followText(c,f,lang){
  const nm=f.name||(c.name&&String(c.name).trim())||''; const car=f.car||'kereta anda'; const sv=f.service;
  if(lang==='bm') return 'Hai'+(nm?' '+nm:'')+', terima kasih pilih Grandlab! \u{1F64F} '+car+(sv?' ('+sv+')':'')+' dah siap. Kalau ada apa2 yang tak kena, bagitau kami kat sini ye. Kalau berpuas hati, boleh tolong bagi review Google, sangat membantu kami: '+REVIEW_URL;
  if(lang==='zh') return (nm?nm+' ':'老板')+'好哦 \u{1F60A} 谢谢你选择 Grandlab！你的'+(f.car||'车')+(sv?'（'+sv+'）':'')+'已经做好了。如果有任何地方不满意，直接跟我们说就可以哦。如果满意的话，可以帮我们留个 Google review 吗？真的很有帮助：'+REVIEW_URL;
  return 'Hi'+(nm?' '+nm:'')+', thank you for choosing Grandlab! \u{1F64F} Your '+(f.car||'car')+(sv?' ('+sv+')':'')+' is done. If anything does not look right, just message us here and we will sort it out. If you are happy with the result, a quick Google review would really help us: '+REVIEW_URL;
}
function followDays(f){ return Math.max(0,Math.floor((Date.now()-new Date(f.at).getTime())/864e5)); }
function followChip(c){
  const f=FOLLOW[c.chat_jid]; if(!f) return '';
  const d=followDays(f);
  return '<span class="chip nlr" style="background:#FFEFC2" title="'+esc(f.service||'Job done')+'">Job done '+(d===0?'today':d+'d ago')+(FOLLOW_SEEN[f.id]?' &#10003;':'')+'</span>';
}
function drawFollow(){
  const el=$('tFollow'); if(!el) return;
  const f=CUR&&FOLLOW[CUR.chat_jid];
  if(!f){ el.classList.add('hide'); el.innerHTML=''; return; }
  const d=followDays(f);

    +'<div class="why">Puts a thank-you and Google review request in the reply box. Read it, change anything, then press Send. Nothing is sent by itself.</div>';
}
function followFill(lang){
  const f=CUR&&FOLLOW[CUR.chat_jid]; if(!f) return;
  const box=$('tBox'); box.value=followText(CUR,f,lang);
  FOLLOW_SEEN[f.id]=1; try{ localStorage.setItem('gl_crm_follow',JSON.stringify(FOLLOW_SEEN)); }catch(e){}

/* REPLY SPEED (Dashboard). Read-only report from gl_crm_reply_stats: how long the shop takes to answer
   after a customer writes. Business hours 9:00-19:00 shown separately because night messages skew it. */
let RS={days:14,data:null,busy:false};
function rsMin(m){ m=Number(m); if(!isFinite(m)) return '-'; if(m<1) return '<1 min'; if(m<60) return Math.round(m)+' min'; if(m<1440) return (m/60).toFixed(1)+' h'; return (m/1440).toFixed(1)+' d'; }
async function rsLoad(days){
  if(days) RS.days=days;
  if(RS.busy) return; RS.busy=true;
  try{ const {data,error}=await sb.rpc('gl_crm_reply_stats',{p_days:RS.days,p_from_hour:9,p_to_hour:19}); RS.data=error?null:data; RS.err=error&&error.message; }catch(e){ RS.data=null; RS.err=String(e.message||e); }
  RS.busy=false; rsDraw();
}
function rsAttach(){
  const v=$('vDash'); if(!v||$('rsBox')) return;
  v.insertAdjacentHTML('beforeend','<div class="panel2" id="rsBox" style="margin-top:14px"></div>');
  rsDraw(); if(!RS.data) rsLoad();
}
function rsDraw(){
  const el=$('rsBox'); if(!el) return;
  const d=RS.data;
  const btn=n=>'<button class="mvbtn'+(RS.days===n?' on':'')+'" onclick="rsLoad('+n+')">'+n+' days</button> ';
  let h='<div class="pt">Reply speed <span style="float:right">'+btn(7)+btn(14)+btn(30)+'</span></div>';
  if(!d){ el.innerHTML=h+'<div style="padding:12px;color:var(--ink2)">'+(RS.err?'Could not load: '+esc(RS.err):'Loading…')+'</div>'; return; }
  const b=d.biz||{}, a=d.all||{};
  const tile=(v,l,s)=>'<div style="flex:1 1 130px;padding:8px 10px"><div style="font-size:22px;font-weight:700">'+v+'</div><div style="font-size:12px">'+l+'</div><div style="font-size:11px;color:var(--ink2)">'+s+'</div></div>';
  h+='<div style="display:flex;flex-wrap:wrap">'
    +tile(rsMin(b.median),'Typical reply time','9am-7pm, '+(b.n||0)+' questions')
    +tile((b.within10==null?'-':b.within10+'%'),'Answered in 10 min','9am-7pm')
    +tile((b.within60==null?'-':b.within60+'%'),'Answered in 1 hour','9am-7pm')
    +tile(d.unanswered_1h,'Still waiting 1h+','no reply yet, any time')
    +'</div>'
    +'<div style="padding:0 12px 6px;font-size:11.5px;color:var(--ink2)">Slowest 1 in 10 (9am-7pm): '+rsMin(b.p90)+'. All hours: typical '+rsMin(a.median)+', '+(a.within60==null?'-':a.within60)+'% within 1 hour.</div>';
  const hrs=(d.byhour||[]).filter(x=>x.h>=8&&x.h<=23);
  const mx=Math.max(1,...hrs.map(x=>Math.min(Number(x.median)||0,120)));
  h+='<div style="padding:6px 12px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">Typical reply time by hour (bar capped at 2 h)</div>'
    +hrs.map(x=>{ const m=Number(x.median)||0; const w=Math.max(2,Math.round(100*Math.min(m,120)/mx)); const bad=m>30;
      return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;margin:2px 0"><span style="width:44px">'+String(x.h).padStart(2,'0')+':00</span>'
        +'<span style="flex:1;background:var(--bg2,#eef);height:9px;border-radius:5px;overflow:hidden"><span style="display:block;height:9px;width:'+w+'%;background:'+(bad?'#d33':'#1a9d4b')+'"></span></span>'
        +'<span style="width:70px;text-align:right">'+rsMin(m)+'</span><span style="width:54px;color:var(--ink2)">'+x.n+' q</span></div>'; }).join('')+'</div>';
  const st=d.bystaff||[];
  h+='<div style="padding:6px 12px 10px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">By who replied</div>'
    +st.map(x=>'<div style="font-size:11.5px;margin:2px 0">'+esc(x.name)+': '+x.n+' replies, typical '+rsMin(x.median)+'</div>').join('')
    +'<div style="font-size:11px;color:var(--ink2);margin-top:4px">Replies sent from the phone carry no name, so they cannot be told apart. Send from the CRM (with your name picked) to be counted by name.</div></div>';
  el.innerHTML=h;
}

/* ---------------------------------------------------------------------------
   SLASH TEMPLATES (24 Nov). Type "/" in the reply box to pick a saved message
   (gl_crm_template, managed in Settings). Placeholders we know are filled from
   the chat and the maintenance record; the rest stay in {braces} for reception
   to fill. Picking only fills the box; a human presses Send.
   --------------------------------------------------------------------------- */
let TPLS=[], TPL_SEL=0, TPL_LIST=[];
async function loadTemplates(){
  try{ const {data,error}=await sb.rpc('gl_crm_template_list'); if(!error&&Array.isArray(data)) TPLS=data; }catch(e){}
}
function tplFill(body,c){
  const m=c&&MAINT[c.chat_jid]; const o=c&&OVER[c.chat_jid]||{};
  const nm=(c&&c.name&&String(c.name).trim())||(m&&m.cust_name)||o.cust_name||'';
  const v={name:nm,plate:m?m.plate:'',car:m?m.model:'',due_date:m?m.due_date:''};
  let t=String(body||'');
  if(!nm) t=t.replace(/ \{name\}/g,'').replace(/\{name\}/g,'');
  return t.replace(/\{(\w+)\}/g,(x,k)=> (v[k]!==undefined&&v[k]!=='') ? v[k] : x).replace(/ {2,}/g,' ');
}
function slashDraw(){
  const box=$('tBox'), el=$('tSlash'); if(!box||!el) return;
  const v=box.value;
  if(!/^\/[^\n]{0,30}$/.test(v)){ el.classList.add('hide'); return; }
  const q=v.slice(1).trim().toLowerCase();
  TPL_LIST=TPLS.filter(t=>t.active&&(!q||(t.name+' '+t.kind).toLowerCase().includes(q)));
  if(TPL_SEL>=TPL_LIST.length) TPL_SEL=0;
  if(!TPL_LIST.length){ el.innerHTML='<div class="si" style="color:var(--text2)">No saved message matches. Manage them in Settings.</div>'; el.classList.remove('hide'); return; }
  el.innerHTML=TPL_LIST.map((t,i)=>'<div class="si'+(i===TPL_SEL?' on':'')+'" onmousedown="event.preventDefault();slashPick('+i+')"><b>'+esc(t.name)+'</b><small>'+esc(String(t.body).replace(/\n/g,' / '))+'</small></div>').join('');
  el.classList.remove('hide');
}
function slashPick(i){
  const t=TPL_LIST[i]; if(!t) return;
  const box=$('tBox'); box.value=tplFill(t.body,CUR);
  $('tSlash').classList.add('hide');
  $('tReplyNote').className='replyNote'; $('tReplyNote').textContent='Template "'+t.name+'" is in the box. Fill any {brackets}, then press Send.';
  box.focus();
}
(function(){
  const box=document.getElementById('tBox'); if(!box) return;
  box.addEventListener('input',()=>{ TPL_SEL=0; slashDraw(); });
  box.addEventListener('keydown',e=>{
    const el=$('tSlash'); if(!el||el.classList.contains('hide')||!TPL_LIST.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); TPL_SEL=(TPL_SEL+1)%TPL_LIST.length; slashDraw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); TPL_SEL=(TPL_SEL+TPL_LIST.length-1)%TPL_LIST.length; slashDraw(); }
    else if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); slashPick(TPL_SEL); }
    else if(e.key==='Escape'){ e.stopPropagation(); el.classList.add('hide'); }
  });
})();
