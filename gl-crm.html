<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandlab CRM</title>
<!-- Installs on the reception PC as its own window via Chrome/Edge "Install".
     No service worker on purpose: a cached app shell would go stale and the
     board must always show what the database says right now. -->
<link rel="manifest" href="gl-crm.webmanifest">
<meta name="theme-color" content="#F5C518">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gl-backend-config.js"></script>
<script>/* backend switch (docs/cf-migration-gl.md): ONLY when the switch is on for module "core" (gl-backend-config.js) or this device chose ?backend=cf, load gl-cf-client.js + gl-cf-page.js. Off = nothing else happens. */
(function(){try{var M='core',on;if(typeof GL_BACKEND_PICK==='function'){on=GL_BACKEND_PICK(M)==='cf';}else{var m=/[?&]backend=(cf|sb)(?:&|$)/.exec(location.search);if(m){if(m[1]==='cf')localStorage.setItem('gl_backend','cf');else localStorage.removeItem('gl_backend');}on=localStorage.getItem('gl_backend')==='cf';}if(on){window.GLCF_PAGE_CFG={page:'gl-crm',module:M};document.write('<script src="gl-cf-client.js"><\/script><script src="gl-cf-page.js"><\/script>');}}catch(e){}})();</script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--card2:#F6F7F8;--gold:#F5C518;--gold-ink:#8A6D00;
      --text:#111111;--text2:#5F6368;--border:#E3E5E8;--red:#C0392B;--green:#157347;
      --amber:#9A6700;--sel:#FFF8E1;--head:#EEF0F2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
.hide{display:none !important}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
     background:var(--card2);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.bar .ttl{font-weight:900;font-size:15px;white-space:nowrap}
.bar .ttl span{color:var(--gold-ink)}
.back{color:var(--text2);text-decoration:none;font-size:12.5px;white-space:nowrap}
.grow{flex:1;min-width:80px}
input{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);
     color:var(--text);font-family:inherit;font-size:13px;width:100%}
input:focus{outline:none;border-color:var(--gold-ink)}
.btn{background:var(--gold);color:#000;border:none;border-radius:7px;padding:7px 13px;font-size:12.5px;
     font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
.btn2{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-wa{background:#25D366;color:#fff}
.btn-xs{padding:4px 9px;font-size:11.5px;border-radius:6px}
.note{background:#FFF8E1;border-bottom:1px solid #E8D48A;padding:8px 12px;font-size:12px;color:#6b5600}
.status{color:var(--text2);font-size:12px;padding:7px 12px}
.err{color:var(--red)}
.empty{color:var(--text2);text-align:center;padding:34px 12px}

/* ---- money strip ---- */
.strip{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--card2);overflow-x:auto}
.stat{padding:8px 14px;border-right:1px solid var(--border);white-space:nowrap}
.stat .v{font-weight:900;font-size:15px}
.stat .k{color:var(--text2);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.stat.win .v{color:var(--green)}
.stat.lost .v{color:var(--red)}

/* ---- board ---- */
.board{display:flex;gap:10px;padding:10px;align-items:flex-start;overflow-x:auto}
.col{flex:0 0 268px;background:var(--card2);border:1px solid var(--border);border-radius:10px;
     display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.colh{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:800;font-size:11.5px;
      text-transform:uppercase;letter-spacing:.03em;color:var(--text2);display:flex;gap:6px;align-items:center}
.colh .n{background:var(--border);color:var(--text2);border-radius:9px;padding:0 6px;font-size:10.5px}
.colh.c-reply{color:var(--red)} .colh.c-waiting{color:var(--amber)}
.colh.c-ghost{color:var(--red)} .colh.c-paid{color:var(--green)}
.collist{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 9px;cursor:pointer}
.card:hover{border-color:var(--gold-ink)}
.card .nm{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ph{color:var(--text2);font-size:11px;font-variant-numeric:tabular-nums}
.card .last{color:var(--text2);font-size:11.5px;margin-top:4px;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-block;border-radius:4px;padding:0 6px;font-size:10.5px;font-weight:800;
      background:var(--border);color:var(--text2)}
.chip.stage{background:#E7F0FA;color:#0B5FAE}
.col.urgent{border-color:var(--red)}
.chip.mem{background:var(--gold);color:#000}
.chip.rm{background:#E6F4EA;color:var(--green)}
.ago{font-size:10.5px;font-weight:800;margin-left:auto}
.ago.warm{color:var(--amber)} .ago.cold{color:var(--red)} .ago.ok{color:var(--text2)}

/* ---- thread panel ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:flex-end}
.ov.hide{display:none !important}
.panel{background:var(--bg);width:min(560px,100%);height:100%;display:flex;flex-direction:column}
.ph-head{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--card2);
         display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-head .nm{font-weight:900;font-size:14px}
.rec{padding:9px 12px;border-bottom:1px solid var(--border);background:#FAFBFC;font-size:12px}
.rec .row{display:flex;gap:8px;padding:2px 0}
.rec .k{color:var(--text2);min-width:92px}
.thread{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px;background:#F0F2F5}
.msg{max-width:78%;padding:7px 10px;border-radius:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.in{background:var(--card);align-self:flex-start;border:1px solid var(--border)}
.msg.out{background:#DCF8C6;align-self:flex-end}
.msg .t{display:block;color:var(--text2);font-size:10px;margin-top:3px}
.msg.sys{align-self:center;background:transparent;color:var(--text2);font-size:11px;max-width:100%}
/* ---- shell: sidebar + view area ---- */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 42px)}
.side{flex:0 0 184px;border-right:1px solid var(--border);background:var(--card2);padding:8px 0}
.side .grp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text2);padding:10px 14px 4px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;font-weight:600;
  color:var(--text);cursor:pointer;border-left:3px solid transparent;text-decoration:none}
.nav:hover{background:var(--sel)}
.nav.on{background:var(--card);border-left-color:var(--gold);font-weight:800}
.nav .ico{width:17px;text-align:center;flex:0 0 17px}
.nav .pill{margin-left:auto;background:var(--border);color:var(--text2);border-radius:9px;
  padding:0 6px;font-size:10.5px;font-weight:800}
.nav .pill.hot{background:var(--red);color:#fff}
.nav .ext{margin-left:auto;color:var(--text2);font-size:11px}
.vbody{flex:1;min-width:0;display:flex;flex-direction:column}
.pad{padding:14px}
.h1{font-size:16px;font-weight:900;margin:0 0 2px}
.h1s{color:var(--text2);font-size:12px;margin-bottom:12px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.kpi{flex:1 1 150px;min-width:150px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card)}
.kpi .v{font-size:21px;font-weight:900;line-height:1.15}
.kpi .k{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.kpi .s{color:var(--text2);font-size:11px;margin-top:4px}
.kpi.win .v{color:var(--green)} .kpi.lost .v{color:var(--red)}
.panel2{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.panel2 .pt{background:var(--head);padding:7px 11px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.03em;color:var(--text2)}
table.t2{width:100%;border-collapse:collapse;font-size:12.5px}
table.t2 th{text-align:left;font-weight:800;font-size:10.5px;text-transform:uppercase;
  color:var(--text2);padding:6px 11px;border-bottom:1px solid var(--border)}
table.t2 td{padding:6px 11px;border-bottom:1px solid var(--border)}
table.t2 tr:last-child td{border-bottom:none}
table.t2 tbody tr:hover{background:var(--sel);cursor:pointer}
.bar2{height:7px;border-radius:4px;background:var(--gold);min-width:2px}
.soonbox{background:#FFF8E1;border:1px dashed #E8D48A;border-radius:9px;padding:11px 12px;
  color:#6b5600;font-size:12.5px}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{flex:0 0 auto;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:0}
  .side .grp{display:none}
  .nav{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav.on{border-left-color:transparent;border-bottom-color:var(--gold)}
  .nav .pill,.nav .ext{margin-left:5px}
}
@media(max-width:700px){ .col{flex:0 0 84vw} }
</style>
</head>
<body>

<div class="gate" id="gate" style="position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px">
  <div style="max-width:330px;width:100%;border:1px solid var(--border);border-radius:12px;padding:18px">
  <h1 style="font-size:19px;font-weight:900;margin:0 0 3px">GRAND<span style="color:var(--gold-ink)">LAB</span></h1>
  <div style="color:var(--text2);font-size:12px">CRM — staff sign in</div>
  <label style="display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text2);margin:10px 0 4px">Email</label>
  <input id="email" type="email" autocomplete="username">
  <label style="display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text2);margin:10px 0 4px">Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%;margin-top:12px;padding:11px" onclick="doLogin()">SIGN IN</button>
  <div id="loginErr" class="status err"></div>
</div></div>

<div id="main" class="hide">
  <div class="bar">
    <a class="back" href="gl-hub.html">&#8592; Hub</a>
    <div class="ttl">GRAND<span>LAB</span> CRM</div>
    <div class="grow"><input id="q" placeholder="Search name, phone or message…" autocomplete="off"></div>
    <button class="btn btn2" id="alertBtn" onclick="toggleAlerts()" title="Pop up when a customer is waiting">&#128276; Alerts off</button>
    <button class="btn btn2" onclick="load()">Refresh</button>
  </div>

  <div id="staleNote" class="note hide"></div>

  <div class="shell">
    <nav class="side" id="side"></nav>
    <div class="vbody">

      <div id="vPipeline">
        <div id="strip" class="strip"></div>
        <div id="board" class="board"></div>
        <div id="statusLine" class="status"></div>
        <div id="emptyBox" class="empty hide"></div>
      </div>

      <div id="vDash"    class="pad hide"></div>
      <div id="vLeads"   class="pad hide"></div>
      <div id="vReports" class="pad hide"></div>
      <div id="vSoon"    class="pad hide"></div>

    </div>
  </div>
</div>

<div id="ov" class="ov hide" onclick="if(event.target===this)closeThread()">
  <div class="panel">
    <div class="ph-head">
      <div class="grow">
        <div class="nm" id="tNm"></div>
        <div class="ph" id="tPh" style="color:var(--text2);font-size:11.5px"></div>
      </div>
      <a id="tWa" class="btn btn-wa btn-xs" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn btn2 btn-xs" onclick="closeThread()">Close</button>
    </div>
    <div class="rec" id="tRec"></div>
    <div class="thread" id="tThread"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://db.grandlab.com.my";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkzMDY5NDExLCJleHAiOjE5NTA3NDk0MTF9.IcbPnDCd9p6Z-_FNMvzfg9k6ayX7IpC48zdGacAD_qw";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,
      {auth:{persistSession:true,autoRefreshToken:true,storageKey:'gl_auth'}});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=n=>'RM'+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});

let CHATS=[], LASTMSG={}, CUR=null, OVER={}, VIEW='pipeline';

/* The sidebar. Contacts and Calendar deliberately open the apps that already
   own that data rather than showing a second copy of it here - two screens
   listing customers is two screens that can disagree. */
const NAV=[
  {grp:'Conversations'},
  {id:'dash',     ico:'&#9632;', label:'Dashboard'},
  {id:'pipeline', ico:'&#9776;', label:'Pipeline', count:()=>countCol('reply'), hot:true},
  {id:'leads',    ico:'&#9728;', label:'Leads',    count:()=>LEADS().length},
  {grp:'Customers'},
  {id:'contacts', ico:'&#9679;', label:'Contacts', href:'gl-customers.html'},
  {id:'members',  ico:'&#9734;', label:'Members',  href:'gl-members.html'},
  {grp:'Business'},
  {id:'reports',  ico:'&#9650;', label:'Reports'},
  {id:'calendar', ico:'&#9633;', label:'Calendar', href:'gl-staff-appointment-FINAL.html'},
  {id:'tasks',    ico:'&#10003;', label:'Tasks',   soon:'Follow-ups you can tick off, with a reminder when one is due.'},
  {id:'autom',    ico:'&#8635;', label:'Automation', soon:'Rules like "nobody replied in 2 hours - tell reception" and "quiet for 7 days - suggest a follow-up".'},
  {id:'settings', ico:'&#9881;', label:'Settings', soon:'How many days counts as quiet, who gets alerts, and your reply templates.'}
];

function countCol(key){
  let n=0; for(const c of CHATS) if(colOf(c)===key) n++;
  return n;
}
/* A lead is someone talking to us who is not already a customer. */
function LEADS(){
  return CHATS.filter(c=>{
    const o=OVER[c.chat_jid]||{};
    return !o.is_customer && !(o.jobs>0);
  });
}

function drawNav(){
  $('side').innerHTML = NAV.map(n=>{
    if(n.grp) return '<div class="grp">'+esc(n.grp)+'</div>';
    if(n.href) return '<a class="nav" href="'+esc(n.href)+'" target="_blank" rel="noopener">'
      +'<span class="ico">'+n.ico+'</span>'+esc(n.label)+'<span class="ext">&#8599;</span></a>';
    let pill='';
    if(n.count){ const v=n.count(); if(v) pill='<span class="pill'+(n.hot?' hot':'')+'">'+v+'</span>'; }
    return '<div class="nav'+(VIEW===n.id?' on':'')+'" onclick="go('+JSON.stringify(n.id)+')">'
      +'<span class="ico">'+n.ico+'</span>'+esc(n.label)+pill+'</div>';
  }).join('');
}

function go(id){
  VIEW=id;
  const soon=(NAV.find(n=>n.id===id)||{}).soon;
  for(const v of ['vPipeline','vDash','vLeads','vReports','vSoon'])
    $(v).classList.add('hide');
  if(soon){
    $('vSoon').classList.remove('hide');
    $('vSoon').innerHTML='<div class="h1">'+esc((NAV.find(n=>n.id===id)||{}).label)+'</div>'
      +'<div class="h1s">Not built yet.</div><div class="soonbox">'+esc(soon)+'</div>';
  } else if(id==='dash')    { $('vDash').classList.remove('hide');    renderDash(); }
  else if(id==='leads')     { $('vLeads').classList.remove('hide');   renderLeads(); }
  else if(id==='reports')   { $('vReports').classList.remove('hide'); renderReports(); }
  else                      { $('vPipeline').classList.remove('hide'); }
  drawNav();
  try{ location.hash=id; }catch(e){}
}

/* The columns are Jimmy's own vocabulary, already in gl_wa_chat.status -
   talking / waiting / ghost / paid. Inventing new ones would have thrown away
   the stage flow the bridge has been writing since October. */
const COLS=[
  {key:'reply',   label:'Needs reply', cls:'c-reply'},
  {key:'waiting', label:'Waiting on them', cls:'c-waiting'},
  {key:'quiet',   label:'Gone quiet',  cls:'c-ghost'},
  {key:'paid',    label:'Won',         cls:'c-paid'}
];
const QUIET_DAYS=14;

/* "Stage 7 - Gone quiet" -> "Gone quiet". The number is noise on a card. */
function shortStage(s){
  const t=String(s||'').trim();
  if(!t) return '';
  const m=t.match(/^Stage\s*\d+\s*[—\-–]\s*(.+)$/i);
  return m?m[1].trim():t;
}
function agoTxt(ts){
  if(!ts) return {t:'',cls:'ok'};
  const d=new Date(ts); if(isNaN(d)) return {t:'',cls:'ok'};
  const mins=Math.floor((Date.now()-d.getTime())/60000);
  if(mins<1)   return {t:'now',cls:'ok'};
  if(mins<60)  return {t:mins+'m',cls:mins>=30?'warm':'ok'};
  const hrs=Math.floor(mins/60);
  if(hrs<24)   return {t:hrs+'h',cls:hrs>=2?'warm':'ok'};
  const days=Math.floor(hrs/24);
  return {t:days+'d',cls:'cold'};
}
const dmy=s=>{ if(!s) return ''; const d=new Date(s); return isNaN(d)?'':
  d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+
  d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };

function waLink(phone){
  const d=String(phone||'').replace(/[^0-9]/g,'');
  return d.length>=9 ? 'https://wa.me/'+d : '';
}
/* Which column a chat belongs in.

   The imported chats all carry status 'talking' because that is the database
   default, which put 368 of 390 in one useless pile. So the column is worked
   out from the conversation itself: who spoke last, and how long ago. That is
   the question reception actually has — "who is waiting on me right now" —
   and it is true for every chat, including the hundreds nobody ever staged.
   The stage chip still shows on the card, so nothing MIA recorded is lost. */
function colOf(c){
  const s=String(c.status||'').toLowerCase();
  if(s==='paid') return 'paid';

  const lastIn =c.last_in_at ? new Date(c.last_in_at).getTime() : 0;
  const lastOut=c.last_out_at? new Date(c.last_out_at).getTime(): 0;
  const newest=Math.max(lastIn,lastOut);
  if(!newest) return 'quiet';

  if(s==='ghost') return 'quiet';
  if(Date.now()-newest > QUIET_DAYS*86400000) return 'quiet';
  return lastIn > lastOut ? 'reply' : 'waiting';
}

function cardHtml(c){
  const a=agoTxt(c.last_in_at);
  const st=shortStage(c.stage);
  const last=LASTMSG[c.chat_jid];
  // No name means an unsaved contact. Show the number once, not twice.
  const hasName=!!(c.name&&String(c.name).trim());
  return '<div class="card" onclick="openThread('+JSON.stringify(c.chat_jid).replace(/"/g,'&quot;')+')">'
    +'<div class="nm">'+esc(hasName?c.name:(c.phone||'(no number)'))+'</div>'
    +(hasName?'<div class="ph">'+esc(c.phone||'—')+'</div>':'')
    +(last?'<div class="last">'+(last.direction==='out'?'<b>You:</b> ':'')+esc(last.body||'['+(last.msg_type||'media')+']')+'</div>':'')
    +'<div class="foot">'
      +(st?'<span class="chip stage">'+esc(st)+'</span>':'')
      +(Number(c.paid_rm)>0?'<span class="chip rm">'+esc(RM(c.paid_rm))+'</span>':'')
      +'<span class="ago '+a.cls+'">'+a.t+'</span>'
    +'</div></div>';
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=CHATS.filter(c=>{
    if(!q) return true;
    const last=LASTMSG[c.chat_jid];
    return [c.name,c.phone,c.stage,c.status,c.remark,last&&last.body]
      .some(v=>String(v==null?'':v).toLowerCase().includes(q));
  });

  const by={}; COLS.forEach(x=>by[x.key]=[]);
  rows.forEach(c=>by[colOf(c)].push(c));
  /* Longest wait at the top of "Needs reply" — that is the one losing money.
     Everywhere else, most recent first. */
  by.reply.sort((a,b)=>new Date(a.last_in_at||0)-new Date(b.last_in_at||0));
  if(!q) alertNewReplies(by.reply);   // searching filters rows, so don't alert off a filtered list

  $('board').innerHTML = COLS.map(x=>{
    const list=by[x.key];
    return '<div class="col"><div class="colh '+x.cls+'">'+esc(x.label)
      +'<span class="n">'+list.length+'</span></div>'
      +'<div class="collist">'
      +(list.length?list.map(cardHtml).join(''):'<div class="empty" style="padding:14px;font-size:11.5px">Nothing here</div>')
      +'</div></div>';
  }).join('');

  // the money view: what this pipeline actually did
  /* No close-rate figure here on purpose. The denominator would be every
     contact ever messaged - suppliers, staff, wrong numbers - so it reads as
     a terrible number that means nothing. "Needs reply" is the one that costs
     money today, so that is what goes first. */
  const wonRM=by.paid.reduce((s,c)=>s+(Number(c.paid_rm)||0),0);
  const oldest=by.reply.reduce((m,c)=>{
    const t=c.last_in_at?new Date(c.last_in_at).getTime():0;
    return t&&(!m||t<m)?t:m; },0);
  $('strip').innerHTML=
     stat(by.reply.length,'Needs reply', by.reply.length?'lost':'')
    +stat(oldest?agoTxt(new Date(oldest).toISOString()).t:'—','Longest wait', by.reply.length?'lost':'')
    +stat(by.waiting.length,'Waiting on them')
    +stat(by.quiet.length,'Gone quiet')
    +stat(by.paid.length,'Won','win')
    +stat(RM(wonRM),'Revenue tracked','win')
    +stat(rows.length,'Chats');

  $('statusLine').textContent = rows.length ? rows.length+' of '+CHATS.length+' shown' : '';
  $('emptyBox').classList.toggle('hide', rows.length>0);
  $('emptyBox').textContent = rows.length ? '' : (CHATS.length ? 'Nothing matches that search.' : 'No WhatsApp chats recorded yet.');
}
const stat=(v,k,cls)=>'<div class="stat '+(cls||'')+'"><div class="v">'+esc(v)+'</div><div class="k">'+esc(k)+'</div></div>';

async function load(){
  $('statusLine').textContent='Loading…';
  try{
    const {data:chats,error}=await sb.from('gl_wa_chat')
      .select('chat_jid,phone,name,stage,status,first_in_at,last_in_at,last_out_at,booked_at,paid_at,paid_rm,remark')
      .order('last_in_at',{ascending:false,nullsFirst:false})
      .limit(400);
    if(error) throw error;
    CHATS=chats||[];

    /* One query for the preview line on every card, newest first, then keep
       the first per chat. Cheaper than a query per card. */
    LASTMSG={};
    const {data:msgs}=await sb.from('gl_wa_msg')
      .select('chat_jid,direction,body,msg_type,wa_ts')
      .order('wa_ts',{ascending:false})
      .limit(3000);
    (msgs||[]).forEach(m=>{ if(!LASTMSG[m.chat_jid]) LASTMSG[m.chat_jid]=m; });

    /* Who each chat actually is, in Grandlab terms - customer or not, how many
       jobs, how much spent. One call for all of them; doing it per card would
       be 390 round trips. Staff-only and read-only on the server side. */
    OVER={};
    try{
      const {data:ov}=await sb.rpc('gl_crm_overview');
      (ov||[]).forEach(o=>{ OVER[o.chat_jid]=o; });
    }catch(e){ /* board still works without the enrichment */ }

    staleCheck();
    render();
    drawNav();
    if(VIEW==='dash') renderDash();
    else if(VIEW==='leads') renderLeads();
    else if(VIEW==='reports') renderReports();
  }catch(e){
    $('statusLine').innerHTML='<span class="err">Could not load: '+esc(e.message||e)+'</span>';
  }
}

/* The feed is only as fresh as whatever is writing to gl_wa_msg. If that has
   stopped, the board is a historical record and must say so rather than
   looking like a live view of a quiet week. */
function staleCheck(){
  const latest=CHATS.map(c=>c.last_in_at).filter(Boolean).sort().pop();
  const n=$('staleNote');
  if(!latest){ n.classList.add('hide'); return; }
  const days=Math.floor((Date.now()-new Date(latest).getTime())/86400000);
  if(days<3){ n.classList.add('hide'); return; }
  n.classList.remove('hide');
  n.innerHTML='<b>Not live.</b> The newest message here is '+esc(dmy(latest))+' ('+days
    +' days ago), so the WhatsApp feed has stopped writing. Everything below is history — '
    +'new chats are not being recorded until the bridge is reconnected.';
}

async function openThread(jid){
  CUR=CHATS.find(c=>c.chat_jid===jid); if(!CUR) return;
  $('ov').classList.remove('hide');
  $('tNm').textContent=CUR.name||CUR.phone||'(no name)';
  $('tPh').textContent=[CUR.phone,shortStage(CUR.stage),CUR.status].filter(Boolean).join(' · ');
  const w=waLink(CUR.phone);
  $('tWa').style.display=w?'':'none'; if(w) $('tWa').href=w;
  $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span>Looking up…</span></div>';
  $('tThread').innerHTML='<div class="msg sys">Loading…</div>';
  loadRecord(CUR.phone);
  loadThread(jid);
}
function closeThread(){ $('ov').classList.add('hide'); CUR=null; }

async function loadThread(jid){
  try{
    const {data}=await sb.from('gl_wa_msg')
      .select('direction,sent_by,msg_type,body,wa_ts')
      .eq('chat_jid',jid).order('wa_ts',{ascending:true}).limit(500);
    const rows=data||[];
    $('tThread').innerHTML = rows.length ? rows.map(m=>{
      const body=m.body||('['+(m.msg_type||'media')+']');
      return '<div class="msg '+(m.direction==='out'?'out':'in')+'">'+esc(body)
        +'<span class="t">'+esc(dmy(m.wa_ts))+(m.sent_by&&m.direction==='out'?' · '+esc(m.sent_by):'')+'</span></div>';
    }).join('') : '<div class="msg sys">No messages recorded for this chat.</div>';
    const t=$('tThread'); t.scrollTop=t.scrollHeight;
  }catch(e){
    $('tThread').innerHTML='<div class="msg sys">Could not load messages: '+esc(e.message||e)+'</div>';
  }
}

/* The whole point of the board: the chat next to what Grandlab already knows
   about them. Matched on the last 8 digits because phone formats in
   gl_profiles and gl_walkin are inconsistent. */
async function loadRecord(phone){
  const key=String(phone||'').replace(/[^0-9]/g,'').slice(-8);
  if(key.length<7){ $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span>No phone on this chat — cannot match.</span></div>'; return; }
  try{
    const [{data:prof},{data:walk}]=await Promise.all([
      sb.from('gl_profiles')
        .select('name,phone,email,tier,tier_expires_at,wallet,wallet_member,points')
        .ilike('phone','%'+key).limit(1),
      sb.from('gl_walkin').select('name,plate,model,last_service,visit_count')
        .ilike('phone','%'+key).limit(12)
    ]);
    const p=(prof||[])[0], cars=walk||[];
    const row=(k,v)=>'<div class="row"><span class="k">'+esc(k)+'</span><span>'+v+'</span></div>';
    let h='';
    if(p){
      const isMember=p.tier_expires_at&&new Date(p.tier_expires_at)>new Date();
      h+=row('Customer','<b>'+esc(p.name||'(no name)')+'</b>'
          +(isMember?' <span class="chip mem">'+esc(p.tier||'Member')+'</span>':''));
      if(p.email) h+=row('Email',esc(p.email));
      if(Number(p.wallet)>0) h+=row('Credit', esc(RM(p.wallet))
          + (Number(p.wallet_member)>0?' <span style="color:var(--text2)">('+esc(RM(p.wallet_member))+' member credit)</span>':''));
      if(Number(p.points)>0) h+=row('G Coin', esc(p.points));
    }
    if(cars.length){
      h+=row('Cars', cars.map(c=>'<b>'+esc(c.plate||'—')+'</b>'+(c.model?' '+esc(c.model):'')).join('<br>'));
      const seen=cars.map(c=>c.last_service).filter(Boolean).sort().pop();
      if(seen) h+=row('Last service', esc(dmy(seen)));
      const visits=cars.reduce((s,c)=>s+(Number(c.visit_count)||0),0);
      if(visits) h+=row('Visits', esc(visits));
    }
    if(!h) h=row('Customer','Not in Grandlab records yet — new enquiry.');
    if(CUR&&CUR.remark) h+=row('Note', esc(CUR.remark));
    h+='<div class="row" style="margin-top:5px"><span class="k"></span><span>'
      +'<a class="btn btn2 btn-xs" target="_blank" rel="noopener" href="gl-customers.html">Open in GL Customers</a></span></div>';
    $('tRec').innerHTML=h;
  }catch(e){
    $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span class="err">Lookup failed: '+esc(e.message||e)+'</span></div>';
  }
}

/* ---- alerts -------------------------------------------------------------
   Reception keeps this open all day, so the board should speak up instead of
   waiting to be looked at. Only new arrivals in "Needs reply" raise a popup,
   and never on the first load, or opening the app would fire fifteen at once. */
let ALERTS = false, KNOWN_REPLY = null;

function setAlertBtn(){
  $('alertBtn').innerHTML = ALERTS ? '&#128276; Alerts on' : '&#128276; Alerts off';
  $('alertBtn').style.background = ALERTS ? 'var(--gold)' : '';
}
async function toggleAlerts(){
  if(ALERTS){ ALERTS=false; try{localStorage.setItem('gl_crm_alerts','0');}catch(e){} setAlertBtn(); return; }
  if(!('Notification' in window)){ alert('This browser cannot show alerts.'); return; }
  let p=Notification.permission;
  if(p!=='granted') { try{ p=await Notification.requestPermission(); }catch(e){} }
  if(p!=='granted'){ alert('Alerts are blocked for this site. Allow notifications in the browser settings, then try again.'); return; }
  ALERTS=true; try{localStorage.setItem('gl_crm_alerts','1');}catch(e){} setAlertBtn();
  new Notification('Grandlab CRM', {body:'Alerts are on. You will be told when a customer is waiting.', icon:'icon-192.png'});
}
function alertNewReplies(replyList){
  const ids=new Set(replyList.map(c=>c.chat_jid));
  if(KNOWN_REPLY===null){ KNOWN_REPLY=ids; return; }          // first load: just remember
  const fresh=replyList.filter(c=>!KNOWN_REPLY.has(c.chat_jid));
  KNOWN_REPLY=ids;
  if(!ALERTS || !fresh.length || Notification.permission!=='granted') return;
  const one=fresh[0];
  const who=(one.name&&String(one.name).trim())?one.name:(one.phone||'A customer');
  const body=fresh.length===1
    ? who+' is waiting for a reply'
    : fresh.length+' customers are waiting for a reply';
  try{
    const n=new Notification('Grandlab CRM', {body, icon:'icon-192.png', tag:'gl-crm-reply', renotify:true});
    n.onclick=()=>{ window.focus(); if(fresh.length===1) openThread(one.chat_jid); n.close(); };
  }catch(e){}
}

/* ---- Dashboard ---- */
const kpi=(v,k,s,cls)=>'<div class="kpi '+(cls||'')+'"><div class="v">'+esc(v)+'</div>'
  +'<div class="k">'+esc(k)+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>';

function renderDash(){
  const over=Object.values(OVER);
  const rev=over.reduce((s,o)=>s+(Number(o.revenue)||0),0);
  const known=over.filter(o=>o.is_customer).length;
  const leads=LEADS().length;
  const reply=countCol('reply'), quiet=countCol('quiet');
  const won=CHATS.filter(c=>String(c.status).toLowerCase()==='paid').length;
  const oldest=CHATS.filter(c=>colOf(c)==='reply')
    .reduce((m,c)=>{const t=c.last_in_at?new Date(c.last_in_at).getTime():0; return t&&(!m||t<m)?t:m;},0);

  // the biggest spenders you are talking to
  const top=over.filter(o=>o.jobs>0).sort((a,b)=>b.revenue-a.revenue).slice(0,8);
  const maxRev=top.length?Number(top[0].revenue)||1:1;

  $('vDash').innerHTML=
    '<div class="h1">Dashboard</div>'
   +'<div class="h1s">Everything below comes from your own WhatsApp, matched to your own customers.</div>'
   +'<div class="cards">'
     +kpi(reply,'Needs reply', oldest?('longest waiting '+agoTxt(new Date(oldest).toISOString()).t):'all answered', reply?'lost':'win')
     +kpi(CHATS.length,'Conversations', known+' are existing customers')
     +kpi(leads,'New leads','never bought anything yet')
     +kpi(quiet,'Gone quiet','no word for 14 days+','lost')
     +kpi(RM(rev),'Revenue behind these chats','all time','win')
     +kpi(won,'Marked won','by MIA stage','win')
   +'</div>'
   +(top.length?('<div class="panel2"><div class="pt">Your biggest customers on WhatsApp</div>'
     +'<table class="t2"><thead><tr><th>Customer</th><th>Jobs</th><th>Revenue</th><th style="width:34%"></th></tr></thead><tbody>'
     +top.map(o=>{
        const c=CHATS.find(x=>x.chat_jid===o.chat_jid)||{};
        const nm=o.cust_name||c.name||c.phone||'(unknown)';
        const w=Math.max(2,Math.round(Number(o.revenue)/maxRev*100));
        return '<tr onclick="openThread('+JSON.stringify(o.chat_jid).replace(/"/g,'&quot;')+')">'
          +'<td><b>'+esc(nm)+'</b>'+(o.tier?' <span class="chip mem">'+esc(o.tier)+'</span>':'')+'</td>'
          +'<td>'+esc(o.jobs)+'</td><td>'+esc(RM(o.revenue))+'</td>'
          +'<td><div class="bar2" style="width:'+w+'%"></div></td></tr>';
      }).join('')+'</tbody></table></div>'):'')
   +'<div class="soonbox"><b>Where leads come from is not being recorded.</b> '
     +'Only 8 of your '+esc(Object.keys(LASTMSG).length?'7,500+':'')+' messages carry an ad source, so "which ad brought this customer" '
     +'cannot be answered yet. Click-to-WhatsApp ads do send that information on the first message &mdash; '
     +'it just needs capturing from here on.</div>';
}

/* ---- Leads: people talking to us who have never bought ---- */
function renderLeads(){
  const rows=LEADS().slice().sort((a,b)=>new Date(b.last_in_at||0)-new Date(a.last_in_at||0));
  const warm=rows.filter(c=>colOf(c)!=='quiet').length;
  $('vLeads').innerHTML=
    '<div class="h1">Leads</div>'
   +'<div class="h1s">Talking to you, but no job and no customer record yet. This is new business.</div>'
   +'<div class="cards">'
     +kpi(rows.length,'Total leads')
     +kpi(warm,'Still warm','active in the last 14 days','win')
     +kpi(rows.length-warm,'Gone cold','','lost')
   +'</div>'
   +'<div class="panel2"><div class="pt">'+rows.length+' leads &mdash; newest first</div>'
   +'<table class="t2"><thead><tr><th>Who</th><th>Last message</th><th>Stage</th><th>State</th><th>When</th></tr></thead><tbody>'
   +(rows.length?rows.slice(0,200).map(c=>{
       const last=LASTMSG[c.chat_jid], col=colOf(c);
       const label=(COLS.find(x=>x.key===col)||{}).label||col;
       const a=agoTxt(c.last_in_at||c.last_out_at);
       const hasName=!!(c.name&&String(c.name).trim());
       return '<tr onclick="openThread('+JSON.stringify(c.chat_jid).replace(/"/g,'&quot;')+')">'
         +'<td><b>'+esc(hasName?c.name:(c.phone||'(no number)'))+'</b>'
           +(hasName?'<div class="sub" style="color:var(--text2);font-size:11px">'+esc(c.phone||'')+'</div>':'')+'</td>'
         +'<td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
           +(last?(last.direction==='out'?'<b>You:</b> ':'')+esc(last.body||'['+(last.msg_type||'media')+']'):'<span style="color:var(--text2)">—</span>')+'</td>'
         +'<td>'+(c.stage?'<span class="chip stage">'+esc(shortStage(c.stage))+'</span>':'')+'</td>'
         +'<td>'+esc(label)+'</td>'
         +'<td class="'+a.cls+'" style="font-weight:800">'+esc(a.t)+'</td></tr>';
     }).join('')
     :'<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text2)">No leads — everyone talking to you is already a customer.</td></tr>')
   +'</tbody></table></div>'
   +(rows.length>200?'<div class="h1s">Showing the newest 200.</div>':'');
}

/* ---- Reports ---- */
function renderReports(){
  const over=Object.values(OVER);
  const withJobs=over.filter(o=>o.jobs>0);
  const rev=withJobs.reduce((s,o)=>s+(Number(o.revenue)||0),0);
  const avg=withJobs.length?rev/withJobs.length:0;

  // lead_source as recorded on the jobs themselves
  const bySrc={};
  withJobs.forEach(o=>{
    const keys=(o.lead_sources||'').split(',').map(s=>s.trim()).filter(Boolean);
    const list=keys.length?keys:['(not recorded)'];
    list.forEach(k=>{ bySrc[k]=bySrc[k]||{n:0,rm:0}; bySrc[k].n++; bySrc[k].rm+=Number(o.revenue)/list.length; });
  });
  const srcRows=Object.entries(bySrc).sort((a,b)=>b[1].rm-a[1].rm);
  const maxSrc=srcRows.length?srcRows[0][1].rm||1:1;

  // conversations started per month
  const byMon={};
  CHATS.forEach(c=>{ const d=c.first_in_at||c.last_in_at; if(!d) return;
    const k=String(d).slice(0,7); byMon[k]=(byMon[k]||0)+1; });
  const monRows=Object.entries(byMon).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8);
  const maxMon=monRows.reduce((m,r)=>Math.max(m,r[1]),1);

  $('vReports').innerHTML=
    '<div class="h1">Reports</div>'
   +'<div class="h1s">What your WhatsApp conversations are actually worth.</div>'
   +'<div class="cards">'
     +kpi(RM(rev),'Revenue behind chats','from '+withJobs.length+' paying customers','win')
     +kpi(RM(avg),'Average per customer')
     +kpi(Math.round(withJobs.length/Math.max(1,CHATS.length)*100)+'%','Chats that became customers')
   +'</div>'
   +'<div class="panel2"><div class="pt">Where that work was recorded as coming from</div>'
   +'<table class="t2"><thead><tr><th>Lead source</th><th>Customers</th><th>Revenue</th><th style="width:34%"></th></tr></thead><tbody>'
   +srcRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+esc(RM(v.rm))+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v.rm/maxSrc*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>'
   +'<div class="panel2"><div class="pt">New conversations per month</div>'
   +'<table class="t2"><thead><tr><th>Month</th><th>Conversations</th><th style="width:50%"></th></tr></thead><tbody>'
   +monRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v/maxMon*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>';
}

async function boot(){
  try{ ALERTS = localStorage.getItem('gl_crm_alerts')==='1' && Notification.permission==='granted'; }catch(e){}
  setAlertBtn();
  setInterval(()=>{ if(!document.hidden && $('ov').classList.contains('hide')) load(); }, 60000);
  const want=(location.hash||'').replace('#','');
  if(NAV.some(n=>n.id===want)) VIEW=want;
  drawNav(); go(VIEW);
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); load(); }
  else $('gate').classList.remove('hide');
}
async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  if(!email||!pass){ $('loginErr').textContent='Enter email and password.'; return; }
  $('loginErr').textContent='Signing in…';
  let res;
  try{ res=await sb.auth.signInWithPassword({email,password:pass}); }
  catch(e){ $('loginErr').textContent='Network error: '+(e.message||e); return; }
  if(res.error){ $('loginErr').textContent='Login failed: '+res.error.message; return; }
  $('loginErr').textContent=''; $('gate').classList.add('hide');
  $('main').classList.remove('hide'); load();
}
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
$('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeThread(); });
boot();
</script>
