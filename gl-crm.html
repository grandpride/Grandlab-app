<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandlab CRM</title>
<!-- Installs on the reception PC as its own window via Chrome/Edge "Install".
     No service worker on purpose: a cached app shell would go stale and the
     board must always show what the database says right now. -->
<link rel="manifest" href="gl-crm.webmanifest">
<meta name="theme-color" content="#F5C518">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gl-backend-config.js"></script>
<script>/* backend switch (docs/cf-migration-gl.md): ONLY when the switch is on for module "core" (gl-backend-config.js) or this device chose ?backend=cf, load gl-cf-client.js + gl-cf-page.js. Off = nothing else happens. */
(function(){try{var M='core',on;if(typeof GL_BACKEND_PICK==='function'){on=GL_BACKEND_PICK(M)==='cf';}else{var m=/[?&]backend=(cf|sb)(?:&|$)/.exec(location.search);if(m){if(m[1]==='cf')localStorage.setItem('gl_backend','cf');else localStorage.removeItem('gl_backend');}on=localStorage.getItem('gl_backend')==='cf';}if(on){window.GLCF_PAGE_CFG={page:'gl-crm',module:M};document.write('<script src="gl-cf-client.js"><\/script><script src="gl-cf-page.js"><\/script>');}}catch(e){}})();</script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--card2:#F6F7F8;--gold:#F5C518;--gold-ink:#8A6D00;
      --text:#111111;--text2:#5F6368;--border:#E3E5E8;--red:#C0392B;--green:#157347;
      --amber:#9A6700;--sel:#FFF8E1;--head:#EEF0F2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
.hide{display:none !important}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
     background:var(--card2);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.bar .ttl{font-weight:900;font-size:15px;white-space:nowrap}
.bar .ttl span{color:var(--gold-ink)}
.back{color:var(--text2);text-decoration:none;font-size:12.5px;white-space:nowrap}
.grow{flex:1;min-width:80px}
input{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);
     color:var(--text);font-family:inherit;font-size:13px;width:100%}
input:focus{outline:none;border-color:var(--gold-ink)}
.btn{background:var(--gold);color:#000;border:none;border-radius:7px;padding:7px 13px;font-size:12.5px;
     font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
.btn2{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-wa{background:#25D366;color:#fff}
.btn-xs{padding:4px 9px;font-size:11.5px;border-radius:6px}
.note{background:#FFF8E1;border-bottom:1px solid #E8D48A;padding:8px 12px;font-size:12px;color:#6b5600}
.status{color:var(--text2);font-size:12px;padding:7px 12px}
.err{color:var(--red)}
.empty{color:var(--text2);text-align:center;padding:34px 12px}

/* ---- money strip ---- */
.strip{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--card2);overflow-x:auto}
.stat{padding:8px 14px;border-right:1px solid var(--border);white-space:nowrap}
.stat .v{font-weight:900;font-size:15px}
.stat .k{color:var(--text2);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.stat.win .v{color:var(--green)}
.stat.lost .v{color:var(--red)}

/* ---- board ---- */
.board{display:flex;gap:10px;padding:10px;align-items:flex-start;overflow-x:auto}
.sortbar{display:flex;align-items:center;gap:6px;padding:8px 12px 0;font-size:11.5px;color:var(--text2)}
.sortbar button{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:3px 10px;font:inherit;font-size:11.5px;cursor:pointer;color:inherit}
.sortbar button.on{background:var(--gold);border-color:var(--gold-ink);font-weight:700}
.col{flex:1 1 238px;min-width:238px;background:var(--card2);border:1px solid var(--border);border-radius:10px;
     display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.colh{padding:10px 12px;border-bottom:1px solid var(--border);font-weight:800;font-size:11.5px;
      text-transform:uppercase;letter-spacing:.03em;color:var(--text2);display:flex;gap:6px;align-items:center}
.colh .n{background:var(--border);color:var(--text2);border-radius:9px;padding:0 6px;font-size:10.5px}
.colh.c-reply{color:var(--red)} .colh.c-waiting{color:var(--amber)}
.colh.c-ghost{color:var(--red)} .colh.c-paid{color:var(--green)}
.colh.c-closed{color:var(--text2)}
.collist{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--gold-ink)}
.card .nm{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ph{color:var(--text2);font-size:12px;font-variant-numeric:tabular-nums}
.card .last{color:var(--text2);font-size:12.5px;margin-top:4px;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:800;
      background:var(--border);color:var(--text2)}
.chip.stage{background:#E7F0FA;color:#0B5FAE}
.col.urgent{border-color:var(--red)}
.chip.mem{background:var(--gold);color:#000}
.chip.rm{background:#E6F4EA;color:var(--green)}
.ago{font-size:10.5px;font-weight:800;margin-left:auto}
.ago.warm{color:var(--amber)} .ago.cold{color:var(--red)} .ago.ok{color:var(--text2)}

/* ---- thread panel ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:flex-end}
.ov.hide{display:none !important}
.panel{background:var(--bg);width:min(560px,100%);height:100%;display:flex;flex-direction:column}
.ph-head{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--card2);
         display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-head .nm{font-weight:900;font-size:14px}
.rec{padding:9px 12px;border-bottom:1px solid var(--border);background:#FAFBFC;font-size:12px}
.rec .row{display:flex;gap:8px;padding:2px 0}
.rec .k{color:var(--text2);min-width:92px}
.thread{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px;background:#F0F2F5}
.msg{max-width:78%;padding:7px 10px;border-radius:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.msg.in{background:var(--card);align-self:flex-start;border:1px solid var(--border)}
.msg.out{background:#DCF8C6;align-self:flex-end}
.msg .t{display:block;color:var(--text2);font-size:10px;margin-top:3px}
.msg.sys{align-self:center;background:transparent;color:var(--text2);font-size:11px;max-width:100%}
.msg.pending{background:#EFEFEF;align-self:flex-end;color:var(--text2);font-style:italic}
.reply{display:flex;gap:8px;align-items:flex-end;padding:9px 12px;border-top:1px solid var(--border);background:var(--card2)}
.reply textarea{flex:1;min-width:0;resize:none;font-family:inherit;font-size:13px;padding:8px 10px;
  border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}
.reply textarea:focus{outline:none;border-color:var(--gold-ink)}
.replyNote{padding:6px 12px 10px;font-size:11.5px;color:var(--text2);background:var(--card2)}
.whois{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px 0;font-size:11.5px;color:var(--text2);background:var(--card2)}
.whois input{border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;font-family:inherit;font-weight:700;width:120px;background:var(--card);color:inherit}
#tWhoNote{flex:1 1 180px;min-width:0}
.whois select{border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:12px;
  font-family:inherit;font-weight:700;background:var(--card);color:inherit;max-width:130px}
.whois .mvbtn{padding:3px 10px}
#vSet input{border:1px solid var(--line2);border-radius:7px;padding:6px 10px;font-size:13px;
  font-family:inherit;background:var(--card);color:inherit;min-width:0}
.msg .by{display:block;font-size:10.5px;font-weight:800;letter-spacing:.2px;
  color:var(--blue);margin-bottom:2px}
.msg .by.byph{color:var(--ink2);font-weight:700;font-style:italic}
.replyNote.err{color:var(--red)}
.mia{border-bottom:1px solid var(--border);background:#FFFBEB;padding:8px 12px;max-height:40vh;overflow-y:auto}
.mia .mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text2)}
.mia .mh b{color:var(--text);font-size:12.5px;margin-right:2px}
.mia .lg{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:inherit}
.mia .lg.on{background:var(--gold);border-color:var(--gold-ink);font-weight:700}
.mia .sp{flex:1}
.mia .warn{margin-top:6px;padding:6px 9px;border-radius:7px;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;font-size:12px}
.mia .say{margin-top:6px;font-size:12px;color:var(--text2)}
.mia .why{margin-top:6px;font-size:11.5px;color:var(--text2)}
.miaopt{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 10px;margin-top:6px;cursor:pointer;font:inherit;color:inherit}
.miaopt:hover{border-color:var(--gold-ink)}
.miaopt .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin-bottom:2px}
.miaopt .tx{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:pre-wrap;font-size:12.5px;line-height:1.4}
.miaopt:hover .tx{-webkit-line-clamp:unset}
/* ---- shell: sidebar + view area ---- */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 42px)}
.side{flex:0 0 184px;border-right:1px solid var(--border);background:var(--card2);padding:8px 0}
.side .grp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text2);padding:10px 14px 4px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;font-weight:600;
  color:var(--text);cursor:pointer;border-left:3px solid transparent;text-decoration:none}
.nav:hover{background:var(--sel)}
.nav.on{background:var(--card);border-left-color:var(--gold);font-weight:800}
.nav .ico{width:17px;text-align:center;flex:0 0 17px}
.nav .pill{margin-left:auto;background:var(--border);color:var(--text2);border-radius:9px;
  padding:0 6px;font-size:10.5px;font-weight:800}
.nav .pill.hot{background:var(--red);color:#fff}
.nav .ext{margin-left:auto;color:var(--text2);font-size:11px}
.vbody{flex:1;min-width:0;display:flex;flex-direction:column}
.pad{padding:14px}
.h1{font-size:16px;font-weight:900;margin:0 0 2px}
.h1s{color:var(--text2);font-size:12px;margin-bottom:12px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.kpi{flex:1 1 150px;min-width:150px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card)}
.kpi .v{font-size:21px;font-weight:900;line-height:1.15}
.kpi .k{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.kpi .s{color:var(--text2);font-size:11px;margin-top:4px}
.kpi.win .v{color:var(--green)} .kpi.lost .v{color:var(--red)}
.panel2{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.panel2 .pt{background:var(--head);padding:7px 11px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.03em;color:var(--text2)}
table.t2{width:100%;border-collapse:collapse;font-size:12.5px}
table.t2 th{text-align:left;font-weight:800;font-size:10.5px;text-transform:uppercase;
  color:var(--text2);padding:6px 11px;border-bottom:1px solid var(--border)}
table.t2 td{padding:6px 11px;border-bottom:1px solid var(--border)}
table.t2 tr:last-child td{border-bottom:none}
table.t2 tbody tr:hover{background:var(--sel);cursor:pointer}
.bar2{height:7px;border-radius:4px;background:var(--gold);min-width:2px}
.buildstamp{color:var(--text2);font-size:10px;padding:12px 14px 6px;opacity:.75}
.soonbox{background:#FFF8E1;border:1px dashed #E8D48A;border-radius:9px;padding:11px 12px;
  color:#6b5600;font-size:12.5px}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{flex:0 0 auto;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:0}
  .side .grp{display:none}
  .nav{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav.on{border-left-color:transparent;border-bottom-color:var(--gold)}
  .nav .pill,.nav .ext{margin-left:5px}
}
@media(max-width:700px){ .col{flex:0 0 84vw;min-width:84vw;max-width:84vw} }

/* ---- surface refresh -------------------------------------------------
   Laid out like the CRM dashboards Jimmy referenced: a soft page behind
   white cards, a quiet sidebar with one solid active item, and colour used
   to carry data rather than to decorate. Grandlab gold stays the brand
   accent so this sits beside the Hub and POS instead of looking borrowed. */
:root{
  --page:#F1F4F8; --line2:#E8ECF1; --blue:#2563EB; --blue-soft:#EEF3FE;
  --ink:#0F172A; --ink2:#64748B;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
}
body{background:var(--page);color:var(--ink)}
.bar{background:#fff;border-bottom:1px solid var(--line2);box-shadow:var(--shadow)}
.side{background:#fff;border-right:1px solid var(--line2);padding:10px 8px}
.side .grp{padding:12px 8px 5px;color:var(--ink2)}
.nav{border-left:none;border-radius:9px;margin-bottom:1px;color:var(--ink);padding:9px 10px}
.nav:hover{background:var(--blue-soft)}
.nav.on{background:var(--blue);color:#fff;font-weight:800}
.nav.on .ico,.nav.on .ext{color:#fff}
.nav.on .pill{background:rgba(255,255,255,.25);color:#fff}
.nav .pill.hot{background:#DC2626;color:#fff}
.nav.on .pill.hot{background:#fff;color:#DC2626}
.buildstamp{padding:14px 10px 4px}

.kpi{border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:13px 14px;
  display:flex;flex-direction:column;justify-content:center;position:relative;min-height:86px}
.kpi .v{font-size:23px;letter-spacing:-.01em;color:var(--ink)}
.kpi .k{color:var(--ink2);font-size:11px}
.kpi .s{color:var(--ink2)}
.kpi .chip-ico{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.panel2{border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.panel2 .pt{background:#fff;border-bottom:1px solid var(--line2);color:var(--ink2);padding:11px 14px}
table.t2 th{border-bottom:1px solid var(--line2);padding:8px 14px;color:var(--ink2)}
table.t2 td{border-bottom:1px solid var(--line2);padding:9px 14px}
table.t2 tbody tr:hover{background:var(--blue-soft)}
.col{background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
.colh{border-bottom:1px solid var(--line2)}
.card{border:1px solid var(--line2);border-radius:10px}
.card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.strip{background:#fff;border-bottom:1px solid var(--line2)}
.stat{border-right:1px solid var(--line2)}
.bar2{background:var(--blue);height:8px}

/* pipeline as a labelled list, not a pie: four categories compare better
   read down a column, and the dot is never the only thing saying which is which */
.stagerow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.stagerow:last-child{border-bottom:none}
.stagerow:hover{background:var(--blue-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.stagerow .lbl{font-weight:700}
.stagerow .n{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums}
.stagerow .track{flex:0 0 120px;height:8px;border-radius:5px;background:var(--line2);overflow:hidden}
.stagerow .fill{height:100%;border-radius:5px}

.chartwrap{padding:14px}
.legend{display:flex;gap:16px;align-items:center;padding:0 14px 10px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fchips{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px}
.fchip{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;background:#fff}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fchip b{font-weight:800;margin-left:3px}
.chip.ad{background:var(--blue-soft);color:var(--blue)}
.chip.src{background:#EEF1F5;color:#5A6472}
.chip.mark{background:#EDE9FE;color:#5B21B6}
.chip.chk{background:#EEF1F5;color:#5A6472}

/* --- Pipeline lights ---------------------------------------------------
   A light, not a flash. One soft tinted overlay fading in and out behind the
   card's text, so it is noticeable across the room without making the words
   hard to read. Nothing moves and nothing resizes. The overlay is a separate
   layer so only its opacity animates. Switched off entirely for anyone whose
   system asks for reduced motion - the tint stays, the pulsing stops. */
.card{position:relative;overflow-wrap:anywhere}
.card>*{position:relative;z-index:1}
.card.lit::before{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;opacity:.16}
.card.lit-red::before{background:#DC2626}
.card.lit-amber::before{background:#D97706}
.card.lit-red{border-color:#FCA5A5}
.card.lit-amber{border-color:#FCD34D}
@media(prefers-reduced-motion:no-preference){
  .card.lit::before{animation:cardpulse 2.4s ease-in-out infinite}
  .card.lit-amber::before{animation-duration:3.2s}
}
@keyframes cardpulse{0%,100%{opacity:.07}50%{opacity:.26}}

/* Won is a green column, not just a green heading. */
.col.won{background:#F2FBF5;border-color:#BBF7D0}
.col.won .colh{background:#DCFCE7;border-bottom-color:#BBF7D0;color:#15803D}
.col.won .card{border-color:#CBEBD6}

/* The decide prompt and the move picker */
.decide{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.decide .dq{font-size:11px;color:var(--ink2);font-weight:700;width:100%;margin-bottom:2px}
.mvbtn{border:1px solid var(--line2);background:#fff;border-radius:999px;
  padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink);
  font-family:inherit;line-height:1.5}
.mvbtn:hover{border-color:var(--blue);color:var(--blue)}
.mvbtn.gw:hover{border-color:#15803D;color:#15803D}
.mvbtn.gq:hover{border-color:#D97706;color:#92400E}
.mvbtn.gx:hover{border-color:#B91C1C;color:#B91C1C}
.mvmore{margin-left:auto;border:none;background:none;cursor:pointer;color:var(--ink2);
  font-size:15px;line-height:1;padding:0 2px;font-family:inherit}
.mvmore:hover{color:var(--blue)}
/* --- Ads detail --- */
.adcard{border:1px solid var(--line2);border-radius:12px;background:#fff;padding:13px 15px;
  margin-bottom:11px;box-shadow:var(--shadow)}
.adcard .ah{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.adcard .an{font-weight:800;font-size:13.5px;min-width:0;flex:1 1 220px}
.adcard .ac{color:var(--ink2);font-size:11.5px;font-weight:500;margin-top:2px}
.verd{border-radius:999px;padding:3px 11px;font-size:11px;font-weight:800;white-space:nowrap}
.v-keep{background:#DCFCE7;color:#15803D}
.v-watch{background:#FEF3C7;color:#92400E}
.v-stop{background:#FEE2E2;color:#B91C1C}
.v-early{background:#EEF1F5;color:#5A6472}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:11px}
.mcell{min-width:0}
.mcell .ml{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:700}
.mcell .mv{font-size:15px;font-weight:800;margin-top:2px;line-height:1.2}
.mcell .ms{font-size:10.5px;color:var(--ink2);margin-top:1px}
.mv .up{color:#B91C1C}.mv .dn{color:#15803D}
.why{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);

<script>
const SUPABASE_URL="https://db.grandlab.com.my";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkzMDY5NDExLCJleHAiOjE5NTA3NDk0MTF9.IcbPnDCd9p6Z-_FNMvzfg9k6ayX7IpC48zdGacAD_qw";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,
      {auth:{persistSession:true,autoRefreshToken:true,storageKey:'gl_auth'}});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=n=>'RM'+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});

let CHATS=[], LASTMSG={}, CUR=null, OVER={}, VIEW='pipeline', TASKS=[], MONTHLY=[], LEADINFO={}, ADS=[], ADDAYS=30;
let STAFF=[], ME=null, STAFF_FROM=null;

const today=()=>new Date().toISOString().slice(0,10);
/* Due today or already overdue — the only tasks worth putting a number on. */
const dueSoon=t=>!!t.due_on && String(t.due_on)<=today();

/* The sidebar. Contacts and Calendar deliberately open the apps that already
   own that data rather than showing a second copy of it here - two screens
   listing customers is two screens that can disagree. */
const NAV=[
  {grp:'Conversations'},
  {id:'dash',     ico:'&#9632;', label:'Dashboard'},
  {id:'pipeline', ico:'&#9776;', label:'Pipeline', count:()=>countCol('reply'), hot:true},
  {id:'leads',    ico:'&#9728;', label:'Leads',    count:()=>LEADS().length},
  {grp:'Customers'},
  {id:'contacts', ico:'&#9679;', label:'Customers', href:'gl-customers.html'},
  {id:'members',  ico:'&#9734;', label:'Members',  href:'gl-members.html'},
  {grp:'Business'},
  {id:'ads',      ico:'&#9670;', label:'Ads'},
  {id:'reports',  ico:'&#9650;', label:'Reports'},
  {id:'calendar', ico:'&#9633;', label:'Booking',   href:'gl-staff-appointment-FINAL.html'},
  {id:'tasks',    ico:'&#10003;', label:'Tasks', count:()=>TASKS.filter(t=>!t.done&&dueSoon(t)).length, hot:true},
  {id:'autom',    ico:'&#8635;', label:'Automation', soon:'Rules like "nobody replied in 2 hours - tell reception" and "quiet for 7 days - suggest a follow-up".'},
  {id:'settings', ico:'&#9881;', label:'Settings'}
];

function countCol(key){
  let n=0; for(const c of CHATS) if(colOf(c)===key) n++;
  return n;
}
/* A lead is someone talking to us who is not already a customer. */
function LEADS(){
  return CHATS.filter(c=>{
    const o=OVER[c.chat_jid]||{};
    return !o.is_customer && !(o.jobs>0);
  });
}

/* Bumped whenever this page changes, and shown at the bottom of the sidebar.
   GitHub Pages and an installed app both cache hard, so without this there is
   no way to tell "the fix is not deployed" from "the fix does not work". */
const BUILD='2026-11-23p';

function drawNav(){
  $('side').innerHTML = NAV.map(n=>{
    if(n.grp) return '<div class="grp">'+esc(n.grp)+'</div>';
    if(n.href) return '<a class="nav" href="'+esc(n.href)+'" target="_blank" rel="noopener">'
      +'<span class="ico">'+n.ico+'</span>'+esc(n.label)+'<span class="ext">&#8599;</span></a>';
    let pill='';
    if(n.count){ const v=n.count(); if(v) pill='<span class="pill'+(n.hot?' hot':'')+'">'+v+'</span>'; }
    /* Single quotes inside the double-quoted attribute. JSON.stringify would
       emit go("dash"), and that second double quote closes the attribute. */
    return '<div class="nav'+(VIEW===n.id?' on':'')+"\" onclick=\"go('"+n.id+"')\">"
      +'<span class="ico">'+n.ico+'</span>'+esc(n.label)+pill+'</div>';
  }).join('') + '<div class="buildstamp">build '+BUILD+'</div>';
}

function go(id){
  VIEW=id;
  const soon=(NAV.find(n=>n.id===id)||{}).soon;
  for(const v of ['vPipeline','vDash','vLeads','vReports','vAds','vTasks','vSet','vSoon'])
    $(v).classList.add('hide');
  if(id==='settings'){ $('vSet').classList.remove('hide'); renderSettings(); }
  else if(soon){
    $('vSoon').classList.remove('hide');
    $('vSoon').innerHTML='<div class="h1">'+esc((NAV.find(n=>n.id===id)||{}).label)+'</div>'
      +'<div class="h1s">Not built yet.</div><div class="soonbox">'+esc(soon)+'</div>';
  } else if(id==='dash')    { $('vDash').classList.remove('hide');    renderDash(); }
  else if(id==='leads')     { $('vLeads').classList.remove('hide');   renderLeads(); }
  else if(id==='reports')   { $('vReports').classList.remove('hide'); renderReports(); }
  else if(id==='tasks')     { $('vTasks').classList.remove('hide');   renderTasks(); }
  else if(id==='ads')       { $('vAds').classList.remove('hide');     renderAds(); }
  else                      { $('vPipeline').classList.remove('hide'); }
  drawNav();
  try{ location.hash=id; }catch(e){}
}

/* The columns are Jimmy's own vocabulary, already in gl_wa_chat.status -
   talking / waiting / ghost / paid. Inventing new ones would have thrown away
   the stage flow the bridge has been writing since October. */
/* Each column means exactly one thing, and only one.
     Needs reply    they wrote last and nobody has answered
     Waiting on them  you answered; it is their turn
     Gone quiet     they stopped replying and nothing came back
     Closed         finished, no sale - reception decided that, it is not a guess
     Won            money: a job or payment dated on or after the chat started
   "Gone quiet" and "Closed" used to be the same pile, which made the board lie
   about how many leads were actually lost. They are separate now. */
const COLS=[
  {key:'reply',   label:'Needs reply',     cls:'c-reply'},
  {key:'waiting', label:'Waiting on them', cls:'c-waiting'},
  {key:'quiet',   label:'Gone quiet',      cls:'c-ghost'},
  {key:'closed',  label:'Closed, no sale', cls:'c-closed'},
  {key:'paid',    label:'Won',             cls:'c-paid'}
];
const QUIET_DAYS=14;
/* How long a card may sit in "Waiting on them" before it asks reception to
   decide. Jimmy's number. */
const NUDGE_HOURS=12;

/* "Stage 7 - Gone quiet" -> "Gone quiet". The number is noise on a card. */
function shortStage(s){
  const t=String(s||'').trim();
  if(!t) return '';
  const m=t.match(/^Stage\s*\d+\s*[—\-–]\s*(.+)$/i);
  return m?m[1].trim():t;
}
function agoTxt(ts){
  if(!ts) return {t:'',cls:'ok'};
  const d=new Date(ts); if(isNaN(d)) return {t:'',cls:'ok'};
  const mins=Math.floor((Date.now()-d.getTime())/60000);
  if(mins<1)   return {t:'now',cls:'ok'};
  if(mins<60)  return {t:mins+'m',cls:mins>=30?'warm':'ok'};
  const hrs=Math.floor(mins/60);
  if(hrs<24)   return {t:hrs+'h',cls:hrs>=2?'warm':'ok'};
  const days=Math.floor(hrs/24);
  return {t:days+'d',cls:'cold'};
}
const dmy=s=>{ if(!s) return ''; const d=new Date(s); return isNaN(d)?'':
  d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+
  d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };

function waLink(phone){
  const d=String(phone||'').replace(/[^0-9]/g,'');
  return d.length>=9 ? 'https://wa.me/'+d : '';
}
/* Which column a chat belongs in.

   The imported chats all carry status 'talking' because that is the database
   default, which put 368 of 390 in one useless pile. So the column is worked
   out from the conversation itself: who spoke last, and how long ago. That is
   the question reception actually has — "who is waiting on me right now" —
   and it is true for every chat, including the hundreds nobody ever staged.
   The stage chip still shows on the card, so nothing MIA recorded is lost. */
/* Did this conversation turn into money?
   Nobody has to mark it. A chat counts as won when the number has a job or
   payment dated on or after the day the conversation started. An old job does
   NOT count: a regular who last paid two years ago and texts in today is a
   live enquiry, not a win. One day of slack because a walk-in is sometimes
   written up the day before the chat lands.
   Returns the job date so the card can show it, or null. */
function wonAt(c){
  const o=OVER[c.chat_jid]||{};
  if(!(Number(o.jobs)>0) || !o.last_job) return null;
  const start=c.first_in_at||c.last_in_at;
  if(!start) return null;
  const job=new Date(String(o.last_job)+'T23:59:59').getTime();
  if(!job) return null;
  return job >= new Date(start).getTime()-86400000 ? o.last_job : null;
}

function colOf(c){
  const s=String(c.status||'').toLowerCase();
  if(s==='paid')   return 'paid';     // reception marked it won by hand
  if(s==='closed') return 'closed';   // reception marked it finished, no sale

  const lastIn =c.last_in_at ? new Date(c.last_in_at).getTime() : 0;
  const lastOut=c.last_out_at? new Date(c.last_out_at).getTime(): 0;
  const newest=Math.max(lastIn,lastOut);
  if(!newest) return 'quiet';

  /* "Gone quiet" pressed by reception AFTER the customer's last message is
     believed, even though that message was never answered — otherwise the
     button looks dead and the card just sits in Needs reply. If the customer
     writes again afterwards, their new message is newer than the mark and the
     card comes back to Needs reply by itself. */
  if(s==='ghost' && c.ghost_at && new Date(c.ghost_at).getTime() >= lastIn) return 'quiet';
  const unanswered = lastIn > lastOut;
  const gone = Date.now()-newest > QUIET_DAYS*86400000;
  /* An open message comes first — paid, ghosted or neither. A customer who
     has bought, or who went quiet months ago and has just written in, still
     has to be answered, and that is the whole point of this board. */
  if(unanswered && !gone) return 'reply';
  if(wonAt(c)) return 'paid';
  if(s==='ghost') return 'quiet';
  if(gone) return 'quiet';
  return 'waiting';
}

/* Which light, if any, this card shows.
   red   - they are waiting on you, right now
   amber - you answered and they have said nothing for NUDGE_HOURS, so reception
           has to decide whether it is finished or dead
   none  - nothing needed, or reception has already decided */
function lightOf(c,col){
  if(col==='reply') return 'red';
  if(col!=='waiting') return '';
  const out=c.last_out_at?new Date(c.last_out_at).getTime():0;
  if(!out) return '';
  return (Date.now()-out > NUDGE_HOURS*3600000) ? 'amber' : '';
}

/* Where the enquiry came from, as a chip on the card.
   Blue = a real Meta advert tag carried by the message itself. Grey = weaker:
   either reception tagged the chat by hand, or the lead source typed on the
   job card. Nothing at all rather than dress a guess up as attribution. */
function srcChip(jid){
  const li=LEADINFO[jid]; if(!li) return '';
  const k=li.src_kind, lbl=String(li.src_label||'').trim();
  if(!lbl || k==='unknown' || lbl==='Not recorded') return '';
  const short=lbl.length>20?lbl.slice(0,19)+'…':lbl;
  const tip=(k==='ad'?'Meta advert: ':(k==='tagged'?'Tagged by reception: ':'From the job card: '))
    +lbl+(li.campaign?' — '+li.campaign:'');
  return '<span class="chip '+(k==='ad'?'ad':'src')+'" title="'+esc(tip)+'">'
    +(k==='ad'?'&#9872; ':'')+esc(short)+'</span>';
}

/* The move picker. Four real destinations, because each one is a status the
   database will actually accept and keep:
     Won     status 'paid'   - reception says money came in
     Closed  status 'closed' - finished, no sale
     Quiet   status 'ghost'  - they stopped replying
     Active  status 'talking'- clear the override, go back to being worked out
             from the messages themselves
   "Needs reply" and "Waiting on them" are not choices here on purpose: they
   are read off who wrote last, so forcing one would only go stale the next
   time anybody sends a message. "Active" is how you get back into them. */
let OPENMV='';
function mvToggle(ev,jid){
  ev.stopPropagation();
  OPENMV = (OPENMV===jid) ? '' : jid;
  render();
}
function mvPicker(c,col,prompt){
  const j=JSON.stringify(c.chat_jid).replace(/"/g,'&quot;');
  const b=(cls,st,lbl,tip)=>'<button class="mvbtn '+cls+'" title="'+esc(tip)
    +'" onclick="setChatStatus(event,'+j+',\''+st+'\')">'+lbl+'</button>';
  const opts=
     (col!=='paid'  ? b('gw','paid','Won','Money came in from this conversation') : '')
    +(col!=='closed'? b('','closed','Done','Finished, no sale — stop the light, keep the chat') : '')
    +(col!=='quiet' ? b('gq','ghost','Gone quiet','They stopped replying') : '')
    +b('gx','talking','Active','Clear the mark and work it out from the messages again');
  if(!prompt) return '<div class="decide">'+opts+'</div>';
  return '<div class="decide"><div class="dq">No reply in over '+NUDGE_HOURS
    +' hours &mdash; is this done, or gone quiet?</div>'+opts+'</div>';
}

/* What to show when a message has no text of its own.
   "[text]" told nobody anything. A WhatsApp message can reach the database
   with an empty body for two different reasons and they deserve different
   words: it was never text in the first place (a voice note, a photo), or
   wacli could not open it at all — its own log calls that "no supported text
   content", which covers reactions, edited and deleted messages, polls and
   view-once. Media is in the database as a type but the file itself has not
   been downloaded yet, so the label says that rather than pretending. */
const MEDIA_LABEL={
  voice:'\u{1F3A4} Voice note',
  audio:'\u{1F50A} Audio',
  image:'\u{1F5BC}\uFE0F Photo',
  video:'\u{1F3AC} Video',
  document:'\u{1F4C4} Document',
  sticker:'Sticker',
  location:'\u{1F4CD} Location'
};
function msgText(m){
  const body=m&&m.body ? String(m.body) : '';
  if(body.trim()) return body;
  const t=String((m&&m.msg_type)||'').toLowerCase();
  // only the ones that are really a file say so; a sticker or a pin is not
  // something anybody wants downloaded
  if(MEDIA_LABEL[t]) return MEDIA_LABEL[t]
    + (['voice','audio','image','video','document'].includes(t) ? ' \u2014 not downloaded' : '');
  return '(couldn\u2019t read this one \u2014 a reaction, an edit, or a type the bridge cannot open)';
}

function cardHtml(c,col){
  const a=agoTxt(c.last_in_at);
  const st=shortStage(c.stage);
  const last=LASTMSG[c.chat_jid];
  const o=OVER[c.chat_jid]||{};
  const won=wonAt(c);
  const s=String(c.status||'').toLowerCase();
  const light=lightOf(c,col);
  // No name means an unsaved contact. Show the number once, not twice.
  const hasName=!!(c.name&&String(c.name).trim());
  const enq=LEADINFO[c.chat_jid]&&LEADINFO[c.chat_jid].enquiry;
  const j=JSON.stringify(c.chat_jid).replace(/"/g,'&quot;');
  // The amber card asks outright. Any other card keeps the picker behind "…".
  const showPicker = light==='amber' || OPENMV===c.chat_jid;
  return '<div class="card'+(light?' lit lit-'+light:'')+'" onclick="openThread('+j+')">'
    +'<div class="nm">'+esc(hasName?c.name:(c.phone||'(no number)'))+'</div>'
    +(hasName?'<div class="ph">'+esc(c.phone||'—')+'</div>':'')
    +(last?'<div class="last">'+(last.direction==='out'?'<b>You:</b> ':'')+esc(msgText(last))+'</div>':'')
    +'<div class="foot">'
      +srcChip(c.chat_jid)
      +(enq?'<span class="chip stage">'+esc(enq)+'</span>':(st?'<span class="chip stage">'+esc(st)+'</span>':''))
      +(won&&Number(o.revenue)>0
          ? '<span class="chip rm" title="'+esc('Job dated '+dmyShort(won))+'">'+esc(RM(o.revenue))+'</span>'
          : (s==='paid'&&!won ? '<span class="chip mark" title="Marked won by hand — no job or payment found against this number">marked won</span>'
          : (Number(c.paid_rm)>0?'<span class="chip rm">'+esc(RM(c.paid_rm))+'</span>':'')))
      +(s==='closed'?'<span class="chip chk">closed by you</span>':'')
      +'<span class="ago '+a.cls+'">'+a.t+'</span>'
      +(light==='amber'?'':'<button class="mvmore" title="Move this chat" onclick="mvToggle(event,'+j+')">&#8943;</button>')
    +'</div>'
    +(showPicker?mvPicker(c,col,light==='amber'):'')
    +'</div>';
}

/* One row, one column, and only ever the status column — see
   gl_crm_set_status in the database. Nothing is deleted and no message is
   sent. The card moves as soon as the server confirms. */
async function setChatStatus(ev,jid,st){
  ev.stopPropagation();
  const c=CHATS.find(x=>x.chat_jid===jid); if(!c) return;
  const was=c.status, wasGhost=c.ghost_at;
  /* The server stamps the moment it was marked quiet; do the same here so the
     card moves at once and does not wait for a reload to find out. */
  c.status=st; c.ghost_at=(st==='ghost')?new Date().toISOString():null;
  OPENMV=''; render();                     // move it at once, it feels instant
  try{
    const {error}=await sb.rpc('gl_crm_set_status',{p_jid:jid,p_status:st});
    if(error) throw error;
  }catch(e){
    c.status=was; c.ghost_at=wasGhost; render();   // put it back rather than lie
    $('statusLine').innerHTML='<span class="err">Could not move that chat: '
      +esc(e.message||e)+'</span>';
  }
}

function sortMode(){ try{ return localStorage.getItem('gl_crm_sort')==='wait'?'wait':'new'; }catch(e){ return 'new'; } }
function setSortMode(m){ try{ localStorage.setItem('gl_crm_sort',m); }catch(e){} render(); }
function drawSortBar(){
  const el=$('sortBar'); if(!el) return;
  const m=sortMode();
  el.innerHTML='Newest on top. Needs reply:'
    +'<button class="'+(m==='new'?'on':'')+'" onclick="setSortMode(\'new\')">Newest first</button>'
    +'<button class="'+(m==='wait'?'on':'')+'" onclick="setSortMode(\'wait\')" title="The customer who has waited longest is at the top">Longest wait first</button>';
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=CHATS.filter(c=>{
    if(!q) return true;
    const last=LASTMSG[c.chat_jid];
    return [c.name,c.phone,c.stage,c.status,c.remark,last&&last.body]
      .some(v=>String(v==null?'':v).toLowerCase().includes(q));
  });

  const by={}; COLS.forEach(x=>by[x.key]=[]);
  rows.forEach(c=>by[colOf(c)].push(c));
  /* Newest activity on top, in every column. "Activity" is whichever is later:
     the customer's last message or ours, so a chat we just answered rises too
     instead of sitting where its old customer message put it. Needs reply can
     also be flipped to longest-wait-first, which is the one that is losing
     money — reception's choice, remembered on this device. */
  const act=c=>Math.max(c.last_in_at?new Date(c.last_in_at).getTime():0, c.last_out_at?new Date(c.last_out_at).getTime():0);
  COLS.forEach(x=>by[x.key].sort((a,b)=>act(b)-act(a)));
  if(sortMode()==='wait') by.reply.sort((a,b)=>new Date(a.last_in_at||0)-new Date(b.last_in_at||0));
  drawSortBar();
  if(!q) alertNewReplies(by.reply);   // searching filters rows, so don't alert off a filtered list

  $('board').innerHTML = COLS.map(x=>{
    const list=by[x.key];
    return '<div class="col'+(x.key==='paid'?' won':'')+'">'
      +'<div class="colh '+x.cls+'">'+esc(x.label)
      +'<span class="n">'+list.length+'</span></div>'
      +'<div class="collist">'
      +(list.length?list.map(c=>cardHtml(c,x.key)).join(''):'<div class="empty" style="padding:14px;font-size:11.5px">Nothing here</div>')
      +'</div></div>';
  }).join('');

  // the money view: what this pipeline actually did
  /* No close-rate figure here on purpose. The denominator would be every
     contact ever messaged - suppliers, staff, wrong numbers - so it reads as
     a terrible number that means nothing. "Needs reply" is the one that costs
     money today, so that is what goes first. */
  /* Real money behind the Won column: the job total where we found one, and
     the old paid_rm field only as a fallback. A chat marked won by hand with
     no job against it adds nothing — a figure invented here would be worse
     than a smaller true one. */
  const wonRM=by.paid.reduce((s,c)=>{
    const rev=Number((OVER[c.chat_jid]||{}).revenue)||0;
    return s + (wonAt(c)&&rev ? rev : (Number(c.paid_rm)||0));
  },0);
  const oldest=by.reply.reduce((m,c)=>{
    const t=c.last_in_at?new Date(c.last_in_at).getTime():0;
    return t&&(!m||t<m)?t:m; },0);
  $('strip').innerHTML=
     stat(by.reply.length,'Needs reply', by.reply.length?'lost':'')
    +stat(oldest?agoTxt(new Date(oldest).toISOString()).t:'—','Longest wait', by.reply.length?'lost':'')
    +stat(by.waiting.length,'Waiting on them')
    +stat(by.quiet.length,'Gone quiet')
    +stat(by.paid.length,'Won','win')
    +stat(RM(wonRM),'Revenue tracked','win')
    +stat(rows.length,'Chats');

  $('statusLine').textContent = rows.length ? rows.length+' of '+CHATS.length+' shown' : '';
  $('emptyBox').classList.toggle('hide', rows.length>0);
  $('emptyBox').textContent = rows.length ? '' : (CHATS.length ? 'Nothing matches that search.' : 'No WhatsApp chats recorded yet.');
}
const stat=(v,k,cls)=>'<div class="stat '+(cls||'')+'"><div class="v">'+esc(v)+'</div><div class="k">'+esc(k)+'</div></div>';

async function load(){
  $('statusLine').textContent='Loading…';
  try{
    const {data:chats,error}=await sb.from('gl_wa_chat')
      .select('chat_jid,phone,name,stage,status,ghost_at,first_in_at,last_in_at,last_out_at,booked_at,paid_at,paid_rm,remark')
      .order('last_in_at',{ascending:false,nullsFirst:false})
      .limit(400);
    if(error) throw error;
    CHATS=chats||[];

    /* One query for the preview line on every card, newest first, then keep
       the first per chat. Cheaper than a query per card. */
    LASTMSG={};
    const {data:msgs}=await sb.from('gl_wa_msg')
      .select('chat_jid,direction,body,msg_type,wa_ts')
      .order('wa_ts',{ascending:false})
      .limit(3000);
    (msgs||[]).forEach(m=>{ if(!LASTMSG[m.chat_jid]) LASTMSG[m.chat_jid]=m; });

    /* Who each chat actually is, in Grandlab terms - customer or not, how many
       jobs, how much spent. One call for all of them; doing it per card would
       be 390 round trips. Staff-only and read-only on the server side. */
    OVER={};
    try{
      const {data:ov}=await sb.rpc('gl_crm_overview');
      (ov||[]).forEach(o=>{ OVER[o.chat_jid]=o; });
    }catch(e){ /* board still works without the enrichment */ }
    try{ const {data:mo}=await sb.rpc('gl_crm_monthly'); MONTHLY=mo||[]; }catch(e){ MONTHLY=[]; }
    LEADINFO={};
    try{ const {data:li}=await sb.rpc('gl_crm_lead_info');
         (li||[]).forEach(x=>{ LEADINFO[x.chat_jid]=x; }); }catch(e){}
    try{ const {data:ad}=await sb.rpc('gl_crm_ads',{p_days:ADDAYS}); ADS=ad||[]; }catch(e){ ADS=[]; }
    await loadStaff();

    await loadTasks();
    staleCheck();
    render();
    drawNav();
    if(VIEW==='dash') renderDash();
    else if(VIEW==='leads') renderLeads();
    else if(VIEW==='reports') renderReports();
    else if(VIEW==='tasks') renderTasks();
    else if(VIEW==='ads') renderAds();
  }catch(e){
    $('statusLine').innerHTML='<span class="err">Could not load: '+esc(e.message||e)+'</span>';
  }
}

/* The feed is only as fresh as whatever is writing to gl_wa_msg. If that has
   stopped, the board is a historical record and must say so rather than
   looking like a live view of a quiet week. */
function staleCheck(){
  const latest=CHATS.map(c=>c.last_in_at).filter(Boolean).sort().pop();
  const n=$('staleNote');
  if(!latest){ n.classList.add('hide'); return; }
  const days=Math.floor((Date.now()-new Date(latest).getTime())/86400000);
  if(days<3){ n.classList.add('hide'); return; }
  n.classList.remove('hide');
  n.innerHTML='<b>Not live.</b> The newest message here is '+esc(dmy(latest))+' ('+days
    +' days ago), so the WhatsApp feed has stopped writing. Everything below is history — '
    +'new chats are not being recorded until the bridge is reconnected.';
}

async function openThread(jid){
  CUR=CHATS.find(c=>c.chat_jid===jid); if(!CUR) return;
  $('ov').classList.remove('hide');
  $('tNm').textContent=CUR.name||CUR.phone||'(no name)';
  $('tPh').textContent=[CUR.phone,shortStage(CUR.stage),CUR.status].filter(Boolean).join(' · ');
  const w=waLink(CUR.phone);
  $('tWa').style.display=w?'':'none'; if(w) $('tWa').href=w;
  $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span>Looking up…</span></div>';
  $('tThread').innerHTML='<div class="msg sys">Loading…</div>';
  $('tBox').value=''; $('tReplyNote').textContent=''; $('tReplyNote').className='replyNote';
  miaReset();
  drawWho();
  loadRecord(CUR.phone);
  loadThread(jid);
}
function closeThread(){ $('ov').classList.add('hide'); CUR=null; miaReset(); }

/* The strip above the reply box. Two shapes: a free-text name while no staff
   have been set up, and a name + PIN sign-in once they have. */
function drawWho(){
  const box=$('tWhoWrap');
  if(!staffMode()){
    box.innerHTML='Replying as '
      +'<input id="tWho" placeholder="your name" maxlength="24" autocomplete="off">'
      +'<span id="tWhoNote"></span>';
    const i=$('tWho'); i.value=agentName();
    i.addEventListener('input',e=>{ setAgentName(e.target.value); whoNote(); });
    whoNote();
    return;
  }
  if(ME){
    box.innerHTML='Replying as <b style="color:var(--text);font-size:12.5px">'+esc(ME.name)+'</b>'
      +'<button class="mvbtn" onclick="signOutStaff()">Not me</button>'
      +'<span id="tWhoNote">— every reply starts with <b>'+esc(ME.name)+':</b> in bold, and is recorded against '+esc(ME.name)+'.</span>';
    return;
  }
  box.innerHTML='Who is replying? '
    +'<select id="tWhoSel">'+STAFF.filter(x=>x.active)
       .map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select>'
    +'<input id="tWhoPin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8" autocomplete="off" style="width:62px">'
    +'<button class="mvbtn" onclick="signInStaff()">Sign in</button>'
    +'<span id="tWhoNote">— so the customer sees who answered, and so you can see it later.</span>';
  $('tWhoPin').addEventListener('keydown',e=>{ if(e.key==='Enter') signInStaff(); });
}
function whoNote(){
  const n=$('tWhoNote'); if(!n) return;
  const w=agentName();
  n.textContent = w
    ? '— every reply starts with "'+w+':" in bold, so the customer knows who answered.'
    : '— leave blank to send with no name on the front.';
}
async function signInStaff(){
  const sel=$('tWhoSel'), pin=$('tWhoPin'), note=$('tReplyNote');
  if(!sel) return;
  note.className='replyNote'; note.textContent='Checking…';
  try{
    const {data,error}=await sb.rpc('gl_crm_staff_signin',{p_id:sel.value,p_pin:String(pin.value||'')});
    if(error) throw error;
    const row=(data&&data[0])||null;
    if(!row) throw new Error('Wrong PIN');
    meSet({id:row.id,name:row.name});
    note.textContent=''; drawWho(); if(CUR) loadThread(CUR.chat_jid);
  }catch(e){
    note.className='replyNote err';
    note.textContent=(e.message||String(e)).replace(/^.*Wrong PIN.*$/,'Wrong PIN.');
    pin.value=''; pin.focus();
  }
}
function signOutStaff(){ meSet(null); drawWho(); }

/* ---- replying ----------------------------------------------------------
   The reply is queued in gl_wa_outbox; the bridge on the shop PC picks it up
   and sends it through WhatsApp. Nothing is sent from the browser, and the
   database refuses a reply to a chat that does not exist, so this can only
   ever answer somebody who messaged first. */
/* ---- who is replying -------------------------------------------------
   One WhatsApp number is shared by the whole counter, so the only way a
   customer can tell Iqa from Alex is the name on the message, and the only
   way WE can tell is to ask who is sitting there. Staff pick their name and
   type a PIN; the PIN is checked on the server against a bcrypt hash that
   never leaves it (the table itself is readable by nobody).

   This is accountability, not security. Anyone holding the reception login
   can still reach the data directly - the PIN says who typed a reply, it
   does not lock anything down. Said plainly on the Settings screen too.

   Until the first staff member is added nothing changes: the old free-text
   name box stays, so this can never block reception from replying. */
function meGet(){
  try{
    const raw=sessionStorage.getItem('gl_crm_me'); if(!raw) return null;
    const m=JSON.parse(raw);
    // a shift, not forever: an unattended PC should not stay signed in
    if(!m || !m.id || (Date.now()-(m.at||0)) > 12*3600000) return null;
    return m;
  }catch(e){ return null; }
}
function meSet(m){
  try{
    if(m) sessionStorage.setItem('gl_crm_me', JSON.stringify({id:m.id,name:m.name,at:Date.now()}));
    else sessionStorage.removeItem('gl_crm_me');
  }catch(e){}
  ME=m;
}
async function loadStaff(){
  try{
    const {data}=await sb.rpc('gl_crm_staff_list');
    STAFF=data||[];
    STAFF_FROM=STAFF.length
      ? STAFF.reduce((m,x)=>{const t=new Date(x.created_at).getTime();return !m||t<m?t:m;},0)
      : null;
  }catch(e){ STAFF=[]; STAFF_FROM=null; }
  ME=meGet();
  // the name they signed in as may have been renamed or switched off since
  if(ME && !STAFF.some(x=>x.id===ME.id && x.active)) meSet(null);
}
function staffMode(){ return STAFF.some(x=>x.active); }

/* Work out who sent an outgoing message from the header it carries. The
   header IS the record - a reply queued here always starts with the name, a
   reply typed on the handset never does. Only counts from the day the first
   staff member was added, so the whole of this year's history is not
   mislabelled "from phone". */
function senderOf(m){
  if(!m || m.direction!=='out') return null;
  const body=String(m.body||'');
  for(const st of STAFF){
    const n=String(st.name||''); if(!n) continue;
    const lb=body.toLowerCase(), ln=n.toLowerCase();
    // bold "*Iqa:*" is what goes out now; plain "Iqa:" is what earlier
    // replies carry, and both still have to be recognised
    const cut = lb.startsWith('*'+ln+':*') ? n.length+3
              : lb.startsWith(ln+':')      ? n.length+1 : 0;
    if(cut) return {name:st.name, via:'crm', clean:body.slice(cut).replace(/^\s*\n/,'')};
  }
  const t=m.wa_ts?new Date(m.wa_ts).getTime():0;
  if(staffMode() && STAFF_FROM && t && t>=STAFF_FROM)
    return {name:'sent from phone', via:'phone', clean:body};
  return null;
}

/* Who is on reception right now. One WhatsApp number is shared, so the only
   way the customer can tell Iqa from Alex is if the name is on the message -
   the same trick ChatsHero uses. Kept per PC, not per customer. */
function agentName(){
  try{ return String(localStorage.getItem('gl_crm_agent')||'').trim().slice(0,24); }
  catch(e){ return ''; }
}
function setAgentName(v){
  try{ localStorage.setItem('gl_crm_agent', String(v||'').trim().slice(0,24)); }catch(e){}
}
function replyName(){ return (staffMode() && ME) ? ME.name : agentName(); }
function withAgent(body){
  const who=replyName();
  if(!who) return body;
  const b=body.toLowerCase(), n=who.toLowerCase();
  // don't stack a second name on a reply that already carries one, in either
  // the bold or the plain form
  if(b.startsWith('*'+n+':*') || b.startsWith(n+':')) return body;
  // asterisks are WhatsApp's own bold, so the customer sees the name stand out
  return '*'+who+':*\n'+body;
}


/* ---------------------------------------------------------------------------
   MIA suggestions, above the chat.
   This calls the same MIA function the advisors already use (gl-mia.html), so
   nothing new has to be deployed. It sends the last few messages of THIS chat,
   gets back drafts in English / Bahasa / Chinese, and puts them on buttons.
   Pressing a button only copies the draft into the reply box. A person reads
   it, changes it if needed, and presses Send. MIA never sends anything.
   It asks by itself only when the customer wrote last; otherwise there is a
   button, so nobody pays for a suggestion nobody wanted.
   --------------------------------------------------------------------------- */
const MIA_FN=SUPABASE_URL+'/functions/v1/mia';
const MIA_CACHE={};          // jid -> {key, out}
let MIA_STATE=null;          // what is on screen for the open chat
let MIA_SEQ=0;               // ignore an answer that arrives for a chat we left
let MIA_FILLED='';           // the last draft we put in the box
const MIA_LANGS=[['en','EN'],['bm','BM'],['zh','中文']];
const MIA_OPTS=[['short','Short'],['explain','Explain'],['push','Recommend']];

function miaReset(){
  MIA_SEQ++; MIA_STATE=null; MIA_FILLED='';
  const el=$('tMia'); if(el){ el.classList.add('hide'); el.innerHTML=''; }
}
function miaGuessLang(txt){
  const t=String(txt||'');
  if(/[一-鿿]/.test(t)) return 'zh';
  if(/\b(boleh|nak|nk|berapa|brp|harga|saya|tak|tidak|ada|macam|kereta|tolong|lah|bila|esok|sila|terima kasih|tq|cuci|kaca|nanti|dah|ye|ya)\b/i.test(t)) return 'bm';
  return 'en';
}
function miaTranscript(rows){
  const last=rows.slice(-12);
  return last.map(m=>{
    const who=senderOf(m);
    let txt=who&&who.via==='crm'&&who.clean ? who.clean : String(m.body||'').trim();
    if(!txt){
      const t=String(m.msg_type||'').toLowerCase();
      txt = ['voice','audio'].includes(t) ? '[voice note - not transcribed]'
          : t==='image' ? '[photo]' : t==='video' ? '[video]' : t==='document' ? '[document]' : '';
    }
    if(!txt) return '';
    return (m.direction==='out' ? 'Grandlab: ' : 'Customer: ')+txt;
  }).filter(Boolean).join('\n');
}
function miaOffer(jid,rows){
  const el=$('tMia'); if(!el) return;
  const last=rows[rows.length-1];
  if(!last){ el.classList.add('hide'); return; }
  const key=jid+'|'+last.wa_ts;
  const t=String(last.msg_type||'').toLowerCase();
  const textless = last.direction==='in' && !String(last.body||'').trim();
  MIA_STATE={jid,rows,key,lang:miaGuessLang(
      rows.filter(m=>m.direction==='in'&&m.body).slice(-3).map(m=>m.body).join(' ')),out:null,busy:false,err:'',extra:null};
  el.classList.remove('hide');
  if(MIA_CACHE[jid]&&MIA_CACHE[jid].key===key){ MIA_STATE.out=MIA_CACHE[jid].out; miaDraw(); return; }
  if(textless){
    el.innerHTML='<div class="mh"><b>MIA</b></div><div class="say">Their last message is '
      +(['voice','audio'].includes(t)?'a voice note':t==='image'?'a photo':'something with no text')
      +', and MIA cannot hear or see it yet. Listen on the phone first, then ask MIA below.</div>'
      +'<div class="mh" style="margin-top:6px"><button class="lg" onclick="miaAsk()">Suggest a reply anyway</button></div>';
    return;
  }
  if(last.direction==='in'){ miaAsk(); return; }       // they wrote last: they are waiting on us
  el.innerHTML='<div class="mh"><b>MIA</b><span>You wrote last.</span><span class="sp"></span>'
    +'<button class="lg" onclick="miaAsk()">Suggest a follow-up</button></div>';
}
async function miaAsk(answer){
  const st=MIA_STATE; if(!st||st.busy) return;
  const seq=++MIA_SEQ; st.busy=true; st.err='';
  const msgs=[{role:'user',content:[{type:'text',text:
    'This is the WhatsApp chat so far, oldest first. Write what Grandlab should send next.\n\n'+miaTranscript(st.rows)}]}];
  if(answer && st.extra){
    msgs.push({role:'assistant',content:[{type:'text',text:st.extra}]});
    msgs.push({role:'user',content:[{type:'text',text:answer}]});
  }
  miaDraw();
  try{
    const {data}=await sb.auth.getSession();
    const token=(data&&data.session&&data.session.access_token)||SUPABASE_ANON;
    const r=await fetch(MIA_FN,{method:'POST',
      headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON,Authorization:'Bearer '+token},
      body:JSON.stringify({mode:'coach',messages:msgs,stage:'auto'})});
    let out; try{ out=await r.json(); }catch(e){ throw new Error('MIA sent back something unreadable.'); }
    if(!r.ok||out.error) throw new Error(out.error||('Request failed ('+r.status+')'));
    if(seq!==MIA_SEQ) return;                    // they moved to another chat meanwhile
    st.out=out; st.extra=out.text||null;
    if(out.reply&&out.reply.type==='reply') MIA_CACHE[st.jid]={key:st.key,out};
  }catch(e){
    if(seq!==MIA_SEQ) return;
    st.err=e.message||String(e);
  }
  st.busy=false; miaDraw();
}
function miaSetLang(l){ if(MIA_STATE){ MIA_STATE.lang=l; miaDraw(); } }
function miaDraw(){
  const el=$('tMia'), st=MIA_STATE; if(!el||!st) return;
  const head=(extra)=>'<div class="mh"><b>MIA suggests</b>'
    +MIA_LANGS.map(([k,l])=>'<button class="lg'+(st.lang===k?' on':'')+'" onclick="miaSetLang(\''+k+'\')">'+l+'</button>').join('')
    +'<span class="sp"></span>'+(extra||'')+'</div>';
  if(st.busy){ el.innerHTML='<div class="mh"><b>MIA</b><span>Reading the chat and working out a reply…</span></div>'; return; }
  if(st.err){
    el.innerHTML='<div class="mh"><b>MIA</b><span class="err">Could not get a suggestion: '+esc(st.err)+'</span>'
      +'<span class="sp"></span><button class="lg" onclick="miaAsk()">Try again</button></div>';
    return;
  }
  const out=st.out, r=out&&out.reply;
  if(r&&r.type==='clarify'){
    el.innerHTML=head('')
      +'<div class="say"><b>MIA needs to know:</b> '+esc(r.question||'')+'</div>'
      +(r.options||[]).map((o,i)=>'<button class="miaopt" onclick="miaAnswer('+i+')"><span class="tx">'+esc(o)+'</span></button>').join('');
    return;
  }
  if(r&&r.type==='reply'){
    const set=r[st.lang]||{};
    const items=MIA_OPTS.filter(([k])=>set[k]);
    el.innerHTML=head('<button class="lg" onclick="MIA_CACHE[MIA_STATE.jid]=null;miaAsk()" title="Ask MIA again">&#8635;</button>')
      +(typeof r.handover==='string'&&r.handover.trim()
          ? '<div class="warn"><b>Check with Jimmy before sending:</b> '+esc(r.handover.trim())+'</div>' : '')
      +(r.note?'<div class="why">'+esc(r.note)+'</div>':'')
      +(items.length ? items.map(([k,l])=>'<button class="miaopt" onclick="miaUse(\''+st.lang+'\',\''+k+'\')">'
          +'<span class="k">'+l+'</span><span class="tx">'+esc(set[k])+'</span></button>').join('')
        : '<div class="say">No '+esc(st.lang.toUpperCase())+' version this time — try another language above.</div>')
      +'<div class="why">Press one to copy it into the reply box. Nothing is sent until you press Send.</div>';
    return;
  }
  const raw=(out&&out.text)||'';
  el.innerHTML=head('')+(raw?'<div class="say" style="white-space:pre-wrap">'+esc(raw)+'</div>'
    :'<div class="say">MIA had nothing to suggest.</div>');
}
function miaAnswer(i){
  const r=MIA_STATE&&MIA_STATE.out&&MIA_STATE.out.reply;
  if(r&&r.options&&r.options[i]!=null) miaAsk(String(r.options[i]));
}
function miaUse(lang,key){
  const st=MIA_STATE; const r=st&&st.out&&st.out.reply;
  const txt=r&&r[lang]&&r[lang][key]; if(!txt) return;
  const box=$('tBox');
  const cur=String(box.value||'');
  box.value = (!cur.trim()||cur===MIA_FILLED) ? txt : cur.replace(/\s+$/,'')+'\n\n'+txt;
  MIA_FILLED=box.value;
  $('tReplyNote').className='replyNote';
  $('tReplyNote').textContent='MIA draft is in the box. Read it, change anything, then press Send.';
  box.focus();
}

async function sendReply(){
  if(!CUR) return;
  const box=$('tBox'), btn=$('tSend'), note=$('tReplyNote');
  const typed=String(box.value||'').trim();
  const body=withAgent(typed);
  note.className='replyNote';
  if(!typed){ note.textContent='Nothing to send.'; return; }
  if(staffMode() && !ME){
    note.className='replyNote err';
    note.textContent='Pick who you are first, above the reply box.';
    return;
  }
  btn.disabled=true; box.disabled=true; note.textContent='Queueing…';

  // show it straight away so reception can see it went somewhere
  const pend=document.createElement('div');
  pend.className='msg pending';
  pend.textContent=body;
  const t=$('tThread'); t.appendChild(pend); t.scrollTop=t.scrollHeight;

  try{
    const {error}=await sb.from('gl_wa_outbox')
      .insert({chat_jid:CUR.chat_jid, phone:CUR.phone||null, body,
               staff_name: replyName()||null});
    if(error) throw error;
    box.value='';
    pend.textContent=body+'  ·  queued';
    note.textContent='Queued. The bridge on the shop PC sends it within a minute — it will appear in the thread once WhatsApp confirms.';
  }catch(e){
    pend.remove();
    note.className='replyNote err';
    note.textContent='Could not queue: '+(e.message||e);
  }finally{
    btn.disabled=false; box.disabled=false; box.focus();
  }
}

async function loadThread(jid){
  try{
    const {data}=await sb.from('gl_wa_msg')
      .select('direction,sent_by,msg_type,body,wa_ts')
      .eq('chat_jid',jid).order('wa_ts',{ascending:true}).limit(500);
    const rows=data||[];
    $('tThread').innerHTML = rows.length ? rows.map(m=>{
      const who=senderOf(m);
      // the header is shown as a label instead of inside the bubble, so the
      // thread does not read "Iqa: Iqa: ..."
      const body=who&&who.via==='crm'&&who.clean ? who.clean : msgText(m);
      return '<div class="msg '+(m.direction==='out'?'out':'in')+'">'
        +(who?'<span class="by '+(who.via==='phone'?'byph':'')+'">'+esc(who.name)+'</span>':'')
        +esc(body)
        +'<span class="t">'+esc(dmy(m.wa_ts))+'</span></div>';
    }).join('') : '<div class="msg sys">No messages recorded for this chat.</div>';
    const t=$('tThread'); t.scrollTop=t.scrollHeight;
    if(CUR && CUR.chat_jid===jid) miaOffer(jid,rows);
  }catch(e){
    $('tThread').innerHTML='<div class="msg sys">Could not load messages: '+esc(e.message||e)+'</div>';
  }
}

/* The whole point of the board: the chat next to what Grandlab already knows
   about them. Matched on the last 8 digits because phone formats in
   gl_profiles and gl_walkin are inconsistent. */
async function loadRecord(phone){
  const key=String(phone||'').replace(/[^0-9]/g,'').slice(-8);
  if(key.length<7){ $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span>No phone on this chat — cannot match.</span></div>'; return; }
  try{
    const [{data:prof},{data:walk}]=await Promise.all([
      sb.from('gl_profiles')
        .select('name,phone,email,tier,tier_expires_at,wallet,wallet_member,points')
        .ilike('phone','%'+key).limit(1),
      sb.from('gl_walkin').select('name,plate,model,last_service,visit_count')
        .ilike('phone','%'+key).limit(12)
    ]);
    const p=(prof||[])[0], cars=walk||[];
    const row=(k,v)=>'<div class="row"><span class="k">'+esc(k)+'</span><span>'+v+'</span></div>';
    let h='';
    if(p){
      const isMember=p.tier_expires_at&&new Date(p.tier_expires_at)>new Date();
      h+=row('Customer','<b>'+esc(p.name||'(no name)')+'</b>'
          +(isMember?' <span class="chip mem">'+esc(p.tier||'Member')+'</span>':''));
      if(p.email) h+=row('Email',esc(p.email));
      if(Number(p.wallet)>0) h+=row('Credit', esc(RM(p.wallet))
          + (Number(p.wallet_member)>0?' <span style="color:var(--text2)">('+esc(RM(p.wallet_member))+' member credit)</span>':''));
      if(Number(p.points)>0) h+=row('G Coin', esc(p.points));
    }
    if(cars.length){
      h+=row('Cars', cars.map(c=>'<b>'+esc(c.plate||'—')+'</b>'+(c.model?' '+esc(c.model):'')).join('<br>'));
      const seen=cars.map(c=>c.last_service).filter(Boolean).sort().pop();
      if(seen) h+=row('Last service', esc(dmy(seen)));
      const visits=cars.reduce((s,c)=>s+(Number(c.visit_count)||0),0);
      if(visits) h+=row('Visits', esc(visits));
    }
    if(!h) h=row('Customer','Not in Grandlab records yet — new enquiry.');
    if(CUR&&CUR.remark) h+=row('Note', esc(CUR.remark));
    h+='<div class="row" style="margin-top:5px"><span class="k"></span><span>'
      +'<a class="btn btn2 btn-xs" target="_blank" rel="noopener" href="gl-customers.html">Open in GL Customers</a></span></div>';
    $('tRec').innerHTML=h;
  }catch(e){
    $('tRec').innerHTML='<div class="row"><span class="k">Customer</span><span class="err">Lookup failed: '+esc(e.message||e)+'</span></div>';
  }
}

/* ---- alerts -------------------------------------------------------------
   Reception keeps this open all day, so the board should speak up instead of
   waiting to be looked at. Only new arrivals in "Needs reply" raise a popup,
   and never on the first load, or opening the app would fire fifteen at once. */
let ALERTS = false, KNOWN_REPLY = null;

function setAlertBtn(){
  $('alertBtn').innerHTML = ALERTS ? '&#128276; Alerts on' : '&#128276; Alerts off';
  $('alertBtn').style.background = ALERTS ? 'var(--gold)' : '';
}
async function toggleAlerts(){
  if(ALERTS){ ALERTS=false; try{localStorage.setItem('gl_crm_alerts','0');}catch(e){} setAlertBtn(); return; }
  if(!('Notification' in window)){ alert('This browser cannot show alerts.'); return; }
  let p=Notification.permission;
  if(p!=='granted') { try{ p=await Notification.requestPermission(); }catch(e){} }
  if(p!=='granted'){ alert('Alerts are blocked for this site. Allow notifications in the browser settings, then try again.'); return; }
  ALERTS=true; try{localStorage.setItem('gl_crm_alerts','1');}catch(e){} setAlertBtn();
  new Notification('Grandlab CRM', {body:'Alerts are on. You will be told when a customer is waiting.', icon:'icon-192.png'});
}
function alertNewReplies(replyList){
  const ids=new Set(replyList.map(c=>c.chat_jid));
  if(KNOWN_REPLY===null){ KNOWN_REPLY=ids; return; }          // first load: just remember
  const fresh=replyList.filter(c=>!KNOWN_REPLY.has(c.chat_jid));
  KNOWN_REPLY=ids;
  if(!ALERTS || !fresh.length || Notification.permission!=='granted') return;
  const one=fresh[0];
  const who=(one.name&&String(one.name).trim())?one.name:(one.phone||'A customer');
  const body=fresh.length===1
    ? who+' is waiting for a reply'
    : fresh.length+' customers are waiting for a reply';
  try{
    const n=new Notification('Grandlab CRM', {body, icon:'icon-192.png', tag:'gl-crm-reply', renotify:true});
    n.onclick=()=>{ window.focus(); if(fresh.length===1) openThread(one.chat_jid); n.close(); };
  }catch(e){}
}

/* ---- Dashboard ----

   Colours do a job here, they are not decoration:
   - the pipeline uses status colours (critical / warning / muted / good) and
     every row is labelled, so the dot is never the only thing saying which
     is which
   - the monthly chart has two series, so it uses a validated categorical
     pair: #2563EB in, #D97706 out. That pair clears CVD separation at
     ΔE 32 (protan) and 38 at normal vision - blue+violet, the obvious pick,
     came out at ΔE 0.4 for deuteranopes and was thrown away. */
const C_IN='#2563EB', C_OUT='#D97706';
const STAGE_COLOR={reply:'#DC2626', waiting:'#D97706', quiet:'#94A3B8', closed:'#64748B', paid:'#15803D'};

const kpi=(v,k,s,cls,ico,icoBg)=>'<div class="kpi '+(cls||'')+'">'
  +(ico?'<div class="chip-ico" style="background:'+icoBg+'">'+ico+'</div>':'')
  +'<div class="v">'+esc(v)+'</div>'
  +'<div class="k">'+esc(k)+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>';

/* Grouped bars. Thin marks, rounded data-ends anchored to the baseline, a 2px
   gap between the pair, recessive axis, legend plus hover rather than a number
   printed on every bar. */
function monthlyChart(rows){
  if(!rows.length) return '';
  const W=760,H=190, padL=38,padR=10,padT=10,padB=26;
  const n=rows.length, iw=(W-padL-padR)/n;
  const max=Math.max(1,...rows.map(r=>Math.max(r.msgs_in,r.msgs_out)));
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  const bw=Math.max(5,Math.min(16,(iw-10)/2));
  const ticks=[0,Math.round(max/2),max];

  let g='';
  ticks.forEach(t=>{ g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(t)+'" y2="'+y(t)
    +'" stroke="#E8ECF1" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y(t)+3.5)
    +'" text-anchor="end" font-size="10" fill="#94A3B8">'+t+'</text>'; });

  rows.forEach((r,i)=>{
    const cx=padL+iw*i+iw/2, base=y(0);
    [[r.msgs_in,C_IN,-1,'in'],[r.msgs_out,C_OUT,1,'out']].forEach(([v,col,side,lab])=>{
      const h=Math.max(v>0?2:0, base-y(v));
      if(!h) return;
      const x=cx+(side<0?-bw-1:1);
      g+='<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+col+'"'
        +' data-tip="'+esc(r.mon+' · '+v+' '+lab)+'"/>';
    });
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#94A3B8">'
      +esc(String(r.mon).slice(5)+'/'+String(r.mon).slice(2,4))+'</text>';
  });
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#CBD5E1" stroke-width="1"/>';

  return '<div class="legend"><span><i style="background:'+C_IN+'"></i>From customers</span>'
    +'<span><i style="background:'+C_OUT+'"></i>From us</span></div>'
    +'<div class="chartwrap" style="padding-top:0"><svg viewBox="0 0 '+W+' '+H
    +'" style="width:100%;height:auto;display:block" role="img"'
    +' aria-label="Messages per month, from customers and from us">'
    +g+'</svg></div>';
}

/* ---- Ads ----
   Straight from the hourly Meta sync, so this is what Meta itself reports -
   not an estimate. The one number that is ours is "traced": conversations we
   can tie back to the advert that started them. */
/* Money earned from the chats we can actually tie to this advert.
   Only the tagged ones — see the note under the table. */
function adMoney(adId){
  let rm=0, won=0, chats=0;
  if(!adId) return {rm:0,won:0,chats:0};
  for(const c of CHATS){
    const li=LEADINFO[c.chat_jid];
    if(!li || String(li.ad_id||'')!==String(adId)) continue;
    chats++;
    const w=wonAt(c);
    if(w){ won++; rm+=Number((OVER[c.chat_jid]||{}).revenue)||0; }
  }
  return {rm,won,chats};
}

/* The verdict. Rules, not a hunch, and the card says which rule fired.
   Built only on figures that hold up: spend, results, cost per result and its
   movement across the two halves of the window, and CTR. Reach is shown but
   never judged on — see the note at the bottom of the view. */
function verdict(a, avgCpr){
  const sp=Number(a.spend||0), cv=Number(a.conversations||0);
  const days=Number(a.days_running||0);
  const cpr=cv?sp/cv:null;
  const nowC=Number(a.conv_now||0), prevC=Number(a.conv_prev||0);
  const cNow=nowC?Number(a.spend_now||0)/nowC:null;
  const cPrev=prevC?Number(a.spend_prev||0)/prevC:null;
  const st=String(a.status||'').toUpperCase();

  if(!['ACTIVE','LEARNING'].includes(st))
    return {k:'early',t:'Paused',why:'Not running. Figures below are what it did while it was on.'};
  if(sp<=0)
    return {k:'early',t:'No spend',why:'Live but it has not spent anything in this window. Either the ad set is off or it is losing every auction — worth a look in Ads Manager.'};
  if(sp>=150 && cv===0)
    return {k:'stop',t:'Stop',why:'<b>'+RM(sp)+' spent and not one conversation.</b> Nothing here is working — turn it off or rewrite it.'};
  if(days<4)
    return {k:'early',t:'Too early',why:'Only '+days+' day'+(days===1?'':'s')+' of spend. Leave it alone until it has about a week.'};
  if(cNow!=null && cPrev!=null && cNow > cPrev*1.3)
    return {k:'watch',t:'Slowing',why:'<b>Cost per enquiry has risen from '+RM(cPrev)+' to '+RM(cNow)+'</b> between the first and second half of this window. Same money is buying fewer enquiries — refresh the creative or the offer.'};
  if(cNow!=null && cPrev!=null && cNow < cPrev*0.8)
    return {k:'keep',t:'Improving',why:'<b>Cost per enquiry has fallen from '+RM(cPrev)+' to '+RM(cNow)+'.</b> It is getting cheaper, not dearer. Leave it running; this is the one to put more behind.'};
  if(cpr!=null && avgCpr && cpr <= avgCpr*0.85)
    return {k:'keep',t:'Keep',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)+' average.</b> Cheaper than the rest of your account. Steady — leave it.'};
  if(cpr!=null && avgCpr && cpr >= avgCpr*1.5)
    return {k:'watch',t:'Review',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)+' average</b> — half as efficient as the rest. Worth rewriting before it eats more budget.'};
  const rel = (cpr!=null && avgCpr) ? cpr/avgCpr : null;
  if(rel!=null && rel>1.15)
    return {k:'watch',t:'Dearer than most',why:'<b>'+RM(cpr)+' an enquiry against your '+RM(avgCpr)
      +' average</b> — about '+Math.round((rel-1)*100)+'% more. Not bad enough to stop, but this is the first one to rewrite if you want cheaper enquiries.'};
  return {k:'keep',t:'Steady',why:'Holding at '+(cpr!=null?RM(cpr):'—')+' an enquiry, in line with your '+(avgCpr?RM(avgCpr):'—')+' average. Nothing to change.'};
}

async function setAdDays(d){
  ADDAYS=d;

  try{ const {data}=await sb.rpc('gl_crm_ads',{p_days:d}); ADS=data||[]; }catch(e){}
