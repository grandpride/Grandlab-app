function renderAds(){
  const num=v=>Number(v||0);
  const live=ADS.filter(a=>['ACTIVE','LEARNING'].includes(String(a.status||'').toUpperCase()));
  const spend=ADS.reduce((s,a)=>s+num(a.spend),0);
  const conv=ADS.reduce((s,a)=>s+num(a.conversations),0);
  const traced=ADS.reduce((s,a)=>s+num(a.traced_leads),0);
  const imps=ADS.reduce((s,a)=>s+num(a.impressions),0);
  const clicks=ADS.reduce((s,a)=>s+num(a.clicks),0);
  const avgCpr=conv?spend/conv:0;
  const tab=d=>'<span class="fchip'+(ADDAYS===d?' on':'')+'" onclick="setAdDays('+d+')">'+d+' days</span>';

  const sorted=ADS.slice().sort((a,b)=>num(b.spend)-num(a.spend));
  let dodgyReach=0;

  const cards=sorted.map(a=>{
    const sp=num(a.spend), cv=num(a.conversations), im=num(a.impressions),
          rc=num(a.reach), ck=num(a.clicks), days=num(a.days_running);
    const cpr=cv?sp/cv:null;
    const ctr=im?ck/im*100:null;
    const cpm=im?sp/im*1000:null;
    const nowC=num(a.conv_now), prevC=num(a.conv_prev);
    const cNow=nowC?num(a.spend_now)/nowC:null;
    const cPrev=prevC?num(a.spend_prev)/prevC:null;
    const v=verdict(a,avgCpr);
    const st=String(a.status||'').toUpperCase();
    const dot=st==='ACTIVE'?'#15803D':(st==='LEARNING'?'#2563EB':'#94A3B8');
    const money=adMoney(a.ad_id);
    const freq=rc?im/rc:null;
    const reachOdd = freq!=null && freq>5;
    if(reachOdd) dodgyReach++;

    let trend='<span style="color:var(--ink2)">—</span>';
    if(cNow!=null&&cPrev!=null){
      const up=cNow>cPrev;
      const pc=Math.round(Math.abs(cNow-cPrev)/cPrev*100);
      trend='<span class="'+(up?'up':'dn')+'">'+(up?'&#9650;':'&#9660;')+' '+pc+'%</span>';
    } else if(cNow!=null) trend='<span style="font-size:12px;color:var(--ink2)">new</span>';

    const cell=(l,val,sub)=>'<div class="mcell"><div class="ml">'+l+'</div>'
      +'<div class="mv">'+val+'</div>'+(sub?'<div class="ms">'+sub+'</div>':'')+'</div>';

    return '<div class="adcard">'
      +'<div class="ah">'
        +'<div class="an"><span class="dot" style="display:inline-block;background:'+dot+';margin-right:7px"></span>'
          +esc(a.ad_name||'(unnamed)')
          +(a.campaign?'<div class="ac">'+esc(a.campaign)+'</div>':'')+'</div>'
        +'<span class="verd v-'+v.k+'">'+esc(v.t)+'</span>'
      +'</div>'
      +'<div class="mgrid">'
        +cell('Spent',esc(RM(sp)),days?days+' day'+(days===1?'':'s')+' of spend':'')
        +cell('Results',String(cv),'conversations')
        +cell('Cost / result',cpr!=null?esc(RM(cpr)):'—',
              avgCpr?('avg '+RM(avgCpr)):'')
        +cell('Trend',trend, cPrev!=null?(RM(cPrev)+' &rarr; '+(cNow!=null?RM(cNow):'—')):'first period')
        +cell('Impressions',im.toLocaleString(), cpm!=null?(RM(cpm)+' per 1,000'):'')
        +cell('Clicks',ck.toLocaleString(), ctr!=null?(ctr.toFixed(2)+'% CTR'):'')
        +cell('Reach',rc?rc.toLocaleString():'—',
              reachOdd?'<span class="flagw">looks wrong</span>':(freq!=null?freq.toFixed(1)+'&times; each':''))
        +cell('Daily budget','<span style="font-size:12px;color:var(--ink2);font-weight:600">not synced</span>','')
        +cell('Traced chats',String(num(a.traced_leads)),
              money.won?(money.won+' won &middot; '+RM(money.rm)):'')
      +'</div>'
      +'<div class="why">'+v.why+'</div>'
      +'</div>';
  }).join('');

  $('vAds').innerHTML=
    '<div class="h1">Ads</div>'
   +'<div class="h1s">Straight from your Meta account, synced hourly. '
     +(ADS.length&&ADS[0].last_day?('Figures to '+esc(dmyShort(ADS[0].last_day))+'. '):'')
     +'The verdict on each advert is worked out here, and every card says which rule it used.</div>'
   +'<div class="fchips" style="padding:0 0 12px">'+tab(7)+tab(30)+tab(90)+'</div>'
   +'<div class="cards">'
     +kpi(RM(spend),'Spent','last '+ADDAYS+' days','','&#9650;','#FEF3C7')
     +kpi(conv,'Results','conversations Meta counted','','&#9993;','#EEF3FE')
     +kpi(avgCpr?RM(avgCpr):'—','Cost per result','your account average','','&#9878;','#DCFCE7')
     +kpi(imps?(clicks/imps*100).toFixed(2)+'%':'—','CTR',clicks.toLocaleString()+' clicks of '+imps.toLocaleString())
     +kpi(live.length,'Running now','of '+ADS.length+' with figures')
   +'</div>'
   +(ADS.length?cards
     :'<div class="panel2"><div style="padding:22px;text-align:center;color:var(--ink2)">No ad figures synced yet.</div></div>')
   +'<div class="soonbox" style="margin-top:4px">'
     +'<b>Two things on this page are not solid, so read them as such.</b><br>'
     +'&bull; <b>Daily budget is missing.</b> The hourly sync pulls each advert but not the ad set it sits in, '
       +'and the budget lives on the ad set. Every card says &ldquo;not synced&rdquo; rather than showing a guess. '
       +'One change to the sync function fixes it &mdash; it is a deploy, so it needs you.<br>'
     +'&bull; <b>Reach is unreliable.</b> '+(dodgyReach?dodgyReach+' of the adverts below report':'Some rows report')
       +' more than five views per person, a few far more, which cannot be right. '
       +'Reach is shown but no verdict is based on it, so none of the advice above leans on a bad number.<br>'
     +'&bull; <b>'+traced+' of '+conv+' conversations can be traced</b> back to the advert that started them. '
       +'That is the missing click-to-WhatsApp tag on incoming messages, not a problem with the spend figures. '
       +'Until it is closed, &ldquo;traced chats&rdquo; and the ringgit beside it are a floor, not the total.'
   +'</div>';
}

/* ---- Reports ---- */
function renderReports(){
  const over=Object.values(OVER);
  const withJobs=over.filter(o=>o.jobs>0);
  const rev=withJobs.reduce((s,o)=>s+(Number(o.revenue)||0),0);
  const avg=withJobs.length?rev/withJobs.length:0;

  // lead_source as recorded on the jobs themselves
  const bySrc={};
  withJobs.forEach(o=>{
    const keys=(o.lead_sources||'').split(',').map(s=>s.trim()).filter(Boolean);
    const list=keys.length?keys:['(not recorded)'];
    list.forEach(k=>{ bySrc[k]=bySrc[k]||{n:0,rm:0}; bySrc[k].n++; bySrc[k].rm+=Number(o.revenue)/list.length; });
  });
  const srcRows=Object.entries(bySrc).sort((a,b)=>b[1].rm-a[1].rm);
  const maxSrc=srcRows.length?srcRows[0][1].rm||1:1;

  // conversations started per month
  const byMon={};
  CHATS.forEach(c=>{ const d=c.first_in_at||c.last_in_at; if(!d) return;
    const k=String(d).slice(0,7); byMon[k]=(byMon[k]||0)+1; });
  const monRows=Object.entries(byMon).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8);
  const maxMon=monRows.reduce((m,r)=>Math.max(m,r[1]),1);

  $('vReports').innerHTML=
    '<div class="h1">Reports</div>'
   +'<div class="h1s">What your WhatsApp conversations are actually worth.</div>'
   +'<div class="cards">'
     +kpi(RM(rev),'Revenue behind chats','from '+withJobs.length+' paying customers','win')
     +kpi(RM(avg),'Average per customer')
     +kpi(Math.round(withJobs.length/Math.max(1,CHATS.length)*100)+'%','Chats that became customers')
   +'</div>'
   +'<div class="panel2"><div class="pt">Where that work was recorded as coming from</div>'
   +'<table class="t2"><thead><tr><th>Lead source</th><th>Customers</th><th>Revenue</th><th style="width:34%"></th></tr></thead><tbody>'
   +srcRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+esc(RM(v.rm))+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v.rm/maxSrc*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>'
   +'<div class="panel2"><div class="pt">New conversations per month</div>'
   +'<table class="t2"><thead><tr><th>Month</th><th>Conversations</th><th style="width:50%"></th></tr></thead><tbody>'
   +monRows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td>'
      +'<td><div class="bar2" style="width:'+Math.max(2,Math.round(v/maxMon*100))+'%"></div></td></tr>').join('')
   +'</tbody></table></div>';
}

/* ---- Settings ----
   Only the part that exists: who may reply, and under what name. The rest of
   this screen (quiet threshold, the 12-hour nudge, alert recipients, reply
   templates) is still the stored constants at the top of this file, and this
   page says so rather than showing dead controls. */
let SETEDIT=null;
function renderSettings(){
  const rows=STAFF.length ? STAFF.map(x=>
      '<tr>'
      +'<td><b>'+esc(x.name)+'</b></td>'
      +'<td>'+(x.active?'<span class="chip rm">Can reply</span>':'<span class="chip chk">Switched off</span>')+'</td>'
      +'<td>'+(x.last_seen_at?esc(dmyShort(x.last_seen_at)):'<span style="color:var(--ink2)">never</span>')+'</td>'
      +'<td style="text-align:right">'
        +'<button class="mvbtn" onclick="setEdit('+JSON.stringify(x.id).replace(/"/g,'&quot;')+')">Change</button> '
        +'<button class="mvbtn" onclick="setActive('+JSON.stringify(x.id).replace(/"/g,'&quot;')+','+(!x.active)+')">'
          +(x.active?'Switch off':'Switch on')+'</button>'
      +'</td></tr>').join('')
    : '<tr><td colspan="4" style="padding:18px;text-align:center;color:var(--ink2)">'
      +'Nobody added yet &mdash; the reply box still uses the plain name box on each PC.</td></tr>';

  const e=SETEDIT, isNew=(e==='new');
  const cur=(!isNew&&e)?STAFF.find(x=>x.id===e):null;
  const form=e ? '<div class="panel2"><div class="pt">'+(isNew?'Add someone':'Change '+esc(cur?cur.name:''))+'</div>'
      +'<div style="padding:12px 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">'
      +'<input id="sfName" placeholder="Name" maxlength="24" value="'+esc(cur?cur.name:'')+'">'
      +'<input id="sfPin" type="password" inputmode="numeric" maxlength="8" placeholder="'
        +(isNew?'4-8 digit PIN':'new PIN (blank = keep)')+'" style="width:150px">'
      +'<button class="mvbtn gw" onclick="setSave()">Save</button>'
      +'<button class="mvbtn" onclick="SETEDIT=null;renderSettings()">Cancel</button>'
      +'<span id="sfNote" style="flex:1 1 200px;font-size:11.5px;color:var(--ink2)"></span>'
      +'</div></div>' : '';

  $('vSet').innerHTML=
    '<div class="h1">Settings</div>'
   +'<div class="h1s">Who may reply from this board, and the name customers see on it.</div>'
   +form
   +'<div class="panel2"><div class="pt">Reception staff'
     +'<button class="mvbtn" style="float:right;margin-top:-3px" onclick="SETEDIT=\'new\';renderSettings()">Add someone</button>'
   +'</div>'
   +'<table class="t2"><thead><tr><th>Name</th><th>Replying</th><th>Last signed in</th><th></th></tr></thead>'
   +'<tbody>'+rows+'</tbody></table></div>'
   +'<div class="soonbox">'
     +'<b>What the PIN does, and what it does not.</b><br>'
     +'It records who typed a reply and puts that name on the front of the message, '
     +'so the customer knows who answered and you can see it afterwards. '
     +'It is <b>not</b> a lock: everyone here still shares the one Grandlab login, so anyone '
     +'who can open this board can still see every chat. Treat it as a name badge, not a key.<br><br>'
     +'A sign-in lasts the shift &mdash; 12 hours, or until the browser is closed.<br><br>'
     +'<b>Still fixed in the code, not here yet:</b> the 14-day quiet rule, the '+NUDGE_HOURS
     +'-hour nudge on Waiting, who gets desktop alerts, and reply templates.'
   +'</div>';
}
function setEdit(id){ SETEDIT=id; renderSettings(); }
async function setSave(){
  const note=$('sfNote'), nm=$('sfName').value.trim(), pin=$('sfPin').value.trim();
  const isNew=(SETEDIT==='new');
  note.style.color='var(--ink2)'; note.textContent='Saving…';
  try{
    const {error}=await sb.rpc('gl_crm_staff_save',
      {p_id:isNew?null:SETEDIT, p_name:nm, p_pin:pin, p_active:true});
    if(error) throw error;
    SETEDIT=null; await loadStaff(); renderSettings(); drawWho();
  }catch(e){
    note.style.color='var(--red)';
    note.textContent=(e.message||String(e)).replace(/^.*?:\s*/,'');
  }
}
async function setActive(id,on){
  const st=STAFF.find(x=>x.id===id); if(!st) return;
  try{
    const {error}=await sb.rpc('gl_crm_staff_save',{p_id:id,p_name:st.name,p_pin:'',p_active:on});
    if(error) throw error;
    await loadStaff(); renderSettings(); drawWho();
  }catch(e){ alertLine('Could not change that: '+(e.message||e)); }
}
function alertLine(t){ $('statusLine').innerHTML='<span class="err">'+esc(t)+'</span>'; }

/* ---- Tasks ---- */
function taskRow(t){
  const chat=t.chat_jid?CHATS.find(c=>c.chat_jid===t.chat_jid):null;
  const who=chat?((chat.name&&String(chat.name).trim())?chat.name:(chat.phone||'')):'';
  const overdue=!t.done && t.due_on && String(t.due_on)<today();
  const dueToday=!t.done && String(t.due_on)===today();
  const when=t.due_on
    ? (overdue?'<span class="soon">'+esc(dmyShort(t.due_on))+' · overdue</span>'
       : dueToday?'<span style="color:var(--amber);font-weight:800">Today</span>'
       : esc(dmyShort(t.due_on)))
    : '<span style="color:var(--text2)">no date</span>';
  return '<tr>'
    +'<td style="width:28px"><input type="checkbox" '+(t.done?'checked':'')
      +' onclick="toggleTask('+t.id+',this.checked)"></td>'
    +'<td'+(t.done?' style="text-decoration:line-through;color:var(--text2)"':'')+'><b>'+esc(t.title)+'</b>'
      +(t.notes?'<div class="sub" style="color:var(--text2);font-size:11px">'+esc(t.notes)+'</div>':'')+'</td>'
    +'<td>'+(chat?'<a href="#" onclick="openThread('+JSON.stringify(t.chat_jid).replace(/"/g,'&quot;')
        +');return false">'+esc(who)+'</a>':'<span style="color:var(--text2)">—</span>')+'</td>'
    +'<td>'+when+'</td>'
    +'<td style="width:30px"><a href="#" title="Delete" style="color:var(--text2);text-decoration:none"'
      +' onclick="delTask('+t.id+');return false">&times;</a></td>'
    +'</tr>';
}
const dmyShort=s=>{const d=new Date(s);return isNaN(d)?String(s):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};

function renderTasks(){
  const open=TASKS.filter(t=>!t.done), done=TASKS.filter(t=>t.done);
  const over=open.filter(t=>t.due_on&&String(t.due_on)<today()).length;
  const tod=open.filter(t=>String(t.due_on)===today()).length;
  $('vTasks').innerHTML=
    '<div class="h1">Tasks</div>'
   +'<div class="h1s">Follow-ups, so a lead that needs chasing next week is not just remembered.</div>'
   +'<div class="cards">'
     +kpi(open.length,'Open')
     +kpi(over,'Overdue','',over?'lost':'')
     +kpi(tod,'Due today')
   +'</div>'
   +'<div class="panel2"><div class="pt">Add a task</div>'
     +'<div style="display:flex;gap:8px;padding:10px 11px;flex-wrap:wrap">'
     +'<input id="ntTitle" placeholder="What needs doing?" style="flex:2 1 240px">'
     +'<input id="ntDue" type="date" style="flex:0 0 150px" value="'+today()+'">'
     +'<button class="btn" onclick="addTask()">Add</button></div>'
     +'<div id="ntNote" class="replyNote" style="background:transparent"></div></div>'
   +'<div class="panel2"><div class="pt">'+open.length+' open</div><table class="t2"><tbody>'
     +(open.length?open.slice().sort(taskSort).map(taskRow).join('')
       :'<tr><td style="padding:18px;text-align:center;color:var(--text2)">Nothing outstanding.</td></tr>')
     +'</tbody></table></div>'
   +(done.length?'<div class="panel2"><div class="pt">Done ('+done.length+')</div><table class="t2"><tbody>'
       +done.slice(0,30).map(taskRow).join('')+'</tbody></table></div>':'');
}
/* dated first, soonest at the top; undated last */
function taskSort(a,b){
  if(!a.due_on && !b.due_on) return b.id-a.id;
  if(!a.due_on) return 1;
  if(!b.due_on) return -1;
  return String(a.due_on)<String(b.due_on)?-1:1;
}

async function loadTasks(){
  try{
    const {data}=await sb.from('gl_crm_task')
      .select('id,chat_jid,title,due_on,done,done_at,notes')
      .order('done',{ascending:true}).order('due_on',{ascending:true,nullsFirst:false}).limit(400);
    TASKS=data||[];
  }catch(e){ TASKS=[]; }
}
async function addTask(){
  const t=$('ntTitle'), d=$('ntDue'), n=$('ntNote');
  const title=String(t.value||'').trim();
  n.className='replyNote'; n.style.background='transparent';
  if(!title){ n.textContent='Type what needs doing first.'; return; }
  n.textContent='Adding…';
  const {error}=await sb.from('gl_crm_task').insert({title, due_on:d.value||null});
  if(error){ n.className='replyNote err'; n.textContent='Could not add: '+error.message; return; }
  t.value=''; n.textContent='';
  await loadTasks(); renderTasks(); drawNav();
}
async function toggleTask(id,done){
  await sb.from('gl_crm_task').update({done, done_at: done?new Date().toISOString():null}).eq('id',id);
  await loadTasks(); renderTasks(); drawNav();
}
async function delTask(id){
  const t=TASKS.find(x=>x.id===id);
  if(!confirm('Delete this task?\n\n'+(t?t.title:''))) return;
  await sb.from('gl_crm_task').delete().eq('id',id);
  await loadTasks(); renderTasks(); drawNav();
}
/* Add a follow-up straight from a conversation, dated a few days out. */
async function followUp(days){
  if(!CUR) return;
  const who=(CUR.name&&String(CUR.name).trim())?CUR.name:(CUR.phone||'this chat');
  const due=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  const note=$('tReplyNote'); note.className='replyNote';
  const {error}=await sb.from('gl_crm_task')
    .insert({chat_jid:CUR.chat_jid, title:'Follow up with '+who, due_on:due});
  if(error){ note.className='replyNote err'; note.textContent='Could not add task: '+error.message; return; }
  note.textContent='Follow-up added for '+dmyShort(due)+'. It is in Tasks.';
  await loadTasks(); drawNav();
}

/* ---- staying up to date -------------------------------------------------
   GitHub Pages and an installed app both cache the HTML, so reception can sit
   on a version from days ago without knowing - which is exactly what happened
   on 23 Nov, where a fixed sidebar looked broken because the old page was
   still loaded. So the page checks for itself and offers a reload rather than
   relying on anyone remembering Ctrl+Shift+R. */
function hardReload(){
  const u=location.pathname+'?v='+Date.now()+(location.hash||'');
  location.replace(u);
}
async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+'?cb='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const txt=await r.text();
    const m=/const BUILD='([^']+)'/.exec(txt);
    if(m && m[1] && m[1]!==BUILD) $('updNote').classList.remove('hide');
  }catch(e){ /* offline or blocked - never let this break the page */ }
}

/* One tooltip element, delegated — every mark with data-tip gets a hover
   readout without a listener per bar. */
(function(){
  const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{
    const t=e.target && e.target.getAttribute && e.target.getAttribute('data-tip');
    if(!t){ tip.classList.remove('on'); return; }
    tip.textContent=t; tip.classList.add('on');
  });
  document.addEventListener('mousemove',e=>{
    if(!tip.classList.contains('on')) return;
    tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8, e.clientX+12)+'px';
    tip.style.top=Math.max(4, e.clientY-tip.offsetHeight-10)+'px';
  });
})();

async function boot(){
  try{ ALERTS = localStorage.getItem('gl_crm_alerts')==='1' && Notification.permission==='granted'; }catch(e){}
  setTimeout(checkForUpdate, 20000);
  setInterval(checkForUpdate, 15*60000);
  setAlertBtn();
  setInterval(()=>{ if(!document.hidden && $('ov').classList.contains('hide')) load(); }, 60000);
  const want=(location.hash||'').replace('#','');
  if(NAV.some(n=>n.id===want)) VIEW=want;
  drawNav(); go(VIEW);
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); load(); }
  else $('gate').classList.remove('hide');
}
async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  if(!email||!pass){ $('loginErr').textContent='Enter email and password.'; return; }
  $('loginErr').textContent='Signing in…';
  let res;
  try{ res=await sb.auth.signInWithPassword({email,password:pass}); }
  catch(e){ $('loginErr').textContent='Network error: '+(e.message||e); return; }
  if(res.error){ $('loginErr').textContent='Login failed: '+res.error.message; return; }
  $('loginErr').textContent=''; $('gate').classList.add('hide');
  $('main').classList.remove('hide'); load();
}
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

$('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeThread(); });
boot();
</script>
