<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrandLab Detailing — Receipt</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --gold:#F5C518; --gold-deep:#C99700; --ink:#080808; --ink2:#4a4a4a; --line:#e7e7e7; --bg:#f5f5f5; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; padding:16px; }
  .card{ max-width:440px; margin:20px auto; background:#fff; border-radius:16px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .head{ background:var(--ink); color:#fff; padding:26px 24px 22px; text-align:center; }
  .brand{ font-weight:800; font-size:22px; letter-spacing:.02em; }
  .brand span{ color:var(--gold); }
  .sub{ font-size:12px; color:#bdbdbd; margin-top:3px; letter-spacing:.14em; text-transform:uppercase; }
  .body{ padding:22px 24px; }
  .rows{ width:100%; font-size:14px; }
  .rows .r{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); }
  .rows .r .l{ color:var(--ink2); }
  .rows .r .v{ font-weight:600; text-align:right; }
  .items{ margin:18px 0 6px; }
  .items h3{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink2); margin-bottom:8px; }
  .item{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .item .p{ font-weight:600; white-space:nowrap; padding-left:12px; }
  .total{ display:flex; justify-content:space-between; align-items:center; margin-top:16px;
    padding:14px 16px; background:var(--gold); border-radius:12px; }
  .total .l{ font-weight:700; }
  .total .v{ font-weight:800; font-size:20px; }
  .meta{ margin-top:14px; font-size:12px; color:var(--ink2); text-align:center; }
  .foot{ text-align:center; padding:18px 24px 26px; font-size:12px; color:var(--ink2); }
  .foot .thanks{ font-weight:700; color:var(--ink); margin-bottom:4px; }
  .btn{ display:block; width:100%; margin-top:14px; padding:12px; border:0; border-radius:11px;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .status{ text-align:center; padding:60px 20px; color:var(--ink2); }
  .paid-badge{ display:inline-block; margin-top:8px; padding:3px 12px; border-radius:20px;
    background:rgba(255,255,255,.14); color:var(--gold); font-size:11px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; }
  @media print{ body{ background:#fff; padding:0; } .card{ box-shadow:none; margin:0; max-width:100%; } .btn{ display:none; } }
</style>
</head>
<body>
  <div id="root"><div class="status">Loading receipt…</div></div>

<script>
const SUPABASE_URL="https://eychljpzorzmaveixlnu.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Y2hsanB6b3J6bWF2ZWl4bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDk2NjQsImV4cCI6MjA5NzIyNTY2NH0.6dA1zhz5ZIwf8byFB8vhfOzPI-uPPdPihEr1b8GG_oA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:false}});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=n=>'RM'+(Number(n)||0).toFixed(2);
const titleCase=s=>String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
function methodLabel(m){
  const map={cash:'Cash',credit_card:'Credit Card',debit_card:'Debit Card',cc_installment:'CC Installment',
    tng:'Touch \u2019n Go',mae:'MAE',grabpay:'GrabPay',shopeepay:'ShopeePay',atome:'Atome',
    app_credit:'App Credit',app_points:'App Points',voucher:'Voucher / Package','boss.co':'Complimentary'};
  return map[String(m||'').toLowerCase()]||titleCase(m||'');
}

function qparam(k){ return new URLSearchParams(location.search).get(k); }

async function load(){
  const id=qparam('id');
  const root=document.getElementById('root');
  if(!id){ root.innerHTML='<div class="status">No receipt ID provided.</div>'; return; }
  try{
    // fetch ONE receipt via a security-definer RPC (safe for anon key —
    // returns only the receipt matching this exact invoice, nothing else).
    let pay=null, items=[];
    const {data:rpc,error:rpcErr}=await sb.rpc('gl_receipt_by_invoice',{p_invoice:id});
    if(!rpcErr && rpc && rpc.length){
      pay=rpc[0];
      if(Array.isArray(pay.services)) items=pay.services;
    }
    if(!pay){ root.innerHTML='<div class="status">Receipt not found.</div>'; return; }
    if(pay.voided){ root.innerHTML='<div class="status">This receipt has been voided.</div>'; return; }
    render(pay, items);
  }catch(e){
    root.innerHTML='<div class="status">Could not load the receipt. Please try again later.</div>';
  }
}

function render(p, items){
  const when=new Date(p.sale_date? (p.sale_date+'T00:00:00') : p.paid_at);
  const dateStr=when.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const timeStr=new Date(p.paid_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const lineHtml = items.length
    ? items.map(s=>`<div class="item"><span>${esc(s.desc||'Service')}</span><span class="p">${RM(s.price||0)}</span></div>`).join('')
    : `<div class="item"><span>Service</span><span class="p">${RM(p.net_paid)}</span></div>`;
  document.getElementById('root').innerHTML=`
    <div class="card">
      <div class="head">
        <div class="brand">grand<span>lab</span></div>
        <div class="sub">Detailing by GrandPride</div>
        <div class="paid-badge">Paid</div>
      </div>
      <div class="body">
        <div class="rows">
          <div class="r"><span class="l">Receipt No.</span><span class="v">${esc(p.invoice_no||'—')}</span></div>
          <div class="r"><span class="l">Date</span><span class="v">${dateStr} · ${timeStr}</span></div>
          <div class="r"><span class="l">Customer</span><span class="v">${esc(titleCase(p.customer_name||'—'))}</span></div>
          <div class="r"><span class="l">Vehicle</span><span class="v">${esc(p.plate||'—')}</span></div>
        </div>
        <div class="items">
          <h3>Items</h3>
          ${lineHtml}
        </div>
        <div class="total"><span class="l">Total Paid</span><span class="v">${RM(p.net_paid)}</span></div>
        <div class="meta">Paid via ${esc(methodLabel(p.method))}</div>
        <button class="btn" onclick="window.print()">Save / Print receipt</button>
      </div>
      <div class="foot">
        <div class="thanks">Thank you for choosing GrandLab! 🚗✨</div>
        <div>PJS 13, Petaling Jaya · GrandPride Luxury Travel Sdn Bhd</div>
      </div>
    </div>`;
}

load();
</script>
</body>
</html>
