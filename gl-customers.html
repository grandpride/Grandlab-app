<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandlab Customers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--card2:#F6F7F8;--gold:#F5C518;--gold-ink:#8A6D00;
      --text:#111111;--text2:#5F6368;--border:#E3E5E8;--red:#C0392B;--green:#157347;
      --amber:#9A6700;--sel:#FFF8E1;--head:#EEF0F2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
.hide{display:none !important}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
     background:var(--card2);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.bar .ttl{font-weight:900;font-size:15px;white-space:nowrap}
.bar .ttl span{color:var(--gold-ink)}
.back{color:var(--text2);text-decoration:none;font-size:12.5px;white-space:nowrap}
.grow{flex:1;min-width:120px}
.count{color:var(--text2);font-size:12px;white-space:nowrap}
input,select{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);
     color:var(--text);font-family:inherit;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold-ink)}
.btn{background:var(--gold);color:#000;border:none;border-radius:7px;padding:7px 13px;font-size:12.5px;
     font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-block}
.btn2{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-wa{background:#25D366;color:#fff}
.btn-xs{padding:4px 9px;font-size:11.5px;border-radius:6px}

/* ---- grid: fixed widths + horizontal scroll ---- */
.gridwrap{overflow-x:auto;overflow-y:visible}
table.grid{border-collapse:collapse;table-layout:fixed;min-width:1080px;width:100%;font-size:12.5px}
table.grid th,table.grid td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid thead th{background:var(--head);text-align:left;font-weight:800;font-size:11px;
     text-transform:uppercase;letter-spacing:.03em;color:var(--text2);padding:6px 8px;
     border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;cursor:pointer;user-select:none}
table.grid thead th:hover{color:var(--text)}
table.grid thead th .ar{color:var(--gold-ink);font-size:9px}
table.grid thead tr.filt th{background:var(--card2);padding:3px 4px;z-index:9}
table.grid thead tr.filt input{padding:3px 5px;font-size:11.5px;border-radius:5px}
table.grid tbody td{padding:5px 8px;border-bottom:1px solid var(--border)}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:nth-child(even){background:#FAFBFC}
table.grid tbody tr:hover{background:var(--sel)}
.nm{font-weight:700}
.sub{color:var(--text2);font-size:11px}
.pl{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--gold);
    border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:700;color:#000;margin-right:3px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pkg{color:var(--gold-ink);font-weight:800}
.due-over{color:var(--red);font-weight:800}
.due-soon{color:var(--amber);font-weight:800}
.due-ok{color:var(--text2)}
.empty{color:var(--text2);text-align:center;padding:30px 12px}
.status{color:var(--text2);font-size:12px;padding:7px 12px}
.err{color:var(--red)}.ok{color:var(--green)}

/* ---- detail ---- */
.pane{padding:12px;max-width:1040px}
.box{border:1px solid var(--border);border-radius:9px;margin-bottom:12px;overflow:hidden}
.box .bt{background:var(--card2);padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;
         letter-spacing:.05em;color:var(--gold-ink);border-bottom:1px solid var(--border)}
.fields{display:grid;grid-template-columns:140px 1fr 140px 1fr}
.fields .lb{padding:7px 10px;color:var(--text2);font-size:12.5px;border-bottom:1px solid var(--border);
            background:#FCFCFD;display:flex;align-items:center}
.fields .vl{padding:4px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;min-height:32px}
.note{background:#FFF8E1;border-bottom:1px solid #E8D48A;padding:7px 10px;font-size:12px;color:#6b5600}
.hint{color:var(--text2);font-size:11.5px;padding:7px 10px}

/* vehicle card */
.veh{border-bottom:1px solid var(--border);padding:11px 10px}
.veh:last-child{border-bottom:none}
.vtop{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.qrbtn{width:52px;height:52px;flex:0 0 52px;border:1px solid var(--border);border-radius:7px;
       background:var(--card);cursor:pointer;padding:3px;display:flex;align-items:center;justify-content:center}
.qrbtn:hover{border-color:var(--gold-ink)}
.qrbtn svg{width:100%;height:100%;display:block}
.vname{font-weight:800;font-size:14px}
.vacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.htab{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.htab td{padding:4px 6px;border-top:1px solid var(--border)}
.htab td.d{color:var(--text2);width:92px;white-space:nowrap}
.htab td.a{text-align:right;width:85px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pkline{display:inline-block;background:#FFF8E1;border:1px solid #E8D48A;border-radius:6px;
        padding:2px 7px;font-size:11.5px;font-weight:700;color:var(--gold-ink);margin:3px 4px 0 0}

/* ---- login ---- */
.gate{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;
      justify-content:center;padding:18px}
.gate.hide{display:none !important}
.gate .inner{max-width:330px;width:100%;border:1px solid var(--border);border-radius:12px;padding:18px}
.gate h1{font-size:19px;font-weight:900;margin:0 0 3px}
.gate h1 span{color:var(--gold-ink)}
.gate label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text2);margin:10px 0 4px}

@media(max-width:880px){
  .fields{grid-template-columns:110px 1fr}
  table.grid{min-width:760px}
}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="inner">
  <h1>GRAND<span>LAB</span></h1>
  <div class="sub">Customers — staff sign in</div>
  <label>Email</label><input id="email" type="email" autocomplete="username">
  <label>Password</label><input id="pass" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%;margin-top:12px;padding:11px" onclick="doLogin()">SIGN IN</button>
  <div id="loginErr" class="status err"></div>
</div></div>

<div id="browse">
  <div class="bar">
    <a class="back" href="gl-hub.html">&#8592; Hub</a>
    <div class="ttl">GRAND<span>LAB</span> CUSTOMERS</div>
    <div class="grow"><input id="q" placeholder="Search name, phone, plate, email or SQL code…" autocomplete="off"></div>
    <button class="btn btn2" onclick="runSearch()">Search</button>
    <button class="btn" onclick="openNew()">+ New</button>
    <div class="count" id="count"></div>
  </div>
  <div id="status" class="status"></div>
  <div class="gridwrap"><table class="grid">
    <thead><tr id="hrow"></tr><tr class="filt" id="frow"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div style="padding:10px 12px"><button class="btn btn2 hide" id="more" onclick="loadMore()">Load more</button></div>
</div>

<div id="maintain" class="hide"></div>

<script>
const SUPABASE_URL="https://eychljpzorzmaveixlnu.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Y2hsanB6b3J6bWF2ZWl4bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDk2NjQsImV4cCI6MjA5NzIyNTY2NH0.6dA1zhz5ZIwf8byFB8vhfOzPI-uPPdPihEr1b8GG_oA";
/* What a scanned sticker opens. gl-warranty.html already accepts ?plate= and
   needs no login, so a customer can scan their own label. Change this one line
   to point the stickers somewhere else. */
const QR_TARGET="https://app.grandlab.com.my/gl-warranty.html?plate=";
const CS_NAME="Mia";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,
      {auth:{persistSession:true,autoRefreshToken:true,storageKey:'gl_auth'}});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAGE=150;

const COLS=[
  {k:'name',  t:'Customer Name', w:'190px', get:r=>r.name||'(no name)'},
  {k:'code',  t:'Code',   w:'78px',  get:r=>r.sqlacc_code||''},
  {k:'phone', t:'Phone',  w:'125px', get:r=>r.phone||''},
  {k:'plates',t:'Vehicles',w:'280px',
   get:r=>(r.cars||[]).map(c=>(c.model?c.model+' - ':'')+c.plate).join(', ')},
  {k:'cars',  t:'Cars',   w:'52px',  num:1, get:r=>r.car_count},
  {k:'pkg',   t:'Pkg',    w:'52px',  num:1, get:r=>r.pkg_left},
  {k:'due',   t:'Coating Due', w:'105px', get:r=>r._due||''},
  {k:'rem1',  t:'1st Reminded',w:'105px', get:r=>r._rem1||''},
  {k:'last',  t:'Last Service',w:'105px', get:r=>r.last_service||''}
];
let ROWS=[], OFFSET=0, LASTQ='', SORT={k:'last',dir:-1}, FILT={}, CUR=null, EDIT=false, VEH=[];
/* Car brand/model lists, same source as the job card (gl_car_brands /
   gl_car_models) so a car added here gets the same type the job card infers. */
let BRANDS=[], MODELS={};
const CAR_TYPES=['Sedan','SUV','MPV','Supercar','Motorcycle'];
async function loadBrands(){
  if(BRANDS.length) return BRANDS;
  const {data}=await sb.from('gl_car_brands').select('id,name')
      .eq('active',true).order('sort_order',{ascending:true});
  BRANDS=data||[]; return BRANDS;
}
async function brandChange(pfx){
  const bid=$(pfx+'brand').value, ms=$(pfx+'modelsel'), mi=$(pfx+'model');
  if(!bid||bid==='__other'){ ms.style.display='none'; mi.style.display='block'; mi.value=''; return; }
  ms.style.display='block'; mi.style.display='none';
  ms.innerHTML='<option>Loading…</option>';
  let list=MODELS[bid];
  if(!list){
    const {data}=await sb.from('gl_car_models').select('name,type')
        .eq('brand_id',bid).eq('active',true).order('sort_order',{ascending:true});
    list=data||[]; MODELS[bid]=list;
  }
  const bname=(BRANDS.find(b=>String(b.id)===String(bid))||{}).name||'';
  ms.innerHTML='<option value="">— select model —</option>'+
    list.map(m=>'<option value="'+esc(m.name)+'" data-type="'+esc(m.type||'')+'">'+esc(m.name)+'</option>').join('')+
    '<option value="__other">Other / not listed</option>';
  ms.dataset.brand=bname;
}
function modelChange(pfx){
  const ms=$(pfx+'modelsel'), mi=$(pfx+'model'), v=ms.value;
  if(v==='__other'){ ms.style.display='none'; mi.style.display='block'; mi.value=''; mi.focus(); return; }
  if(!v){ mi.value=''; return; }
  mi.value=((ms.dataset.brand||'')+' '+v).trim();
  const t=(ms.options[ms.selectedIndex]||{}).getAttribute
        ? ms.options[ms.selectedIndex].getAttribute('data-type') : '';
  if(t){ const ct=$(pfx+'ctype'); if(ct) ct.value=t; }
}
function carPicker(pfx){
  return '<select id="'+pfx+'brand" onchange="brandChange(\''+pfx+'\')">'+
           '<option value="">— select brand —</option>'+
           BRANDS.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('')+
           '<option value="__other">Other / not listed</option></select>';
}
function modelPicker(pfx){
  return '<select id="'+pfx+'modelsel" style="display:none" onchange="modelChange(\''+pfx+'\')"></select>'+
         '<input id="'+pfx+'model" placeholder="e.g. HONDA CIVIC">';
}
function typePicker(pfx){
  return '<select id="'+pfx+'ctype"><option value="">—</option>'+
         CAR_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select>';
}

/* ---------- login ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ $('gate').classList.add('hide'); buildHead(); runSearch(); }
  else $('gate').classList.remove('hide');
}
async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  if(!email||!pass){ $('loginErr').textContent='Enter email and password.'; return; }
  $('loginErr').textContent='Signing in…';
  let res;
  try{ res=await sb.auth.signInWithPassword({email,password:pass}); }
  catch(e){ $('loginErr').textContent='Network error: '+(e.message||e); return; }
  if(res.error){ $('loginErr').textContent='Login failed: '+res.error.message; return; }
  $('loginErr').textContent=''; $('gate').classList.add('hide'); buildHead(); runSearch();
}
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') runSearch(); });

/* ---------- grid ---------- */
function buildHead(){
  $('hrow').innerHTML=COLS.map(c=>'<th style="width:'+c.w+'" onclick="sortBy(\''+c.k+'\')">'+
    esc(c.t)+'<span class="ar"> '+(SORT.k===c.k?(SORT.dir>0?'&#9650;':'&#9660;'):'')+'</span></th>').join('');
  $('frow').innerHTML=COLS.map(c=>'<th><input data-f="'+c.k+'" placeholder="filter" value="'+
    esc(FILT[c.k]||'')+'" oninput="onFilter(this)"></th>').join('');
  requestAnimationFrame(()=>{
    const h=$('hrow').getBoundingClientRect().height||28;
    document.querySelectorAll('table.grid thead tr.filt th').forEach(th=>th.style.top=h+'px');
  });
}
function onFilter(el){ FILT[el.dataset.f]=el.value.trim().toUpperCase(); paint(); }
function sortBy(k){ SORT=(SORT.k===k)?{k:k,dir:-SORT.dir}:{k:k,dir:1}; buildHead(); paint(); }
function runSearch(){ OFFSET=0; ROWS=[]; LASTQ=$('q').value.trim(); loadMore(); }

async function loadMore(){
  $('status').textContent='Loading…';
  const {data,error}=await sb.rpc('gl_customer_list',{p_q:LASTQ,p_limit:PAGE,p_offset:OFFSET});
  if(error){ $('status').innerHTML='<span class="err">Error: '+esc(error.message)+'</span>'; return; }
  const got=data||[];
  // coating due + 1st-reminded for everything on screen, in ONE extra call
  const plates=[]; got.forEach(r=>(r.cars||[]).forEach(c=>{ if(c.plate) plates.push(c.plate); }));
  if(plates.length){
    const {data:due}=await sb.rpc('gl_due_by_plate',{p_plates:[...new Set(plates)]});
    const byPlate={}; (due||[]).forEach(d=>byPlate[d.plate]=d);
    got.forEach(r=>{
      let best=null, rem=null;
      (r.cars||[]).forEach(c=>{
        const d=byPlate[c.plate]; if(!d||!d.next_due) return;
        if(!best||d.next_due<best) best=d.next_due;
        if(d.remind_1 && (!rem||d.remind_1>rem)) rem=d.remind_1;
      });
      r._due=best||''; r._rem1=rem?String(rem).slice(0,10):'';
    });
  }
  ROWS=ROWS.concat(got); OFFSET+=got.length;
  $('more').classList.toggle('hide', got.length<PAGE);
  $('status').textContent=''; paint();
}
function dueClass(d){
  if(!d) return 'due-ok';
  const t=new Date(d+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0);
  const days=(t-n)/86400000;
  return days<0?'due-over':(days<=60?'due-soon':'due-ok');
}
function cmp(a,b){
  const c=COLS.find(x=>x.k===SORT.k)||COLS[0];
  let x=c.get(a), y=c.get(b);
  if(c.num){ return ((Number(x)||0)-(Number(y)||0))*SORT.dir; }
  x=String(x||'').toUpperCase(); y=String(y||'').toUpperCase();
  if(x===y) return 0;
  if(x==='') return 1; if(y==='') return -1;
  return (x<y?-1:1)*SORT.dir;
}
function paint(){
  let list=ROWS.slice();
  Object.keys(FILT).forEach(k=>{
    const v=FILT[k]; if(!v) return;
    const c=COLS.find(x=>x.k===k);
    list=list.filter(r=>String(c.get(r)||'').toUpperCase().includes(v));
  });
  list.sort(cmp);
  if(!list.length){
    $('rows').innerHTML='<tr><td colspan="'+COLS.length+'"><div class="empty">'+
      (LASTQ?('No customer matches &ldquo;'+esc(LASTQ)+'&rdquo;.'):'No customers loaded.')+
      '<br><br><button class="btn btn2" onclick="openNew()">+ Add as new customer</button></div></td></tr>';
  } else {
    $('rows').innerHTML=list.map(r=>{
      // model + plate, e.g. HONDA CIVIC - ABC1234
      const plates=(r.cars||[]).slice(0,3).map(c=>
            '<span class="pl">'+esc(c.plate)+'</span>'+
            (c.model?('<span class="sub">'+esc(c.model)+'</span> '):' ')).join('')
          + (r.car_count>3?('<span class="sub">+'+(r.car_count-3)+'</span>'):'');
      const multi=(r.all_names&&r.all_names.length>1)?' <span class="sub">('+r.all_names.length+')</span>':'';
      return '<tr onclick="openCust(\''+esc(r.cust_key)+'\')">'+
        '<td><span class="nm">'+esc(r.name||'(no name)')+'</span>'+multi+'</td>'+
        '<td>'+esc(r.sqlacc_code||'')+'</td>'+
        '<td>'+esc(r.phone||'')+'</td>'+
        '<td>'+(plates||'<span class="sub">no car</span>')+'</td>'+
        '<td class="num">'+r.car_count+'</td>'+
        '<td class="num">'+(r.pkg_left>0?('<span class="pkg">'+r.pkg_left+'</span>'):'')+'</td>'+
        '<td class="'+dueClass(r._due)+'">'+esc(r._due||'')+'</td>'+
        '<td class="sub">'+esc(r._rem1||'')+'</td>'+
        '<td>'+esc(r.last_service||'')+'</td></tr>';
    }).join('');
  }
  const anyF=Object.values(FILT).some(v=>v);
  $('count').textContent=list.length+(anyF?(' of '+ROWS.length):'')+' shown'+
      (ROWS[0]&&ROWS[0].total_count?(' · '+ROWS[0].total_count+' total'):'');
}

/* ---------- customer detail ---------- */
function show(v){ $('browse').classList.toggle('hide',v!=='browse');
                  $('maintain').classList.toggle('hide',v!=='maintain'); }
function backToList(){ show('browse'); }
async function openCust(k){
  CUR=ROWS.find(r=>r.cust_key===k); if(!CUR) return;
  EDIT=false; VEH=[];
  const plates=(CUR.cars||[]).map(c=>c.plate).filter(Boolean);
  drawCust(true);
  if(plates.length){
    const {data}=await sb.rpc('gl_customer_detail',{p_plates:plates,p_phone:CUR.phone||''});
    VEH=data||[];
  }
  drawCust(false);
}
function fRow(lb,html){ return '<div class="lb">'+lb+'</div><div class="vl">'+html+'</div>'; }
function inp(id,v,ph){ return '<input id="'+id+'" value="'+esc(v||'')+'" placeholder="'+esc(ph||'')+'">'; }
const money=v=>(v==null||v==='')?'':('RM'+Number(v).toFixed(2));

/* Draw on an integer module grid and merge each row's dark run into ONE rect.
   One rect per module produced ~52KB of path per code; with a dozen vehicles
   on screen that is megabytes of DOM. Merging runs cuts it by ~93%. */
function qrSvg(text,size){
  const q=qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount();
  let p='';
  for(let r=0;r<n;r++){
    let c=0;
    while(c<n){
      if(q.isDark(r,c)){ let w=1; while(c+w<n && q.isDark(r,c+w)) w++;
        p+='M'+c+' '+r+'h'+w+'v1h-'+w+'z'; c+=w; }
      else c++;
    }
  }
  return '<svg viewBox="0 0 '+n+' '+n+'" width="'+size+'" height="'+size+'" '+
         'shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'+
         '<rect width="'+n+'" height="'+n+'" fill="#fff"/><path d="'+p+'" fill="#000"/></svg>';
}
function vehTitle(v){
  const m=(v.model||'').trim();
  return (m? m+' - ' : '')+v.plate;
}
function drawCust(loading){
  const r=CUR, ed=EDIT;
  const names=(r.all_names&&r.all_names.length>1)
    ? '<div class="note">Recorded under '+r.all_names.length+' spellings: '+
      r.all_names.map(esc).join(' &middot; ')+'</div>' : '';
  let vehHtml;
  if(loading) vehHtml='<div class="hint">Loading vehicles…</div>';
  else if(!VEH.length) vehHtml='<div class="hint">No vehicle on file.</div>';
  else vehHtml=VEH.map((v,i)=>{
    const dcl=dueClass(v.next_due);
    const hist=(v.history||[]).slice(0,8).map(h=>
      '<tr><td class="d">'+esc(h.date||'')+'</td><td>'+esc(h.service||'')+'</td>'+
      '<td class="a">'+esc(money(h.amount))+'</td></tr>').join('');
    const more=(v.history||[]).length>8?('<div class="hint">+'+((v.history||[]).length-8)+' older</div>'):'';
    const pk=(v.packages||[]).map(p=>
          '<span class="pkline" style="cursor:pointer" title="Edit this package" '+
          'onclick="event.stopPropagation();editPkg('+i+','+p.id+')">'+esc(p.name)+' · '+p.left+' left'+
          (p.shared?' <b title="works on all this customer\u2019s cars">\u2605</b>':'')+'</span>').join('')
          || '<span class="sub">No active package</span>';
    return '<div class="veh">'+
      '<div class="vtop">'+
        '<button class="qrbtn" title="Print QR label" onclick="printLabel('+i+')">'+qrSvg(QR_TARGET+v.plate,64)+'</button>'+
        '<div style="flex:1;min-width:190px">'+
          '<div class="vname">'+esc(vehTitle(v))+'</div>'+
          '<div class="sub">'+esc(v.car_type||'')+
            (v.next_due?(' · <span class="'+dcl+'">coating due '+esc(v.next_due)+'</span>'):' · no coating due')+
            (v.remind_1?(' · 1st reminded '+String(v.remind_1).slice(0,10)):'')+
            (v.remind_2?(' · 2nd '+String(v.remind_2).slice(0,10)):'')+
          '</div>'+
          '<div>'+pk+'</div>'+
          '<div class="vacts">'+
            (v.next_due?('<button class="btn btn-wa btn-xs" onclick="remind('+i+')">Coating Reminder</button>'):'')+
            '<button class="btn btn2 btn-xs" onclick="printLabel('+i+')">QR Label</button>'+
            '<button class="btn btn2 btn-xs" onclick="addPkg('+i+')">+ Package</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      ((v.history||[]).length?('<table class="htab"><tbody>'+hist+'</tbody></table>'+more)
                             :'<div class="hint">No service history.</div>')+
    '</div>';
  }).join('');

  $('maintain').innerHTML=
   '<div class="bar">'+
     '<a class="back" href="#" onclick="backToList();return false;">&#8592; Browse</a>'+
     '<div class="ttl">MAINTAIN CUSTOMER</div><div class="grow"></div>'+
     (ed?('<button class="btn" onclick="saveCust()">Save</button>'+
          '<button class="btn btn2" onclick="EDIT=false;drawCust(false)">Cancel</button>')
        :('<button class="btn btn2" onclick="EDIT=true;drawCust(false)">Edit</button>'+
          '<button class="btn btn2" onclick="addCar()">+ Vehicle</button>'+
          '<a class="btn" href="gl-jobcard.html">New Job Card</a>'))+
   '</div>'+
   '<div class="pane">'+
     '<div class="box"><div class="bt">Customer</div>'+names+
       (ed?('<div class="note">Saving updates all <b>'+r.rows_merged+'</b> record'+
            (r.rows_merged===1?'':'s')+' for this customer.</div>'):'')+
       '<div class="fields">'+
         fRow('Customer name', ed?inp('e_name',r.name):('<b>'+esc(r.name||'—')+'</b>'))+
         fRow('SQL Acc code',  ed?inp('e_code',r.sqlacc_code,'e.g. C4553'):esc(r.sqlacc_code||'—'))+
         fRow('Phone',         ed?inp('e_phone',r.phone):esc(r.phone||'—'))+
         fRow('Email',         ed?inp('e_email',r.email,'name@email.com'):esc(r.email||'—'))+
         fRow('Total visits',  String(r.visits||0))+
         fRow('Last service',  esc(r.last_service||'—'))+
         fRow('Package uses left','<b class="pkg">'+(r.pkg_left||0)+'</b>')+
         fRow('Records merged', String(r.rows_merged))+
       '</div></div>'+
     '<div class="box"><div class="bt">Vehicles ('+r.car_count+') · service history, packages &amp; QR label</div>'+
       vehHtml+'</div>'+
     '<div id="msg" class="status"></div>'+
   '</div>';
  show('maintain');
}

/* ---------- coating reminder ---------- */
function timeGreeting(){
  const h=new Date().getHours();
  return h<12?'Good morning':(h<18?'Good afternoon':'Good evening');
}
async function remind(i){
  const v=VEH[i], r=CUR; if(!v||!r) return;
  const phone=String(r.phone||'').replace(/[^0-9]/g,'');
  if(!phone){ $('msg').innerHTML='<span class="err">No phone number on this customer.</span>'; return; }
  const carTag=vehTitle(v);
  const msg=timeGreeting()+' Mr/ Mrs. This is '+CS_NAME+' from Grandlab detailing ☺️\n'+
    'This is a friendly reminder from Grandlab 🚘✨\n'+
    'Your car '+carTag+' is due for its coating maintenance'+
      (v.next_due?(' on '+v.next_due):'')+'.\n'+
    'Regular maintenance keeps your coating looking new and protects your car’s shine. 🌟\n'+
    'Would you like us to book your slot this week?\n'+
    '✅ Reply YES to confirm\n'+
    '📅 Or let us know your preferred date/time\n'+
    'Thank you for trusting Grandlab with your car care!';
  const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  const url=(isMobile?'https://wa.me/'+phone+'?text=':'https://web.whatsapp.com/send?phone='+phone+'&text=')
            +encodeURIComponent(msg);
  window.open(url,'_blank');
  // record that it went out, so the grid shows 1st / 2nd reminded
  const {error}=await sb.rpc('gl_mark_reminded',{p_plate:v.plate});
  if(error){ $('msg').innerHTML='<span class="err">WhatsApp opened, but could not mark it reminded: '+
      esc(error.message)+'</span>'; return; }
  $('msg').innerHTML='<span class="ok">WhatsApp opened and marked as reminded.</span>';
  const {data}=await sb.rpc('gl_customer_detail',{p_plates:(CUR.cars||[]).map(c=>c.plate),p_phone:CUR.phone||''});
  VEH=data||[]; drawCust(false);
}

/* ---------- QR label ---------- */
function printLabel(i){
  const v=VEH[i]; if(!v) return;
  const w=window.open('','_blank','width=420,height=560');
  if(!w){ $('msg').innerHTML='<span class="err">Pop-up blocked — allow pop-ups to print labels.</span>'; return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(v.plate)+'</title>'+
   '<style>@page{size:60mm 40mm;margin:2mm}'+
   'body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;'+
   'justify-content:center;height:100vh}'+
   '.lab{width:56mm;border:1px solid #000;border-radius:2mm;padding:2mm;display:flex;gap:2mm;align-items:center}'+
   '.q{width:24mm;height:24mm;flex:0 0 24mm}.q svg{width:100%;height:100%;display:block}'+
   '.tx{flex:1;min-width:0}.b{font-weight:800;font-size:9pt;line-height:1.15}'+
   '.p{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:11pt;'+
   'background:#F5C518;border-radius:1mm;padding:0 1.5mm;display:inline-block;margin-top:1mm}'+
   '.s{font-size:6pt;color:#555;margin-top:1mm}'+
   '@media print{.no{display:none}}</style></head><body>'+
   '<div class="lab"><div class="q">'+qrSvg(QR_TARGET+v.plate,120)+'</div>'+
   '<div class="tx"><div class="b">'+esc((v.model||'').trim()||'GRANDLAB')+'</div>'+
   '<div class="p">'+esc(v.plate)+'</div>'+
   '<div class="s">Scan for service &amp; warranty</div></div></div>'+
   '<script>window.onload=function(){window.print()}<\/script></body></html>');
  w.document.close();
}

/* ---------- packages ----------
   Lets a package the customer already holds be entered and linked, including
   one that is part-used. "All cars" writes phone_key so a wash package follows
   the customer; "this car only" leaves it blank, which is right for coating. */
const PKG_NAMES=['Balance Bathe Essence Package','Cancoat Coating Maintenance',
  'Balance Cancoat Maintenance','Bathe Essence','10 Times Bathe Essence Package',
  'Infinite Coating Maintenance','Balance Mohs Maintenance','MOHS Coating Maintenance',
  '50% Off 10 Times Bathe Essence Package','Balance Infinite Maintenance',
  'Balance Matte Coating Maintenance'];

function pkgNamePicker(cur){
  const known=PKG_NAMES.includes(cur||'');
  return '<select id="p_namesel" onchange="pkgNameSel()" style="max-width:320px">'+
    PKG_NAMES.map(n=>'<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>').join('')+
    '<option value="__other"'+(cur&&!known?' selected':'')+'>Other / type it</option></select>'+
    '<input id="p_name" value="'+esc(cur||'')+'" placeholder="Package name" '+
      'style="display:'+((cur&&!known)?'block':'none')+';margin-top:5px">';
}
function pkgNameSel(){
  const sel=$('p_namesel'), inp=$('p_name');
  if(sel.value==='__other'){ inp.style.display='block'; inp.value=''; inp.focus(); }
  else { inp.style.display='none'; inp.value=sel.value; }
}
function pkgForm(title,v,i,pkg){
  const isEdit=!!pkg;
  $('maintain').innerHTML=
   '<div class="bar"><a class="back" href="#" onclick="drawCust(false);return false;">&#8592; Back</a>'+
     '<div class="ttl">'+esc(title)+'</div><div class="grow"></div>'+
     '<button class="btn" onclick="savePkg('+i+','+(isEdit?pkg.id:'null')+')">Save</button>'+
     (isEdit?('<button class="btn btn2" onclick="cancelPkg('+i+','+pkg.id+')">Cancel package</button>'):'')+
     '<button class="btn btn2" onclick="drawCust(false)">Close</button></div>'+
   '<div class="pane"><div class="box">'+
     '<div class="bt">'+esc(vehTitle(v))+'</div>'+
     '<div class="fields">'+
       fRow('Package *', pkgNamePicker(isEdit?pkg.name:''))+
       fRow('Total uses *', '<input id="p_total" type="number" min="1" value="'+(isEdit?pkg.total:10)+'" style="max-width:110px">')+
       fRow('Already used',  '<input id="p_used" type="number" min="0" value="'+(isEdit?pkg.used:0)+'" style="max-width:110px">')+
       fRow('Applies to',
         '<select id="p_shared" style="max-width:280px">'+
         '<option value="car"'+((isEdit&&!pkg.shared)?' selected':'')+'>This car only (coating)</option>'+
         '<option value="all"'+((isEdit&&pkg.shared)?' selected':'')+'>All of this customer\u2019s cars (wash)</option>'+
         '</select>')+
     '</div>'+
     '<div class="hint">Enter a part-used package by setting &ldquo;already used&rdquo; &mdash; the balance is the difference.</div>'+
     '</div><div id="msg" class="status"></div></div>';
  show('maintain');
}
function addPkg(i){ const v=VEH[i]; if(v) pkgForm('ADD PACKAGE',v,i,null); }
function editPkg(i,id){
  const v=VEH[i]; if(!v) return;
  const pkg=(v.packages||[]).find(p=>Number(p.id)===Number(id));
  if(pkg) pkgForm('EDIT PACKAGE',v,i,pkg);
}
async function savePkg(i,id){
  const v=VEH[i], r=CUR; if(!v||!r) return;
  const name=val('p_name')||($('p_namesel')?$('p_namesel').value:'');
  const total=parseInt(val('p_total'),10), used=parseInt(val('p_used')||'0',10);
  if(!name||name==='__other'){ msgEl('<span class="err">Choose or type the package name.</span>'); return; }
  if(!(total>0)){ msgEl('<span class="err">Total uses must be at least 1.</span>'); return; }
  if(used<0||used>total){ msgEl('<span class="err">Already-used must be between 0 and '+total+'.</span>'); return; }
  const shared=$('p_shared').value==='all';
  const pk=String(r.phone||'').replace(/[^0-9]/g,'').replace(/^(60|0)/,'');
  if(shared && pk.length<7){ msgEl('<span class="err">This customer has no phone, so it cannot apply to all cars.</span>'); return; }
  const body={service_name:name, total_uses:total, used_uses:used,
              vehicle_label:v.plate, phone_key: shared?pk:null, status:'active'};
  msgEl('Saving…');
  let error;
  if(id){ ({error}=await sb.from('gl_packages').update(body).eq('id',id)); }
  else   { ({error}=await sb.from('gl_packages').insert(Object.assign({source:'manual'},body))); }
  if(error){ msgEl('<span class="err">Could not save: '+esc(error.message)+
      '</span><div class="hint">Package edits need the reception login.</div>'); return; }
  msgEl('<span class="ok">Package saved.</span>');
  await refreshVeh();
}
async function cancelPkg(i,id){
  if(!confirm('Cancel this package? It stops counting as a balance but is not deleted.')) return;
  msgEl('Cancelling…');
  const {error}=await sb.from('gl_packages').update({status:'cancelled'}).eq('id',id);
  if(error){ msgEl('<span class="err">Failed: '+esc(error.message)+'</span>'); return; }
  await refreshVeh();
}
async function refreshVeh(){
  const plates=(CUR.cars||[]).map(c=>c.plate).filter(Boolean);
  const {data}=await sb.rpc('gl_customer_detail',{p_plates:plates,p_phone:CUR.phone||''});
  VEH=data||[]; drawCust(false);
}

/* ---------- new customer / vehicle ---------- */
async function openNew(){
  CUR=null;
  await loadBrands();
  $('maintain').innerHTML=
   '<div class="bar"><a class="back" href="#" onclick="backToList();return false;">&#8592; Browse</a>'+
     '<div class="ttl">NEW CUSTOMER</div><div class="grow"></div>'+
     '<button class="btn" onclick="saveNew()">Save</button>'+
     '<button class="btn btn2" onclick="backToList()">Cancel</button></div>'+
   '<div class="pane"><div class="box"><div class="bt">Customer</div>'+
     '<div class="hint">Create the customer first, then raise the job card.</div>'+
     '<div class="fields">'+
       fRow('Customer name *', inp('n_name','','e.g. TAI MING'))+
       fRow('SQL Acc code',    inp('n_code','','e.g. C4553'))+
       fRow('Phone',           inp('n_phone','','e.g. 60123456789'))+
       fRow('Email',           inp('n_email','','name@email.com'))+
     '</div></div>'+
     '<div class="box"><div class="bt">First vehicle (optional)</div><div class="fields">'+
       fRow('Car plate', inp('n_plate','','e.g. ABC1234'))+
       fRow('Brand',     carPicker('n_'))+
       fRow('Model',     modelPicker('n_'))+
       fRow('Car type',  typePicker('n_'))+
     '</div></div><div id="msg" class="status"></div></div>';
  show('maintain');
}
async function addCar(){
  const r=CUR; if(!r) return;
  await loadBrands();
  $('maintain').innerHTML=
   '<div class="bar"><a class="back" href="#" onclick="drawCust(false);return false;">&#8592; Back</a>'+
     '<div class="ttl">ADD VEHICLE</div><div class="grow"></div>'+
     '<button class="btn" onclick="saveCar()">Save</button>'+
     '<button class="btn btn2" onclick="drawCust(false)">Cancel</button></div>'+
   '<div class="pane"><div class="box"><div class="bt">New vehicle for '+esc(r.name||'this customer')+'</div>'+
     '<div class="fields">'+
       fRow('Car plate *', inp('c_plate','','e.g. ABC1234'))+
       fRow('Brand',       carPicker('c_'))+
       fRow('Model',       modelPicker('c_'))+
       fRow('Car type',    typePicker('c_'))+
     '</div>'+
     '<div class="hint">Pick the brand then the model and the car type fills itself, same as the job card.</div>'+
     '</div><div id="msg" class="status"></div></div>';
  show('maintain');
}

const val=id=>{const e=$(id);return e?e.value.trim():'';};
const normPhone=p=>String(p||'').replace(/[^0-9]/g,'').replace(/^(60|0)/,'');
const msgEl=h=>{ const m=$('msg'); if(m) m.innerHTML=h; };

async function saveNew(){
  const name=val('n_name'), phone=val('n_phone');
  if(!name){ msgEl('<span class="err">Enter the customer name.</span>'); return; }
  if(phone && normPhone(phone).length<7){ msgEl('<span class="err">That phone looks too short.</span>'); return; }
  if(phone){
    msgEl('Checking for an existing customer…');
    const {data:d}=await sb.rpc('gl_customer_list',{p_q:phone,p_limit:1,p_offset:0});
    if(d&&d.length){
      ROWS.push(d[0]);
      msgEl('<span class="err">That phone already belongs to <b>'+esc(d[0].name)+'</b>.</span> '+
            '<button class="btn btn2 btn-xs" onclick="openCust(\''+esc(d[0].cust_key)+'\')">Open it</button>');
      return;
    }
  }
  msgEl('Saving…');
  const {error}=await sb.from('gl_walkin').insert({
    name:name, phone:phone||null, email:val('n_email')||null, sqlacc_code:val('n_code')||null,
    plate:val('n_plate').toUpperCase().replace(/\s+/g,'')||null,
    model:val('n_model')||null, car_type:val('n_ctype')||null});
  if(error){ msgEl('<span class="err">Could not save: '+esc(error.message)+'</span>'); return; }
  msgEl('<span class="ok">Customer saved.</span>');
  setTimeout(()=>{ $('q').value=phone||name; backToList(); runSearch(); },600);
}
async function saveCust(){
  const r=CUR; if(!r) return;
  const name=val('e_name');
  if(!name){ msgEl('<span class="err">Name cannot be blank.</span>'); return; }
  msgEl('Updating '+r.rows_merged+' record'+(r.rows_merged===1?'':'s')+'…');
  const {error}=await sb.from('gl_walkin').update({
    name:name, phone:val('e_phone')||null, email:val('e_email')||null,
    sqlacc_code:val('e_code')||null}).in('id', r.row_ids);
  if(error){ msgEl('<span class="err">Update failed: '+esc(error.message)+
      '</span><div class="hint">Editing needs the reception login.</div>'); return; }
  msgEl('<span class="ok">Saved.</span>');
  setTimeout(()=>{ $('q').value=val('e_phone')||name; backToList(); runSearch(); },600);
}
async function saveCar(){
  const r=CUR; if(!r) return;
  const plate=val('c_plate').toUpperCase().replace(/\s+/g,'');
  if(!plate){ msgEl('<span class="err">Enter the car plate.</span>'); return; }
  msgEl('Adding…');
  const {error}=await sb.from('gl_walkin').insert({
    name:r.name, phone:r.phone||null, email:r.email||null, sqlacc_code:r.sqlacc_code||null,
    plate:plate, model:val('c_model')||null, car_type:val('c_ctype')||null});
  if(error){ msgEl('<span class="err">Could not add: '+esc(error.message)+'</span>'); return; }
  msgEl('<span class="ok">Vehicle added.</span>');
  setTimeout(()=>{ $('q').value=r.phone||r.name; backToList(); runSearch(); },600);
}

boot();
</script>
