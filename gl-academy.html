<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandlab Academy</title>
<style>
:root{--bg:#080808;--card:#141414;--card2:#1c1c1c;--gold:#F5C518;--text:#fff;--text2:#9a9a9a;--border:#2a2a2a;--red:#ff5252;--green:#16A34A;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:900;margin:6px 0 2px}
h1 span{color:var(--gold)}
.sub{color:var(--text2);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.sec{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.1em;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px}
select,input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px;color:var(--text);font-size:15px;font-family:inherit}
.btn{display:block;width:100%;background:var(--gold);color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn2{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;text-align:center}
.tab.on{background:var(--gold);color:#000;border-color:var(--gold)}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card2)}
.mrow:active{border-color:var(--gold)}
.mrow .nm{flex:1}
.mrow .t{font-weight:800;font-size:15px}
.mrow .s{font-size:11px;color:var(--text2);margin-top:2px}
.pill{font-size:10px;font-weight:800;padding:4px 9px;border-radius:12px;white-space:nowrap}
.lesson li{margin:9px 0 9px 18px;font-size:14px;line-height:1.5}
.opt{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card2);font-size:14px}
.opt:active{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:rgba(245,197,24,.1)}
.opt.right{border-color:var(--green);background:rgba(22,163,74,.14)}
.opt.wrong{border-color:var(--red);background:rgba(255,82,82,.12)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.why{font-size:12px;color:var(--text2);background:var(--card2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:6px}
.prog{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog div{height:100%;background:var(--gold);transition:width .25s}
.big{font-size:44px;font-weight:900}
.hint{font-size:11px;color:var(--text2);margin-top:6px}
.empty{text-align:center;color:var(--text2);font-size:13px;padding:22px 6px}
.hide{display:none!important}
#login{max-width:400px;margin:80px auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 20px;border-radius:24px;font-weight:800;font-size:14px;display:none;z-index:99}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text2);font-size:10px;font-weight:800;padding:6px 4px;border-bottom:1px solid var(--border)}
td{padding:7px 4px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<div id="login" class="card hide">
  <div class="sec">GRANDLAB STAFF LOGIN</div>
  <div class="row"><div><label>Email</label><input id="lg_email" type="email"></div></div>
  <div class="row"><div><label>Password</label><input id="lg_pass" type="password"></div></div>
  <button class="btn" onclick="doLogin()">Sign In</button>
  <div class="hint" id="lg_err"></div>
</div>

<div class="wrap hide" id="app">
  <a href="gl-hub.html" style="color:var(--text2);font-size:12px;text-decoration:none">&#8592; Hub</a>
  <h1>GRAND<span>LAB</span> ACADEMY</h1>
  <div class="sub">Learn it &middot; pass it &middot; move up the ladder</div>

  <div class="tabs">
    <button class="tab on" data-t="learn"    onclick="setTab('learn')">MODULES</button>
    <button class="tab"    onclick="setTab('progress')" data-t="progress">PROGRESS</button>
  </div>

  <div id="v_learn"></div>
  <div id="v_progress" class="hide"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://eychljpzorzmaveixlnu.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Y2hsanB6b3J6bWF2ZWl4bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDk2NjQsImV4cCI6MjA5NzIyNTY2NH0.6dA1zhz5ZIwf8byFB8vhfOzPI-uPPdPihEr1b8GG_oA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gl_auth'}});

// GrandPride project - staff and app access are managed there in Staff Manager
const GP_URL='https://iefevjkeckysdluzazeq.supabase.co';
const GP_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZmV2amtlY2t5c2RsdXphemVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODI1MTMsImV4cCI6MjA5NjY1ODUxM30.xVqifxHta7rPtxf0hh1C4_rexhwWQhaiOxEzVr_oM5k';
const gp=supabase.createClient(GP_URL,GP_ANON,{auth:{persistSession:false,storageKey:'gp_read'}});

let TEAM=[], MODS=[], RESULTS=[], WHO='', CUR=null;
let LANG=sessionStorage.getItem('gl_acad_lang')||'en';
const LANGS=[['en','English'],['ms','Bahasa Melayu'],['my','\u1019\u103c\u1014\u103a\u1019\u102c']];

// pick the field for the current language, falling back to English
function L(o,base){
  if(!o)return '';
  if(LANG!=='en'){
    const v=o[base+'_'+LANG];
    if(v&&(!Array.isArray(v)||v.length))return v;
  }
  return o[base];
}
function setLang(v){
  LANG=v; sessionStorage.setItem('gl_acad_lang',v);
  if(WHO)sb.from('gl_team').update({lang:v}).eq('name',WHO);
  loadLearn();
}
function langBar(){
  return '<div class="chipbar" style="display:flex;gap:6px;margin-bottom:10px">'+
    LANGS.map(function(l){
      const on=(l[0]===LANG);
      return '<button onclick="setLang(\''+l[0]+'\')" style="flex:1;border:1px solid '+
        (on?'var(--gold)':'var(--border)')+';background:'+(on?'var(--gold)':'var(--card2)')+
        ';color:'+(on?'#000':'var(--text2)')+';border-radius:9px;padding:8px;font-size:12px;'+
        'font-weight:800;cursor:pointer;font-family:inherit">'+l[1]+'</button>';
    }).join('')+'</div>';
}

function el(id){return document.getElementById(id)}
function toast(m){const t=el('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function dmy(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) }

(async function(){
  const s=await sb.auth.getSession();
  if(s.data.session){el('app').classList.remove('hide');boot()}else{el('login').classList.remove('hide')}
})();
async function doLogin(){
  const r=await sb.auth.signInWithPassword({email:el('lg_email').value.trim(),password:el('lg_pass').value});
  if(r.error){el('lg_err').textContent=r.error.message;return}
  location.reload();
}
async function boot(){
  const t=await sb.from('gl_team').select('*').eq('active',true).order('side').order('name');
  TEAM=t.data||[];
  await syncFromGP();
  const m=await sb.from('gl_academy_modules').select('*').eq('active',true).order('sort_order');
  MODS=m.data||[];
  WHO=sessionStorage.getItem('gl_acad_who')||'';
  await refreshResults();
  loadLearn();
}

/* Staff and app access live in the GrandPride Staff Manager (gp_staff).
   Pull them in so access assigned there is honoured here. Read-only on the
   GrandPride side; only gl_team is written. */
async function syncFromGP(){
  try{
    const r=await gp.from('gp_staff').select('username,name,role,apps');
    if(r.error||!r.data)return;
    const byUser={};
    r.data.forEach(function(x){ byUser[String(x.username||'').toLowerCase()]=x });
    const now=new Date().toISOString();
    for(const t of TEAM){
      const u=t.gp_username?byUser[String(t.gp_username).toLowerCase()]:null;
      if(!u)continue;
      let apps=u.apps;
      if(typeof apps==='string'){ try{apps=JSON.parse(apps)}catch(e){apps=[]} }
      if(!Array.isArray(apps))apps=[];
      const changed = JSON.stringify(apps)!==JSON.stringify(t.apps||[]) || u.role!==t.gp_role;
      t.apps=apps; t.gp_role=u.role;
      if(changed){
        await sb.from('gl_team').update({apps:apps,gp_role:u.role,gp_synced_at:now}).eq('name',t.name);
      }
    }
  }catch(e){ /* GrandPride unreachable - fall back to whatever is stored */ }
}
function canAcademy(t){
  const a=Array.isArray(t.apps)?t.apps:[];
  return a.indexOf('academy')>=0;
}

async function refreshResults(){
  const r=await sb.from('gl_academy_results').select('*').order('taken_at',{ascending:false});
  RESULTS=r.data||[];
}
function setTab(t){
  ['learn','progress'].forEach(function(k){el('v_'+k).classList.toggle('hide',k!==t)});
  Array.from(document.querySelectorAll('.tab')).forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  if(t==='learn')loadLearn(); else loadProgress();
}

function bestFor(name,code){
  const mine=RESULTS.filter(function(r){return r.name===name&&r.module_code===code});
  if(!mine.length)return null;
  return mine.reduce(function(a,b){return (b.score>a.score)?b:a});
}

// ---------- MODULES ----------
function loadLearn(){
  if(!WHO){ signInScreen(); return; }
  const box=el('v_learn');
  const list=MODS.filter(function(m){return m.track==='all'});
  const done=list.filter(function(m){const b=bestFor(WHO,m.code);return b&&b.passed}).length;

  box.innerHTML='<div class="card">'+
    langBar()+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div><div style="font-weight:900;font-size:17px">'+esc(WHO)+'</div>'+
      '<div class="hint">'+done+' of '+list.length+' modules passed</div></div>'+
      '<button class="btn2" style="border:1px solid var(--border);border-radius:16px;padding:6px 14px;'+
        'font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;background:var(--card2);color:var(--text2)"'+
        ' onclick="signOutStaff()">SWITCH</button>'+
    '</div>'+
    '<div class="prog" style="margin-top:10px"><div style="width:'+(list.length?Math.round(done/list.length*100):0)+'%"></div></div>'+
  '</div>'+
  '<div class="card"><div class="sec">MODULES</div>'+
    list.map(function(m){
      const b=bestFor(WHO,m.code);
      const col=b?(b.passed?'var(--green)':'var(--amber)'):'var(--text2)';
      const lbl=b?(b.passed?('PASSED '+b.score+'%'):('BEST '+b.score+'%')):'NOT TAKEN';
      const appr=(b&&b.passed&&b.approved)?' <span class="pill" style="background:var(--gold);color:#000;margin-left:4px">SIGNED</span>':'';
      return '<div class="mrow" data-c="'+m.code+'">'+
        '<div class="nm"><div class="t">'+esc(L(m,'title'))+'</div>'+
        '<div class="s">'+esc(L(m,'summary')||'')+'</div></div>'+
        '<span class="pill" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'66">'+lbl+'</span>'+appr+'</div>';
    }).join('')+
  '</div>';

  Array.from(box.querySelectorAll('.mrow')).forEach(function(d){
    d.onclick=function(){openModule(d.dataset.c)};
  });
}

// staff sign in with their own PIN so nobody can sit someone else's test
function signInScreen(){
  el('v_learn').innerHTML='<div class="card">'+
    langBar()+
    '<div class="sec">SIGN IN</div>'+
    '<label>Your name</label>'+
    '<select id="s_name">'+
      '<option value="">- select -</option>'+
      TEAM.filter(canAcademy).map(function(x){return '<option>'+esc(x.name)+'</option>'}).join('')+
    '</select>'+
    '<label style="margin-top:10px">Your PIN</label>'+
    '<input id="s_pin" type="password" inputmode="numeric" maxlength="6" placeholder="4 digits">'+
    '<div class="hint" id="s_err" style="color:var(--red);height:16px"></div>'+
    '<button class="btn" style="margin-top:6px" onclick="staffLogin()">START</button>'+
    '<div class="hint" style="margin-top:10px">First time? Your PIN is <b>1234</b> &mdash; you will choose your own next.<br>'+
      'Access is set in the GrandPride Staff Manager.</div>'+
  '</div>';
  el('s_pin').addEventListener('keydown',function(e){ if(e.key==='Enter')staffLogin() });
}
function staffLogin(){
  const n=el('s_name').value, p=el('s_pin').value.trim();
  if(!n){el('s_err').textContent='Choose your name';return}
  const t=TEAM.filter(function(x){return x.name===n})[0];
  if(!t){el('s_err').textContent='Not found';return}
  if(!canAcademy(t)){el('s_err').textContent='No Academy access - ask the manager to enable it';return}
  if(!t.pin){el('s_err').textContent='No PIN set - ask the manager';return}
  if(p!==String(t.pin)){el('s_err').textContent='Wrong PIN';return}
  if(!t.pin_set){ setPinScreen(t); return; }      // still on the starting PIN
  WHO=n; sessionStorage.setItem('gl_acad_who',n);
  loadLearn();
}

// first time in: choose a PIN you will actually remember
function setPinScreen(t){
  el('v_learn').innerHTML='<div class="card">'+
    '<div class="sec">CHOOSE YOUR PIN</div>'+
    '<div class="hint" style="margin-bottom:12px">Hello '+esc(t.name)+'. Pick a 4 digit PIN you will remember. '+
      'You will use it every time you open the Academy.</div>'+
    '<label>New PIN</label>'+
    '<input id="p1" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits">'+
    '<label style="margin-top:10px">Type it again</label>'+
    '<input id="p2" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits">'+
    '<div class="hint" id="p_err" style="color:var(--red);height:16px"></div>'+
    '<button class="btn" style="margin-top:6px" onclick="savePin(\''+esc(t.name).replace(/'/g,"\\'")+'\')">SAVE AND START</button>'+
    '<div class="hint" style="margin-top:10px">Forgot it later? The manager can reset it back to 1234.</div>'+
  '</div>';
  el('p2').addEventListener('keydown',function(e){ if(e.key==='Enter')savePin(t.name) });
}
async function savePin(name){
  const a=el('p1').value.trim(), b=el('p2').value.trim();
  if(!/^\d{4}$/.test(a)){el('p_err').textContent='Use 4 digits';return}
  if(a!==b){el('p_err').textContent='The two PINs do not match';return}
  if(a==='1234'){el('p_err').textContent='Pick something other than 1234';return}
  const r=await sb.from('gl_team').update({pin:a,pin_set:true}).eq('name',name);
  if(r.error){el('p_err').textContent=r.error.message;return}
  const t=TEAM.filter(function(x){return x.name===name})[0];
  if(t){t.pin=a;t.pin_set=true}
  WHO=name; sessionStorage.setItem('gl_acad_who',name);
  toast('PIN saved');
  loadLearn();
}
function signOutStaff(){ WHO=''; sessionStorage.removeItem('gl_acad_who'); signInScreen(); }

// ---------- LESSON ----------
function openModule(code){
  const m=MODS.filter(function(x){return x.code===code})[0];
  if(!m)return;
  el('v_learn').innerHTML=
   '<button class="btn btn2" style="margin-bottom:12px" onclick="loadLearn()">&#8592; BACK</button>'+
   '<div class="card">'+langBar()+'<div class="sec">'+esc(L(m,'title'))+'</div>'+
     '<div class="hint" style="margin-bottom:10px">'+esc(L(m,'summary')||'')+'</div>'+
     '<ul class="lesson">'+(L(m,'content')||[]).map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>'+
   '</div>'+
   '<button class="btn" onclick="startQuiz(\''+code+'\')">START THE TEST</button>'+
   '<div class="hint" style="text-align:center;margin-top:8px">Pass mark '+m.pass_mark+'%. You can retake it as many times as you like.</div>'+
   '<div style="height:30px"></div>';
}

// ---------- QUIZ ----------
async function startQuiz(code){
  const q=await sb.from('gl_academy_questions').select('*')
    .eq('module_code',code).eq('active',true).order('sort_order');
  const qs=(q.data||[]);
  if(!qs.length){toast('No questions for this module yet');return}
  const m=MODS.filter(function(x){return x.code===code})[0];
  CUR={code:code,mod:m,qs:qs,i:0,answers:[],right:0};
  renderQ();
}
function renderQ(){
  const q=CUR.qs[CUR.i];
  const pct=Math.round(CUR.i/CUR.qs.length*100);
  el('v_learn').innerHTML=
   '<div class="prog"><div style="width:'+pct+'%"></div></div>'+
   '<div class="card">'+
     '<div class="hint">'+esc(L(CUR.mod,'title'))+' &middot; '+(CUR.i+1)+' / '+CUR.qs.length+'</div>'+
     '<div style="font-size:17px;font-weight:700;margin:10px 0 14px">'+esc(L(q,'question'))+'</div>'+
     '<div id="opts">'+(L(q,'options')||[]).map(function(o,i){
       return '<div class="opt" data-i="'+i+'"><div class="k">'+String.fromCharCode(65+i)+'</div><div>'+esc(o)+'</div></div>';
     }).join('')+'</div>'+
     '<div id="fb"></div>'+
   '</div>'+
   '<button class="btn" id="nextb" onclick="nextQ()" disabled>ANSWER</button>'+
   '<div style="height:30px"></div>';
  Array.from(el('opts').children).forEach(function(d,i){
    d.onclick=function(){ pickOpt(i) };
  });
}
function pickOpt(i){
  if(CUR.locked)return;
  Array.from(el('opts').children).forEach(function(d,k){d.classList.toggle('sel',k===i)});
  CUR.pick=i;
  el('nextb').disabled=false;
}
function nextQ(){
  const q=CUR.qs[CUR.i];
  if(!CUR.locked){
    if(CUR.pick==null)return;
    CUR.locked=true;
    const ok=(CUR.pick===q.answer);
    if(ok)CUR.right++;
    CUR.answers.push({q:q.id,picked:CUR.pick,correct:q.answer,ok:ok});
    Array.from(el('opts').children).forEach(function(d,k){
      d.classList.remove('sel');
      if(k===q.answer)d.classList.add('right');
      else if(k===CUR.pick)d.classList.add('wrong');
    });
    el('fb').innerHTML='<div class="why"><b>'+(ok?'\u2713':'\u2717')+'</b> '+esc(L(q,'why')||'')+'</div>';
    el('nextb').textContent=(CUR.i+1<CUR.qs.length)?'NEXT QUESTION':'SEE RESULT';
    return;
  }
  CUR.locked=false; CUR.pick=null; CUR.i++;
  if(CUR.i<CUR.qs.length)renderQ(); else finish();
}
async function finish(){
  const score=Math.round(CUR.right/CUR.qs.length*100);
  const pass=score>=(CUR.mod.pass_mark||80);
  const gu=await sb.auth.getUser();
  await sb.from('gl_academy_results').insert({
    name:WHO, module_code:CUR.code, score:score, passed:pass,
    answers:CUR.answers, taken_by:gu.data.user?gu.data.user.email:''
  });
  await refreshResults();
  el('v_learn').innerHTML=
   '<div class="card" style="text-align:center">'+
     '<div class="big" style="color:'+(pass?'var(--green)':'var(--amber)')+'">'+score+'%</div>'+
     '<div style="font-size:18px;font-weight:800;margin:6px 0">'+(pass?'PASSED':'NOT YET')+'</div>'+
     '<div class="hint">'+CUR.right+' / '+CUR.qs.length+' &middot; '+(CUR.mod.pass_mark||80)+'%</div>'+
     (pass?'<div class="hint" style="color:var(--green);margin-top:8px">'+esc(WHO)+' has passed '+esc(CUR.mod.title)+'</div>'
          :'<div class="hint" style="margin-top:8px">Read the module again and retake it. No limit on tries.</div>')+
   '</div>'+
   '<button class="btn" onclick="openModule(\''+CUR.code+'\')">READ IT AGAIN</button>'+
   '<button class="btn btn2" style="margin-top:8px" onclick="loadLearn()">BACK TO MODULES</button>'+
   '<div style="height:30px"></div>';
  CUR=null;
}


// manager resets a forgotten PIN back to 1234
async function resetPin(){
  const who=prompt('Reset whose PIN?\n\n'+TEAM.filter(canAcademy).map(function(t){return t.name}).join('\n'));
  if(!who)return;
  const t=TEAM.filter(function(x){return x.name.toLowerCase()===who.trim().toLowerCase()})[0];
  if(!t){toast('Name not found');return}
  const pin=prompt('Manager PIN to reset '+t.name+':');
  if(pin!=='065437'){ if(pin!==null)toast('Wrong PIN'); return }
  const r=await sb.from('gl_team').update({pin:'1234',pin_set:false}).eq('name',t.name);
  if(r.error){toast('Error: '+r.error.message);return}
  t.pin='1234'; t.pin_set=false;
  toast(t.name+' reset to 1234');
}

// ---------- PROGRESS ----------
function loadProgress(){
  const box=el('v_progress');
  const rows=TEAM.filter(canAcademy).map(function(t){
    const mine=MODS.filter(function(m){return m.track==='all'});
    const passed=mine.filter(function(m){const b=bestFor(t.name,m.code);return b&&b.passed});
    return {name:t.name,side:t.side,done:passed.length,total:mine.length,
            pct:mine.length?Math.round(passed.length/mine.length*100):0};
  }).sort(function(a,b){return b.pct-a.pct});

  box.innerHTML='<div class="card"><div class="sec">WHO HAS PASSED WHAT</div>'+
    '<table><thead><tr><th>Staff</th><th style="width:120px">Progress</th><th style="width:70px">Done</th></tr></thead><tbody>'+
    rows.map(function(r){
      const col=r.pct===100?'var(--green)':(r.pct>0?'var(--amber)':'var(--text2)');
      return '<tr><td>'+esc(r.name)+'<div class="hint">'+esc(r.side)+'</div></td>'+
        '<td><div class="prog" style="margin:0"><div style="width:'+r.pct+'%;background:'+col+'"></div></div></td>'+
        '<td style="font-weight:800;color:'+col+'">'+r.done+'/'+r.total+'</td></tr>';
    }).join('')+'</tbody></table>'+
    '<div class="hint" style="margin-top:10px">A module counts once it has been passed at the pass mark. Retakes are allowed and the best score is kept.</div>'+
    '<button class="btn btn2" style="margin-top:12px" onclick="resetPin()">RESET A FORGOTTEN PIN</button>'+
    '</div>'+
    '<div class="card"><div class="sec">RECENT ATTEMPTS</div>'+
    (RESULTS.length?('<table><tbody>'+RESULTS.slice(0,25).map(function(r){
      const m=MODS.filter(function(x){return x.code===r.module_code})[0];
      const col=r.passed?'var(--green)':'var(--amber)';
      return '<tr><td>'+esc(r.name)+'</td><td style="font-size:12px">'+esc(m?m.title:r.module_code)+'</td>'+
        '<td class="hint">'+dmy(r.taken_at)+'</td>'+
        '<td style="text-align:right;font-weight:800;color:'+col+'">'+r.score+'%</td></tr>';
    }).join('')+'</tbody></table>'):'<div class="empty">Nobody has taken a test yet</div>')+
    '</div>';
}
</script>
