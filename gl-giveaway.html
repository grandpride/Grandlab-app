<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GrandLab — Lucky Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root{ --gold:#F5C518; --bg:#0a0a0a; --card:#141414; --border:#2a2a2a; --text:#f5f5f5; --muted:#9a9a9a; --green:#1db954; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 40px}
  .hero{background:linear-gradient(160deg,#1a1608,#0a0a0a);padding:26px 20px 20px;text-align:center;border-bottom:1px solid var(--border)}
  .brand{font-size:19px;font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}
  .hero h1{font-size:25px;font-weight:900;margin:12px 0 6px;line-height:1.2}
  .hero h1 .y{color:var(--gold)}
  .hero p{color:var(--muted);font-size:13px}
  .wrap{max-width:460px;margin:0 auto;padding:20px}
  .field{margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:13px 14px;font-size:15px;font-family:inherit;outline:none}
  input:focus,select:focus{border-color:var(--gold)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:8px}
  .btn-gold{background:var(--gold);color:#111}
  .btn-wa{background:var(--green);color:#fff}
  .btn:active{transform:scale(.98)}
  .status{text-align:center;font-size:14px;padding:12px;border-radius:10px;margin-bottom:14px}
  .status.err{background:#3a1414;color:#ff8a8a;border:1px solid #5a2020}
  .status.ok{background:#0f2e18;color:#7ee29a;border:1px solid #1e5a30}
  .lookup{font-size:12px;color:var(--muted);margin-top:6px}
  .lookup.taken{color:#ff8a8a;font-weight:700}
  .tnc{font-size:11px;color:#666;margin-top:20px;line-height:1.6;border-top:1px solid var(--border);padding-top:14px}
  .tnc b{color:var(--muted)}
  .hidden{display:none}
  /* wheel */
  .wheel-wrap{position:relative;width:320px;height:320px;margin:10px auto 20px;max-width:100%}
  .wheel{width:320px;height:320px;box-sizing:border-box;border-radius:50%;border:6px solid var(--gold);transition:transform 5s cubic-bezier(.17,.67,.16,.99);position:relative;overflow:hidden}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--gold);z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#111;border:4px solid var(--gold);z-index:4;display:flex;align-items:center;justify-content:center;font-size:22px}
  .refbox{background:linear-gradient(135deg,#1a1608,#141414);border:1.5px solid var(--gold);border-radius:14px;padding:16px;text-align:center;margin:8px 0 12px}
  .refbox .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .refbox .code{font-size:24px;font-weight:900;color:var(--gold);letter-spacing:2px;margin:4px 0}
  .prize-won{text-align:center;font-size:22px;font-weight:900;color:var(--gold);margin:8px 0}
  .prize-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px}

  /* giveaway-only additions */
  .steps{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
  .stepdot{width:8px;height:8px;border-radius:50%;background:#333}
  .stepdot.on{background:var(--gold)}
  .cool{background:#1a1206;border:1px solid #6a5200;border-radius:12px;padding:14px;margin-top:12px;color:#e0c070;font-size:13px;line-height:1.5}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">GRAND<span>LAB</span></div>
      <h1>Lucky Spin</h1>
      <p class="sub" id="heroSub">Spin the wheel &mdash; every spin wins something.</p>
    </div>

    <!-- STEP 2: the wheel, animated to the prize the server already picked -->
    <div id="wheelStep" class="card hidden">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div id="wheelDots" style="position:absolute;inset:0;z-index:3"></div>
        <div class="wheel" style="position:absolute;inset:0;z-index:1"></div>
        <canvas id="wheel" width="292" height="292" style="position:absolute;top:14px;left:14px;z-index:2;border-radius:50%;transition:transform 6.4s cubic-bezier(.1,.7,.03,1)"></canvas>
      </div>
      <div id="status" class="status"></div>
    </div>

    <!-- STEP 1: details first, so the prize is drawn and recorded server-side -->
    <div id="regStep" class="card">
      <div class="prize-won" id="wonLabel">Your details</div>
      <p class="sub" style="text-align:center;margin-bottom:14px">Fill these in, then spin. Every spin wins something.</p>
      <div class="field"><label>Name</label><input id="rName" placeholder="Your name"></div>
      <div class="field"><label>Phone Number</label><input id="rPhone" type="tel" inputmode="numeric" placeholder="e.g. 60123456789"></div>
      <div class="field"><label>Car Plate</label><input id="rPlate" placeholder="e.g. ABC1234" style="text-transform:uppercase"></div>
      <div class="field"><label>Email</label><input id="rEmail" type="email" placeholder="you@email.com"></div>
      <button class="btn btn-gold" id="regBtn" onclick="doRegister()">SPIN NOW</button>
      <div id="regStatus" class="status"></div>
    </div>

    <!-- STEP 3: claimed -->
    <div id="doneStep" class="card hidden">
      <div class="prize-won" id="doneLabel"></div>
      <div class="refbox">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Your code</div>
        <div class="code" id="doneRef"></div>
      </div>
      <button class="btn btn-gold" onclick="waClaim()">BOOK APPOINTMENT FROM OUR GRANDLAB CUSTOMER SERVICE NOW</button>
      <div class="cool" id="nextNote"></div>
    </div>

    <!-- cooldown -->
    <div id="coolStep" class="card hidden">
      <div class="prize-won">Already spun</div>
      <div class="cool" id="coolMsg"></div>
      <button class="btn btn-gold" onclick="waClaim()">BOOK APPOINTMENT FROM OUR GRANDLAB CUSTOMER SERVICE NOW</button>
    </div>
  </div>

<script>
const SUPABASE_URL="https://db.grandlab.com.my";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkzMDY5NDExLCJleHAiOjE5NTA3NDk0MTF9.IcbPnDCd9p6Z-_FNMvzfg9k6ayX7IpC48zdGacAD_qw";
const CS_WHATSAPP="60129384313";              // Mia
/* There is no cooldown. gl_spin_wins has a permanent unique index on
   (phone, plate), so one car gets one spin for good - a "next free spin on
   <date>" message would have been a promise the database never honours. */
const VALID_DAYS=30;                          // how long a won prize stays redeemable
const fmtD=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:false}});
const $=id=>document.getElementById(id);
const esc=s=>(s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normPhone=p=>(p||'').replace(/[^0-9]/g,'');
let PRIZES=[], WON=null, PENDING_REF=null, spinning=false, CLAIMED=null;
const EVENT_NAME="Grandpride - Grandprix F1 Event";

function shortLabel(lbl){
  let s=(lbl||'').trim();
  // strip "*except promo" and similar suffixes
  s=s.replace(/\*.*$/,'').trim();
  s=s.replace(/for any services?/i,'OFF').replace(/for any/i,'').trim();
  // common shortenings
  s=s.replace(/\bServices?\b/i,'').trim();
  s=s.replace(/\s{2,}/g,' ');
  // if still long, cap it
  if(s.length>15) s=s.slice(0,15);
  return s;
}

function drawWheel(){
  const c=$('wheel'), ctx=c.getContext('2d'), n=PRIZES.length||1, cx=146, cy=146, r=146;
  const arc=2*Math.PI/n;
  ctx.clearRect(0,0,292,292);
  PRIZES.forEach((p,i)=>{
    const a0=i*arc - Math.PI/2, a1=a0+arc;
    const mega=!!p.is_mega;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    if(mega){ const g=ctx.createRadialGradient(cx,cy,30,cx,cy,r); g.addColorStop(0,'#e0202a'); g.addColorStop(1,'#8a0d13'); ctx.fillStyle=g; }
    else { ctx.fillStyle=p.color||(i%2?'#F5C518':'#fff5cc'); }
    ctx.fill();
    ctx.strokeStyle=mega?'#ffd700':'#F5C518'; ctx.lineWidth=mega?2.5:1.5; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0+arc/2); ctx.textAlign='right';
    if(mega){
      ctx.font="800 8px -apple-system,sans-serif"; ctx.fillStyle="#ffe08a"; ctx.fillText("★ MEGA PRIZE ★", r-14, -6);
      ctx.font="800 11px -apple-system,sans-serif"; ctx.fillStyle="#fff";
      ctx.fillText("Gyeon Coating", r-14, 8);
    } else {
      const light=(p.color==='#fff5cc'||!p.color||p.color==='#F5C518');
      ctx.fillStyle = light ? '#8a6d00' : '#fff';
      ctx.font="700 11px -apple-system,sans-serif";
      ctx.fillText(shortLabel(p.label), r-14, 4);
    }
    ctx.restore();
  });
  // rim dots
  const dc=$('wheelDots'); if(dc){ dc.innerHTML='';
    for(let i=0;i<n*2;i++){ const ang=(i/(n*2))*2*Math.PI - Math.PI/2;
      const dx=160+150*Math.cos(ang), dy=160+150*Math.sin(ang);
      const d=document.createElement('div');
      d.style.cssText='position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;left:'+(dx-3)+'px;top:'+(dy-3)+'px;box-shadow:0 0 4px #fff';
      dc.appendChild(d);
    }
  }
}



async function loadPrizes(){
  try{
    const {data}=await sb.from('gl_spin_prizes').select('*').eq('active',true).order('sort_order',{ascending:true});
    PRIZES=data||[];
  }catch(e){ PRIZES=[]; }
  if(!PRIZES.length){
    // the wheel step is hidden until they register, so say it where they are
    $('regStatus').textContent='Prizes unavailable right now.';
    $('regStatus').className='status err';
    $('regBtn').disabled=true;
    return;
  }
  drawWheel();
}

/* A recorded win is remembered so refreshing the page cannot re-roll a better
   prize, and so the prize survives a reload mid-animation. The prize itself is
   drawn and written server-side by gl_spin_record. */
function savePending(o){ try{ localStorage.setItem('gl_giveaway_pending', JSON.stringify(o)); }catch(e){} }
function readPending(){ try{ return JSON.parse(localStorage.getItem('gl_giveaway_pending')||'null'); }catch(e){ return null; } }
function clearPending(){ try{ localStorage.removeItem('gl_giveaway_pending'); }catch(e){} }
/* No device-level lock: one handset is often shared between customers at an
   event, so locking the browser turned genuine customers away. The phone NUMBER
   and the car PLATE are checked in the database at claim time - that is what
   actually stops a repeat. */

/* The wheel is an animation, not the draw. By the time it turns, gl_spin_record
   has already picked the prize and written the row, so a refresh, a second tab
   or an edited page cannot change what was won. */
function animateToPrize(prize, onDone){
  const n=PRIZES.length||1, seg=360/n;
  const idx=Math.max(0,PRIZES.findIndex(p=>p.id===(prize&&prize.id)));
  $('wheel').style.transform=`rotate(${360*8 + (360 - (idx*seg + seg/2))}deg)`;
  setTimeout(onDone, 6600);
}

function showDone(){
  const p=WON||{}, c=CLAIMED||{};
  $('regStep').classList.add('hidden');
  $('wheelStep').classList.add('hidden');
  $('coolStep').classList.add('hidden');
  $('doneStep').classList.remove('hidden');
  $('doneLabel').textContent=p.label||'';
  $('doneRef').textContent=PENDING_REF||'';
  $('nextNote').innerHTML='<b>Valid '+(c.from||fmtD(new Date()))+' &ndash; '+(c.to||'')+'</b><br>'+
    'Book with our customer service before it expires.<br><br>'+
    'One spin per car &mdash; thanks for playing!';
  $('heroSub').textContent='Prize claimed';
}

async function doRegister(){
  const name=($('rName').value||'').trim();
  const phone=normPhone($('rPhone').value);
  const plate=($('rPlate').value||'').trim().toUpperCase();
  const email=($('rEmail').value||'').trim();
  const st=$('regStatus');
  if(!name){ st.textContent='Please enter your name.'; st.className='status err'; return; }
  if(phone.length<9){ st.textContent='Please enter a valid phone number.'; st.className='status err'; return; }
  if(!plate){ st.textContent='Please enter your car plate.'; st.className='status err'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ st.textContent='Please enter a valid email.'; st.className='status err'; return; }
  if(spinning) return;
  if(!PRIZES.length){ st.textContent='Prizes unavailable right now.'; st.className='status err'; return; }
  spinning=true;
  $('regBtn').disabled=true; $('regBtn').textContent='Spinning...';
  st.textContent=''; st.className='status';

  /* One call draws the prize and writes the row. The "one spin per car" rule is
     the unique index on (phone, plate) in the database, not a check here - a
     client-side check could be skipped, and two phones hitting Spin at the same
     second would both pass it. */
  let res=null;
  try{
    const {data,error}=await sb.rpc('gl_spin_record',{
      p_name:name, p_phone:'+'+phone, p_plate:plate,
      p_brand:null, p_model:null, p_ctype:null, p_email:email });
    if(error) throw error;
    res=Array.isArray(data)?data[0]:data;
  }catch(e){ res=null; }

  if(!res || !res.ok){
    spinning=false;
    $('regBtn').disabled=false; $('regBtn').textContent='SPIN NOW';
    if(res && res.reason==='already_spun'){
      $('regStep').classList.add('hidden'); $('coolStep').classList.remove('hidden');
      $('coolMsg').innerHTML='This car has already had its spin &mdash; <b>one spin per car</b>.'+
        '<br><br>If you think that is a mistake, message our customer service below and we will check it for you.';
      $('heroSub').textContent='Already spun';
      clearPending();
      return;
    }
    st.textContent='Could not save. Please try again.'; st.className='status err';
    return;
  }

  WON=res.prize||{}; PENDING_REF=res.ref;
  const p=WON;
  const validTo0=new Date(Date.now()+VALID_DAYS*86400000);
  CLAIMED={name:name, phone:phone, plate:plate, email:email,
           from:fmtD(new Date()), to:fmtD(validTo0)};
  // The win is already in the database, so remember it here too: a refresh
  // mid-animation must show the same prize, not re-register and be told the car
  // already spun.
  savePending({ref:PENDING_REF, prize:WON, claimed:CLAIMED, at:Date.now()});

  // Save the customer to gl_walkin exactly as gl-spin.html does, so they turn up
  // in the plate scanner and job card when they come in to claim. Without this
  // the win is recorded but reception cannot find the customer by plate.
  try{
    let ex=null;
    if(plate){
      const data = await walkinFind(sb, plate, null);
      ex=data;
    }
    if(!ex){
      // no plate match - reuse a row on the same phone that has no car yet
      ex = await walkinFind(sb, null, '+'+phone);
    }
    const wk={name:name, phone:'+'+phone, plate:plate};
    if(ex) await sb.from('gl_walkin').update(wk).eq('id',ex.id);
    else    await sb.from('gl_walkin').insert(wk);
  }catch(e){ /* never block the claim on this */ }

  // now show them the wheel landing on what the server already gave them
  $('regStep').classList.add('hidden');
  $('wheelStep').classList.remove('hidden');
  $('heroSub').textContent='Good luck!';
  animateToPrize(p, showDone);
}

function waClaim(){
  const p=WON||{};
  const c=CLAIMED||{};
  const lines=[
    'Hi GrandLab! I would like to book an appointment.',
    '',
    'Name: '+(c.name||'-'),
    'Car Plate: '+(c.plate||'-'),
    'Prize Won: '+(p.label||'-'),
    'Code: '+(PENDING_REF||'-'),
    'Valid: '+(c.from||'-')+' to '+(c.to||'-'),
    'From: '+EVENT_NAME
  ];
  const msg=lines.join('\n');
  const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  const url=isMobile?'https://wa.me/'+CS_WHATSAPP+'?text='+encodeURIComponent(msg)
                    :'https://web.whatsapp.com/send?phone='+CS_WHATSAPP+'&text='+encodeURIComponent(msg);
  window.open(url,'_blank');
}

/* A recorded win is restored, so a refresh shows the same prize again instead of
   re-registering the car and being told it already spun.
   An entry with no `claimed` is from the older build, where the prize was drawn
   before any details were asked for and so was never written to the database.
   There is nothing to restore - it is dropped, and they register normally. */
(function init(){
  loadPrizes();
  const pend=readPending();
  if(pend && pend.prize && pend.ref && pend.claimed){
    WON=pend.prize; PENDING_REF=pend.ref; CLAIMED=pend.claimed;
    showDone();
  } else if(pend){
    clearPending();
  }
})();

/* Look a walk-in customer up without being able to read the whole table.
   gl_walkin_find is SECURITY DEFINER and returns only id/plate/model for an
   exact plate or phone - never name, phone or email. Falls back to the old
   direct select while the broad anon read policy is still in place, so this
   change is safe to deploy on its own. */
async function walkinFind(sb, plate, phone){
  try{
    const {data,error}=await sb.rpc('gl_walkin_find',{p_plate:plate||null,p_phone:phone||null});
    if(!error) return (data && data.length) ? data[0] : null;
  }catch(e){ /* fall through */ }
  try{
    if(plate){
      const {data}=await sb.from('gl_walkin').select('id,plate,model').ilike('plate',plate).limit(1).maybeSingle();
      if(data) return data;
    }
    if(phone){
      const {data}=await sb.from('gl_walkin').select('id,plate,model').eq('phone',phone)
        .or('plate.is.null,plate.eq.').limit(1).maybeSingle();
      return data||null;
    }
  }catch(e){}
  return null;
}
</script>
</body>
</html>
