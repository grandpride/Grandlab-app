<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandlab Vehicle Inspection Record</title>
<style>
:root{--bg:#080808;--card:#141414;--card2:#1c1c1c;--gold:#F5C518;--text:#fff;--text2:#9a9a9a;--border:#2a2a2a;--red:#ff5252}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:900;margin:6px 0 2px}
h1 span{color:var(--gold)}
.sub{color:var(--text2);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.sec{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:10px;letter-spacing:.05em}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border:none}
.kv .k{color:var(--text2)}
#carbox{position:relative;background:var(--card2);border-radius:12px;overflow:hidden}
#carbox svg{display:block;width:100%;height:auto}
.mark{position:absolute;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);border:2px solid #fff}
.marklist div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%}
.cathead{font-size:13px;font-weight:800;color:var(--gold);margin:14px 0 8px}
#carbox img.diag{display:block;width:100%;height:auto}
.marklist b{color:var(--text)}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photos img{width:100%;border-radius:12px;border:1px solid var(--border);display:block}
#loading{text-align:center;padding:60px;color:var(--text2)}
.hide{display:none!important}
.plate{font-size:26px;font-weight:900;letter-spacing:1px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1>GRAND<span>LAB</span> DETAILING</h1>
  <div class="sub">Vehicle Inspection Record</div>
  <div id="loading">Loading...</div>

  <div id="content" class="hide">
    <div class="card">
      <div class="plate" id="v_plate"></div>
      <div class="kv"><span class="k">Date</span><span id="v_date"></span></div>
      <div class="kv"><span class="k">Model</span><span id="v_model"></span></div>
      <div class="kv" id="kv_type"><span class="k">Type</span><span id="v_type"></span></div>
      <div class="kv"><span class="k">Services</span><span id="v_services"></span></div>
      <div class="kv"><span class="k">Staff</span><span id="v_staff"></span></div>
    </div>

    <div class="card" id="markcard">
      <div class="sec">DAMAGE MARKS</div>
      <div id="carbox">
        <img id="diagimg" class="diag" alt="car diagram">
        <div id="marks"></div>
      </div>
      <div class="marklist" id="marklist"></div>
    </div>

    <div class="card" id="notecard">
      <div class="sec">NOTES</div>
      <div id="v_notes" style="font-size:14px;color:var(--text2)"></div>
    </div>

    <div class="card">
      <div class="sec">PHOTOS (<span id="v_count">0</span>)</div>
      <div class="photos" id="photos"></div>
    </div>
    <div class="sub" style="text-align:center;margin:20px 0">GrandLab Detailing · PJS 13, Petaling Jaya</div>
  </div>
</div>

const DMG=[['SCRATCH','','#ff5252'],['DENT','','#ff9800'],['CHIP','','#2196f3'],['CRACK','','#b366ff'],['OTHER','','#9e9e9e']];
const CATNAMES={front:'Front',left:'Left',right:'Right',rear:'Rear',top:'Top',interior:'Interior',damage:'Close-up',other:'Other'};
function el(id){return document.getElementById(id)}

(async function(){
  const token=new URLSearchParams(location.search).get('t');
  if(!token){el('loading').textContent='Invalid link';return}
  const res=await sb.rpc('get_inspection',{p_token:token});
  if(res.error||!res.data||!res.data.length){el('loading').textContent='Record not found';return}
  const d=res.data[0];

  el('v_plate').textContent=d.plate;
  el('v_date').textContent=new Date(d.created_at).toLocaleString('en-MY',{timeZone:'Asia/Kuala_Lumpur',dateStyle:'medium',timeStyle:'short'});
  el('v_model').textContent=d.model||'-';
  const CT={walkin:'WALK-IN',workshop:'WORKSHOP',showroom:'SHOWROOM',boss:'BOSS'};
  if(d.cust_type&&d.cust_type!=='walkin'){
    el('v_type').textContent=(CT[d.cust_type]||d.cust_type)+(d.workshop_name?' — '+d.workshop_name:'');
  }else{ el('kv_type').classList.add('hide') }
  el('v_services').textContent=d.services||'-';
  el('v_staff').textContent=d.staff_email||'-';

  el('diagimg').src=DIAGRAMS[d.car_type]||DIAGRAMS.sedan;

  const marks=d.marks||[];
  if(marks.length){
    el('marks').innerHTML=marks.map(function(m){
      return '<div class="mark" style="left:'+m.x+'%;top:'+m.y+'%;background:'+DMG[m.type][2]+'">'+m.n+'</div>'}).join('');
    el('marklist').innerHTML=marks.map(function(m){
      return '<div><span class="mdot" style="background:'+DMG[m.type][2]+'"></span><b>#'+m.n+'</b> '+DMG[m.type][0]+'</div>'}).join('');
  }else{el('markcard').classList.add('hide')}

  if(d.notes){el('v_notes').textContent=d.notes}else{el('notecard').classList.add('hide')}

  el('v_count').textContent=d.photo_count||0;
  const ph=el('photos');
  function addImg(container,path){
    const url=sb.storage.from('inspections').getPublicUrl(d.share_token+'/'+path).data.publicUrl;
    const img=document.createElement('img');
    img.src=url;img.loading='lazy';
    img.onclick=function(){window.open(url,'_blank')};
    container.appendChild(img);
  }
  const plist=d.photos||[];
  if(plist.length){
    const order=['front','left','right','rear','top','interior','damage','other'];
    order.forEach(function(cat){
      const items=plist.filter(function(p){return p.cat===cat});
      if(!items.length)return;
      const h=document.createElement('div');h.className='cathead';
      h.textContent=(CATNAMES[cat]||cat)+' ('+items.length+')';
      ph.parentNode.insertBefore(h,null);
      const grid=document.createElement('div');grid.className='photos';
      ph.parentNode.appendChild(grid);
      items.forEach(function(p){addImg(grid,p.path)});
    });
    ph.classList.add('hide');
  }else{
    for(let i=1;i<=(d.photo_count||0);i++){
      addImg(ph,'photo_'+String(i).padStart(2,'0')+'.jpg');
    }
  }

  el('loading').classList.add('hide');
  el('content').classList.remove('hide');
})();
</script>
