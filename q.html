<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grandlab</title>
<style>
  :root{color-scheme:dark;}
  html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto",sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:0 max(20px,env(safe-area-inset-left,0px));text-align:center;}
  .mark{font-size:22px;font-weight:900;letter-spacing:.1em;color:#F5C518;}
  .msg{font-size:14px;color:#8A8A8A;}
  .spin{width:26px;height:26px;border:2.5px solid #2A2A2A;border-top-color:#F5C518;
    border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  a.fallback{display:none;margin-top:4px;color:#F5C518;font-size:14px;font-weight:600;}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">GRANDLAB</div>
  <div class="spin" id="spin"></div>
  <div class="msg" id="msg">Opening&hellip;</div>
  <a class="fallback" id="fb" href="index.html">Continue</a>
</div>

<script>
/* ---------------------------------------------------------------------------
   Router for the customer's "My QR".

   One QR, two audiences. Both the customer PWA and the staff apps are served
   from this same origin, and they keep their sessions under different
   localStorage keys:
       gl_auth    -> a staff app has been signed in on this browser
       gl_session -> the customer PWA
   So this page can tell who is scanning and send them somewhere useful:

       staff   -> gl-customers.html, with the customer already searched for
       anyone  -> index.html?ref=CODE, the normal referral signup

   Caveat worth knowing: reception has to scan with the browser they are
   signed into the hub with. A camera app that opens a different browser has
   no gl_auth there, so it falls through to the signup page.
--------------------------------------------------------------------------- */
const SUPA_URL  = "https://db.grandlab.com.my";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkzMDY5NDExLCJleHAiOjE5NTA3NDk0MTF9.IcbPnDCd9p6Z-_FNMvzfg9k6ayX7IpC48zdGacAD_qw";

const code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
const dir  = location.pathname.replace(/[^/]*$/, '');
const custUrl  = dir + 'index.html' + (code ? '?ref=' + encodeURIComponent(code) : '');
const staffUrl = dir + 'gl-customers.html';

function go(url, why){
  try{ document.getElementById('msg').textContent = why || 'Opening…'; }catch(e){}
  location.replace(url);
}
// if anything stalls, give them a tappable way out rather than a dead spinner
setTimeout(function(){
  try{
    document.getElementById('spin').style.display='none';
    const a=document.getElementById('fb');
    a.href=custUrl; a.style.display='block';
    document.getElementById('msg').textContent='Taking longer than expected.';
  }catch(e){}
}, 6000);

// The staff session is the Supabase session JSON the staff apps persist.
// Read the token straight out of it - no library, so no CDN to fail.
function staffToken(){
  try{
    const s = JSON.parse(localStorage.getItem('gl_auth') || 'null');
    if(!s) return '';
    return s.access_token || (s.currentSession && s.currentSession.access_token) || '';
  }catch(e){ return ''; }
}

(async function(){
  if(!code) return go(custUrl);                     // no code - just open the app

  const token = staffToken();
  if(!token) return go(custUrl);                    // a friend scanning - signup with the code

  // staff device: turn the referral code into something the customer search finds
  try{
    const ctl = new AbortController();
    setTimeout(function(){ ctl.abort(); }, 4000);   // never hang on a slow network
    const r = await fetch(
      SUPA_URL + '/rest/v1/gl_profiles?select=phone,name&referral_code=ilike.'
        + encodeURIComponent(code) + '&limit=1',
      { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + token }, signal:ctl.signal }
    );
    if(!r.ok) return go(staffUrl, 'Opening staff view…');   // expired token, etc.
    const rows = await r.json();
    if(!rows || !rows.length) return go(staffUrl, 'Opening staff view…');
    const q = String(rows[0].phone || rows[0].name || '').trim();
    return go(q ? staffUrl + '?q=' + encodeURIComponent(q) : staffUrl, 'Opening customer…');
  }catch(e){
    return go(staffUrl, 'Opening staff view…');
  }
})();
</script>
</body>
</html>
