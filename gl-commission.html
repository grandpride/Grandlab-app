<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>Grandlab Film Commission</title>
<style>
:root{--bg:#080808;--card:#141414;--card2:#1c1c1c;--gold:#F5C518;--text:#fff;--text2:#9a9a9a;--border:#2a2a2a;--red:#ff5252;--green:#16A34A;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:900;letter-spacing:.5px;margin:6px 0 2px}
h1 span{color:var(--gold)}
.sub{color:var(--text2);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.sec{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.1em;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px;color:var(--text);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;background:var(--gold);color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn2{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;text-align:center}
.tab.on{background:var(--gold);color:#000;border-color:var(--gold)}
.jrow{display:flex;align-items:center;gap:10px;padding:12px 10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card2)}
.jrow:active{border-color:var(--gold)}
.jrow .pl{font-weight:900;font-size:15px;min-width:86px}
.jrow .mid{flex:1;min-width:0}
.jrow .sub2{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-weight:900;color:var(--gold);white-space:nowrap}
.pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:12px;white-space:nowrap}
.empty{text-align:center;color:var(--text2);font-size:13px;padding:22px 6px}
.hint{font-size:11px;color:var(--text2);margin-top:6px}
.warn{background:rgba(255,82,82,.12);border:1px solid var(--red);color:#ffb3b3;border-radius:10px;padding:10px;font-size:12px;margin-top:8px}
.ok{background:rgba(22,163,74,.12);border:1px solid var(--green);color:#9ae6b4;border-radius:10px;padding:10px;font-size:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text2);font-size:10px;font-weight:800;letter-spacing:.08em;padding:6px 4px;border-bottom:1px solid var(--border)}
td{padding:7px 4px;border-bottom:1px solid var(--border)}
td input,td select{padding:7px;font-size:13px}
.tot{font-weight:900;color:var(--gold)}
.hide{display:none!important}
#login{max-width:400px;margin:80px auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 20px;border-radius:24px;font-weight:800;font-size:14px;display:none;z-index:99}
.big{font-size:26px;font-weight:900;color:var(--gold)}
.zrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.zrow .zn{width:150px;font-size:12px;color:var(--text2)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<script>

const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Y2hsanB6b3J6bWF2ZWl4bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDk2NjQsImV4cCI6MjA5NzIyNTY2NH0.6dA1zhz5ZIwf8byFB8vhfOzPI-uPPdPihEr1b8GG_oA';

const APPROVE_PIN='065437';

function isBike(job){
  if((job.car_type||'').toLowerCase().indexOf('motor')>=0)return true;

// ---------- auth ----------
const ENTRY_PIN='1919';
let pinBuf='';

(async function(){
  const s=await sb.auth.getSession();

function showPin(){

function drawDots(){

function pinKey(k){
  el('pinerr').textContent='';

async function signOut(){

async function boot(){
  const r=await sb.from('gl_comm_rates').select('*').eq('active',true);
  RATES=r.data||[];
  const c=await sb.from('gl_board_config').select('technicians').eq('id',1).maybeSingle();
  TECHS=(c.data&&Array.isArray(c.data.technicians)?c.data.technicians:[]).filter(function(t){return t!=='All Staff'});
  loadNew();
}

function setTab(t){
  TAB=t;
  ['new','pend','done','report','rates'].forEach(function(k){
    el('v_'+k).classList.toggle('hide',k!==t);
  });
  Array.from(document.querySelectorAll('.tab')).forEach(function(b){
    b.classList.toggle('on',b.dataset.t===t);
  });
  if(t==='new')loadNew(); if(t==='pend')loadList('pend'); if(t==='done')loadList('done');
  if(t==='report')loadReport(); if(t==='rates')loadRates();
}

// ---------- rate matching ----------
function pkgOf(name,bike){
  const n=(name||'').toLowerCase();
  if(/removal/.test(n))return null;                 // film removal is labour
  // a bike only ever has one package, whatever the car service was called
  if(bike)return (n.indexOf('full car')>=0||n.indexOf('full front')>=0)?'full_bike':null;
  if(n.indexOf('full car')>=0)return 'full_car';
  if(n.indexOf('full front')>=0 && n.indexOf('basic')<0)return 'full_front';
  if(n.indexOf('front 3')>=0)return 'front_3';
  return null;                                       // part / a la carte
}
function findRate(catHint,name,bike){
  if(!bike){
    const exact=RATES.filter(function(r){return r.service_match===name})[0];
    if(exact)return exact;
  }
  const p=pkgOf(name,bike);
  if(!p)return null;
  // brand is the longest brand string that appears in the service name
  let best=null;
  RATES.forEach(function(r){
    if(r.package!==p||!r.brand)return;
    if(name.toLowerCase().indexOf(r.brand.toLowerCase())>=0){
      if(!best||r.brand.length>best.brand.length)best=r;
    }
  });
  return best;
}
function filmLines(job){
  const out=[]; const bike=isBike(job);
  (job.services||[]).forEach(function(s){
    const nm=(typeof s==='string')?s:(s&&s.desc?s.desc:'');
    if(!nm)return;
    const r=findRate(null,nm,bike);
    if(r&&Number(r.amount)>0)out.push({name:nm,rate:r});
  });
  return out;
}

// ---------- NEW JOBS ----------
async function loadNew(){
  const box=el('v_new');
  box.innerHTML='<div class="card"><div class="empty">Loading...</div></div>';
  const since=Date.now()-45*86400000;
  const j=await sb.from('gl_jobs')
    .select('id,plate,model,car_type,services,created_at,stage,ready_at')
    .gte('created_at',since).order('created_at',{ascending:false}).limit(200);
  if(j.error){box.innerHTML='<div class="card"><div class="empty">Could not load jobs</div></div>';return}
  // one entry per FILM SERVICE - a car with PPF + tint is two separate
  // commission orders, so each team is paid from its own pool
  let items=[];
  (j.data||[]).forEach(function(x){
    filmLines(x).forEach(function(l){ items.push({job:x,line:l}) });
  });
  const ids=items.map(function(it){return it.job.id});
  if(ids.length){
    const c=await sb.from('gl_comm_orders').select('job_id,service_name').in('job_id',ids);
    const seen={}; (c.data||[]).forEach(function(x){seen[x.job_id+'||'+(x.service_name||'')]=1});
    items=items.filter(function(it){return !seen[it.job.id+'||'+it.line.name]});
  }
  if(!items.length){
    box.innerHTML='<div class="card"><div class="sec">NEW JOBS</div><div class="empty">No film jobs waiting &#10003;</div></div>';
    return;
  }
  box.innerHTML='<div class="card"><div class="sec">NEW JOBS ('+items.length+')</div>'+
    items.map(function(it,i){
      const bike=isBike(it.job);
      return '<div class="jrow" data-i="'+i+'">'+
        '<div class="pl">'+esc(it.job.plate||'-')+'</div>'+
        '<div class="mid"><div>'+esc(it.job.model||'')+
          (bike?' <span class="pill" style="background:var(--gold);color:#000">BIKE</span>':'')+'</div>'+
        '<div class="sub2">'+esc(it.line.name)+'</div></div>'+
        '<div class="rm">'+rm(it.line.rate.amount)+'</div></div>';
    }).join('')+'</div>';
  Array.from(box.querySelectorAll('.jrow')).forEach(function(d,i){
    d.onclick=function(){openForm(items[i].job,items[i].line)};
  });
}

// ---------- FORM ----------
function openForm(job,line){
  const bike=isBike(job);
  CUR={job:job,line:line,lines:[line],zones:{},people:[],bike:bike,serials:[]};
  const ZONES = bike?ZONES_BIKE:ZONES_CAR;
  CUR.ZONES=ZONES;
  const base=Number(line.rate.amount)||0;
  const th=Number(line.rate.target_hours)||8;
  const nowLocal=new Date(Date.now()+8*3600000).toISOString().slice(0,16);
  el('v_new').innerHTML=
   '<button class="btn btn2" style="margin-bottom:12px" onclick="loadNew()">&#8592; BACK TO LIST</button>'+
   '<div class="card"><div class="sec">VEHICLE'+
     (bike?' <span class="pill" style="background:var(--gold);color:#000;margin-left:6px">BIKE</span>':'')+'</div>'+
     '<div class="big">'+esc(job.plate||'-')+'</div>'+
     '<div class="hint">'+esc(job.model||'')+'</div>'+
     '<div style="margin-top:10px">'+
        '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">'+
        '<span>'+esc(line.name)+'</span><span class="rm">'+rm(line.rate.amount)+'</span></div>'+
     '</div>'+
     '<div class="hint">One order per film service. Other services on this car are entered separately.</div>'+
     '<div style="display:flex;justify-content:space-between;margin-top:10px;font-weight:900">'+
       '<span>BASE COMMISSION</span><span class="tot" id="f_base">'+rm(base)+'</span></div>'+
   '</div>'+

   '<div class="card"><div class="sec">TIMING</div>'+
     '<div class="row">'+
       '<div><label>Start</label><input type="datetime-local" id="f_start" value="'+nowLocal+'" onchange="calc()"></div>'+
       '<div><label>End</label><input type="datetime-local" id="f_end" value="'+nowLocal+'" onchange="calc()"></div>'+
     '</div>'+
     '<div class="row"><div><label>Deliver date</label><input type="datetime-local" id="f_deliver"></div></div>'+
     '<div class="hint">Target for this job: '+th+' hours</div>'+
     '<div id="f_timing"></div>'+
     '<div class="row" style="margin-top:8px"><div><label>Override band (management decision)</label>'+
       '<select id="f_band" onchange="calc(true)">'+
         '<option value="">Auto</option>'+
         '<option value="ontime">On time - 100%</option>'+
         '<option value="nextday">Next day - 50%</option>'+
         '<option value="late">Late - 0%</option>'+
       '</select></div></div>'+
   '</div>'+

   '<div class="card"><div class="sec">WHO APPLIED WHICH ZONE</div>'+
     '<div class="hint" style="margin-bottom:8px">Used by QC to trace a defect back to the installer.</div>'+
     CUR.ZONES.map(function(z,i){
       return '<div class="zrow"><div class="zn">'+z+'</div>'+
         '<select id="z_'+i+'"><option value="">-</option>'+
         TECHS.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select></div>';
     }).join('')+
   '</div>'+

   '<div class="card"><div class="sec">COMMISSION SPLIT</div>'+
     '<table><thead><tr><th>Staff</th><th style="width:96px">Team</th><th style="width:70px">%</th><th style="width:84px">Amount</th><th style="width:28px"></th></tr></thead>'+
     '<tbody id="f_people"></tbody></table>'+
     '<button class="btn btn2" style="margin-top:10px" onclick="addPerson()">+ ADD STAFF</button>'+
     '<div id="f_check"></div>'+
     '<div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:900">'+
       '<span>TOTAL PAYOUT</span><span class="tot" id="f_total">RM0.00</span></div>'+
   '</div>'+

   '<div class="card"><div class="sec">FILM SERIAL NUMBER'+
     '<span style="color:var(--text2);font-weight:400;text-transform:none"> &mdash; for AXFilm warranty</span></div>'+
     '<div class="row"><div><input id="f_serial" placeholder="Scan or type serial / roll no." autocomplete="off"></div>'+
     '<div style="flex:0 0 96px"><button class="btn btn2" style="padding:11px" onclick="addSerial()">ADD</button></div></div>'+
     '<button class="btn btn2 hide" id="f_scanbtn" onclick="scanSerial()">SCAN WITH CAMERA</button>'+
     '<video id="f_video" class="hide" style="width:100%;border-radius:10px;margin-top:8px" playsinline></video>'+
     '<div id="f_serials"></div>'+
     '<div class="hint">A barcode scanner types straight into the box. Add one per roll used.</div>'+
   '</div>'+

   '<div class="card"><div class="sec">NOTES</div>'+
     '<textarea id="f_notes" rows="2" placeholder="Special car, bodykit, delays..."></textarea></div>'+

   '<button class="btn" id="f_save" onclick="saveOrder()">SUBMIT FOR APPROVAL</button>'+
   '<div style="height:30px"></div>';

  CUR.base=base; CUR.target=th;
  el('f_serial').addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();addSerial()}   // hardware scanners send Enter
  });
  if('BarcodeDetector' in window)el('f_scanbtn').classList.remove('hide');
  renderSerials();
  addPerson('Koko','senior');
  calc();
}

function addPerson(name,role){
  CUR.people.push({name:name||'',role:role||'junior',pct:0});
  renderPeople();
}
function renderPeople(){
  const tb=el('f_people');
  tb.innerHTML=CUR.people.map(function(p,i){
    return '<tr>'+
      '<td><select onchange="setP('+i+',\'name\',this.value)"><option value="">-</option>'+
        TECHS.map(function(t){return '<option'+(t===p.name?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></td>'+
      '<td><select onchange="setP('+i+',\'role\',this.value)">'+
        '<option value="senior"'+(p.role==='senior'?' selected':'')+'>Senior</option>'+
        '<option value="junior"'+(p.role==='junior'?' selected':'')+'>Junior</option></select></td>'+
      '<td><input type="number" min="0" max="100" value="'+p.pct+'" onchange="setP('+i+',\'pct\',this.value)"></td>'+
      '<td class="rm" id="amt_'+i+'">RM0.00</td>'+
      '<td><button class="btn2" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:16px" onclick="rmP('+i+')">&times;</button></td>'+
    '</tr>';
  }).join('');
  autoPct();
}
function setP(i,k,v){ CUR.people[i][k]=(k==='pct')?Number(v):v; if(k==='role')autoPct(); calc(); }
function rmP(i){ CUR.people.splice(i,1); renderPeople(); calc(); }
function autoPct(){
  ['senior','junior'].forEach(function(role){
    const idx=CUR.people.map(function(p,i){return p.role===role?i:-1}).filter(function(i){return i>=0});
    if(!idx.length)return;
    const each=Math.floor(100/idx.length);
    let left=100-each*idx.length;
    idx.forEach(function(i,k){ CUR.people[i].pct=each+(k===0?left:0) });
  });
  const tb=el('f_people');
  if(tb)Array.from(tb.querySelectorAll('input[type=number]')).forEach(function(inp,i){ inp.value=CUR.people[i].pct });
}

function bandOf(){
  const s=el('f_start').value, e=el('f_end').value;
  if(!s||!e)return {band:'ontime',f:1,auto:true};
  const sd=new Date(s), ed=new Date(e);
  const onTime=new Date(sd.getTime()+CUR.target*3600000);
  if(ed<=onTime)return {band:'ontime',f:1,auto:true};
  const nd=new Date(sd); nd.setDate(nd.getDate()+1); nd.setHours(23,59,59,999);
  if(ed<=nd)return {band:'nextday',f:0.5,auto:true};
  return {band:'late',f:0,auto:true};
}
function calc(){
  if(!CUR)return;
  let b=bandOf();
  const ov=el('f_band').value;
  if(ov){ b={band:ov,f:ov==='ontime'?1:ov==='nextday'?0.5:0,auto:false} }
  CUR.band=b;
  const lbl={ontime:'ON TIME - 100%',nextday:'NEXT DAY - 50%',late:'LATE - 0%'}[b.band];
  const col={ontime:'var(--green)',nextday:'var(--amber)',late:'var(--red)'}[b.band];
  el('f_timing').innerHTML='<div style="margin-top:8px;font-weight:800;color:'+col+'">'+lbl+
    (b.auto?'':' (manual)')+'</div>';

  let pool=CUR.base*b.f;
  const sen=CUR.people.filter(function(p){return p.role==='senior'&&p.name});
  const jun=CUR.people.filter(function(p){return p.role==='junior'&&p.name});
  // if one team is absent, its share goes to the team that did the work
  let sPool=pool*SENIOR_POOL, jPool=pool*JUNIOR_POOL;
  let note='';
  if(!sen.length&&jun.length){ jPool=pool; sPool=0; note='No senior assigned - full pool to junior team.'; }
  if(!jun.length&&sen.length){ sPool=pool; jPool=0; note='No junior assigned - full pool to senior team.'; }
  CUR.pool=pool;

  let total=0;
  CUR.people.forEach(function(p,i){
    const teamPool=p.role==='senior'?sPool:jPool;
    const teamList=p.role==='senior'?sen:jun;
    const amt=(p.name&&teamList.length)?(teamPool*(Number(p.pct)||0)/100):0;
    p.amount=+amt.toFixed(2); total+=p.amount;
    const c=el('amt_'+i); if(c)c.textContent=rm(amt);
  });
  el('f_total').textContent=rm(total);

  const sp=sen.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  const jp=jun.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  let msg='';
  if(sen.length&&sp!==100)msg+='Senior percentages total '+sp+'% (should be 100%). ';
  if(jun.length&&jp!==100)msg+='Junior percentages total '+jp+'% (should be 100%). ';
  el('f_check').innerHTML = msg ? ('<div class="warn">'+msg+'</div>')
                          : (note? ('<div class="warn">'+note+'</div>')
                          : '<div class="ok">Split adds up correctly.</div>');
}

// ---------- film serial numbers ----------
function renderSerials(){
  el('f_serials').innerHTML=CUR.serials.map(function(s,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">'+
      '<span style="color:var(--gold)">&#9642;</span><span style="flex:1;word-break:break-all">'+esc(s)+'</span>'+
      '<button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px" onclick="rmSerial('+i+')">&times;</button></div>';
  }).join('');
}
function addSerial(v){
  const inp=el('f_serial');
  const val=(typeof v==='string'?v:inp.value).trim();
  if(!val)return;
  if(CUR.serials.indexOf(val)<0)CUR.serials.push(val);
  inp.value=''; inp.focus(); renderSerials();
}
function rmSerial(i){ CUR.serials.splice(i,1); renderSerials(); }
async function scanSerial(){
  const v=el('f_video');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream; v.classList.remove('hide'); await v.play();
    const det=new BarcodeDetector();
    const tick=async function(){
      if(v.classList.contains('hide'))return;
      try{
        const codes=await det.detect(v);
        if(codes&&codes.length){
          addSerial(codes[0].rawValue);
          toast('Scanned '+codes[0].rawValue);
          stream.getTracks().forEach(function(t){t.stop()});
          v.classList.add('hide'); return;
        }
      }catch(e){}
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ toast('Camera not available - type it instead'); v.classList.add('hide'); }
}

async function decide(id,status){
  const pin=prompt('Manager PIN to '+status.toUpperCase()+':');
  if(pin!==APPROVE_PIN){ if(pin!==null)toast('Wrong PIN'); return }
  let patch={status:status};
  if(status==='hold'){
    const note=prompt('Reason for hold (QC / rework):')||'';
    patch.qc_flag=true; patch.qc_note=note;
    const m=prompt('Film wasted on redo, in metres (optional):');
    if(m&&!isNaN(m))patch.rework_metres=Number(m);
  }
  const r=await sb.from('gl_comm_orders').update(patch).eq('id',id);
  if(r.error){toast('Error: '+r.error.message);return}
  toast(status==='paid'?'Marked as paid':status==='hold'?'Put on hold':'Approved');
  setTab(status==='approved'||status==='paid'?'done':'pend');
}

// ---------- PDF: same layout as the paper Commission Order ----------
function commPDF(o){
  if(!window.jspdf||!window.jspdf.jsPDF){toast('PDF library not loaded');return}
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({unit:'mm',format:'a4'});
  const L=16, R=194, W=R-L;
  let y=18;
  const line=function(yy){d.setDrawColor(160);d.line(L,yy,R,yy)};
  const lab=function(t,x,yy){d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(110);d.text(t,x,yy)};
  const val=function(t,x,yy,b){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(10);d.setTextColor(0);d.text(String(t==null?'':t),x,yy)};

  d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(0);
  d.text('GRANDLAB PPF / WRAP / TINTED COMMISSION ORDER',L,y);
  d.setFillColor(245,197,24);d.rect(L,y+2.5,W,1.6,'F');
  y+=12;

  lab('CAR MODEL:',L,y);         val(o.model||'-',L+34,y,true);
  lab('DATE:',R-46,y);           val(myt(o.created_at),R-32,y);
  y+=7;
  lab('CAR PLATE NUMBER:',L,y);  val(o.plate||'-',L+34,y,true);
  if(o.is_bike){ d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(180,120,0);d.text('MOTORCYCLE',R-32,y) }
  y+=9; line(y); y+=7;

  lab('SERVICES:',L,y); val(o.category||'-',L+34,y,true);
  lab('PACKAGE:',R-56,y); val(String(o.package||'').replace(/_/g,' ').toUpperCase(),R-32,y);
  y+=7;
  lab('PRODUCT DETAILS:',L,y);
  const prod=d.splitTextToSize(String(o.service_name||'-'),W-36);
  val(prod,L+34,y); y+=Math.max(6,prod.length*5)+3;

  if((o.serials||[]).length){
    lab('FILM SERIAL NO:',L,y);
    const ser=d.splitTextToSize((o.serials||[]).join(',  '),W-36);
    val(ser,L+34,y); y+=Math.max(6,ser.length*5)+2;
  }
  line(y); y+=8;

  // installation table
  d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(0);
  d.text('INSTALLATION:',L,y); y+=5;
  const cols=[L,L+52,L+96,L+134,L+166];
  d.setFillColor(240);d.rect(L,y-4,W,7,'F');
  ['STAFF','TEAM','WHO HANDLE?','COMM RATE','FINAL COMM'].forEach(function(h,i){d.text(h,cols[i]+1,y)});
  y+=5;
  d.setFont('helvetica','normal');d.setFontSize(9);
  const zoneOf=function(name){
    return (o.zones||[]).filter(function(z){return z.staff===name})
      .map(function(z){return z.zone}).join(', ');
  };
  (o.splits||[]).forEach(function(s){
    const zs=d.splitTextToSize(zoneOf(s.name)||'-',36);
    const h=Math.max(6,zs.length*4.2);
    d.text(String(s.name||''),cols[0]+1,y);
    d.text(String(s.role||'').toUpperCase(),cols[1]+1,y);
    d.text(zs,cols[2]+1,y);
    d.text(String(s.pct||0)+'%',cols[3]+1,y);
    d.setFont('helvetica','bold');
    d.text(rm(s.amount),cols[4]+1,y);
    d.setFont('helvetica','normal');
    y+=h; line(y-2);
  });
  y+=4;

  // timing + totals
  const half=L+100;
  lab('START:',L,y);   val(o.start_at?myt(o.start_at):'-',L+24,y);
  lab('BASE:',half,y);  val(rm(o.base_amount),half+30,y);
  y+=6;
  lab('END:',L,y);     val(o.end_at?myt(o.end_at):'-',L+24,y);
  lab('TIMING:',half,y);val(String(o.timing_band||'').toUpperCase()+'  x'+o.timing_factor,half+30,y);
  y+=6;
  lab('DELIVER:',L,y); val(o.deliver_at?myt(o.deliver_at):'-',L+24,y);
  const tot=(o.splits||[]).reduce(function(a,b){return a+Number(b.amount||0)},0);
  d.setFont('helvetica','bold');d.setFontSize(11);
  d.text('COMMISSION FEE:',half,y); d.text(rm(tot),half+40,y);
  y+=10;

  if(o.notes){ lab('NOTES:',L,y); const n=d.splitTextToSize(o.notes,W-24); val(n,L+24,y); y+=Math.max(6,n.length*5); }
  if(o.qc_flag){ d.setTextColor(200,40,40);d.setFont('helvetica','bold');
    d.text('QC REWORK RAISED'+(o.qc_note?(' - '+o.qc_note):''),L,y); y+=7; d.setTextColor(0); }

  // signatures
  y=Math.max(y+8,236);
  line(y); y+=8;
  const sig=[['MANAGER SIGN',L],['BD SIGN',L+92]];
  const sig2=[['FINANCE SIGN',L],['MD SIGN',L+92]];
  d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(110);
  sig.forEach(function(s){d.text(s[0],s[1],y);d.setDrawColor(120);d.line(s[1],y+14,s[1]+62,y+14)});
  y+=24;
  sig2.forEach(function(s){d.text(s[0],s[1],y);d.setDrawColor(120);d.line(s[1],y+14,s[1]+62,y+14)});

  d.setFontSize(8);d.setTextColor(150);
  d.text('Status: '+String(o.status||'').toUpperCase()+'   |   Generated '+myt(new Date())+'   |   GrandLab Detailing',L,289);

  const fn='COMM_'+String(o.plate||'').replace(/[^A-Za-z0-9]+/g,'')+'_'+
    new Date(o.created_at||Date.now()).toISOString().slice(0,10)+'.pdf';
  d.save(fn);
}

    '<div class="hint" style="margin-bottom:10px">Change an amount and it applies to every new order. Manager PIN required to save.</div>'+

          '<td><input type="number" min="0" step="10" value="'+(Number(x.amount)||0)+'" id="ra_'+x.id+'"></td>'+
          '<td><input type="number" min="0" step="1" value="'+(x.target_hours==null?'':x.target_hours)+'" id="rh_'+x.id+'"></td>'+
          '<td style="text-align:center"><input type="checkbox" id="rc_'+x.id+'"'+(x.active?' checked':'')+' style="width:auto"></td>'+
        '</tr>';
      }).join('')+'</tbody></table>';
    }).join('')+
    '<button class="btn" style="margin-top:16px" onclick="saveRates()">SAVE RATE CHANGES</button>'+
    '<div style="height:20px"></div></div>';

async function saveRates(){
  const rows=el('v_rates')._rows||[];
  const changed=[];
  rows.forEach(function(x){
    const a=el('ra_'+x.id), h=el('rh_'+x.id), c=el('rc_'+x.id);
    if(!a)return;
    const amt=Number(a.value)||0;
    const th=h.value===''?null:Number(h.value);
    const act=!!c.checked;
    if(amt!==Number(x.amount)||th!==(x.target_hours==null?null:Number(x.target_hours))||act!==!!x.active){
      changed.push({id:x.id,amount:amt,target_hours:th,active:act,was:x.amount});
    }
  });
  if(!changed.length){toast('Nothing changed');return}
  const pin=prompt(changed.length+' rate'+(changed.length===1?'':'s')+' changed. Manager PIN to save:');
  if(pin!==APPROVE_PIN){ if(pin!==null)toast('Wrong PIN'); return }
  for(const c of changed){
    const r=await sb.from('gl_comm_rates')
      .update({amount:c.amount,target_hours:c.target_hours,active:c.active,updated_at:new Date().toISOString()})
      .eq('id',c.id);
    if(r.error){toast('Error: '+r.error.message);return}
  }
  toast(changed.length+' rate'+(changed.length===1?'':'s')+' updated');
  loadRates();
}

// ---------- REPORT ----------
async function loadReport(){
  const box=el('v_report');
  const now=new Date();
  const from=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const r=await sb.from('gl_comm_orders').select('*').gte('created_at',from);
  const rows=r.data||[];
  const per={};
  let paid=0, held=0, jobs=rows.length;
  rows.forEach(function(o){
    const t=(o.splits||[]).reduce(function(a,b){return a+Number(b.amount||0)},0);
    if(o.status==='hold')held+=t; else paid+=t;
    (o.splits||[]).forEach(function(s){
      if(!s.name)return;
      per[s.name]=per[s.name]||{name:s.name,jobs:0,amt:0,hold:0};
      per[s.name].jobs++;
      if(o.status==='hold')per[s.name].hold+=Number(s.amount||0);
      else per[s.name].amt+=Number(s.amount||0);
    });
  });
  const list=Object.keys(per).map(function(k){return per[k]}).sort(function(a,b){return b.amt-a.amt});
  const mon=now.toLocaleString('en-MY',{month:'long',year:'numeric'});
  box.innerHTML='<div class="card"><div class="sec">'+mon.toUpperCase()+'</div>'+
    '<div class="row"><div><label>Film jobs</label><div class="big">'+jobs+'</div></div>'+
    '<div><label>Commission</label><div class="big">'+rm(paid)+'</div></div>'+
    '<div><label>On hold</label><div class="big" style="color:var(--red)">'+rm(held)+'</div></div></div></div>'+
    '<div class="card"><div class="sec">BY STAFF</div>'+
    (list.length?('<table><thead><tr><th>Staff</th><th>Jobs</th><th>Commission</th><th>On hold</th></tr></thead><tbody>'+
      list.map(function(p){
        return '<tr><td>'+esc(p.name)+'</td><td>'+p.jobs+'</td><td class="rm">'+rm(p.amt)+'</td>'+
        '<td style="color:var(--red)">'+(p.hold?rm(p.hold):'-')+'</td></tr>';
      }).join('')+'</tbody></table>'):'<div class="empty">No commission this month yet</div>')+
    '</div>';
}
