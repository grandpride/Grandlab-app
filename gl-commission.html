const SENIOR_POOL=0.60, JUNIOR_POOL=0.40;
// grouped from the a-la-carte PPF part list - more than one person can share a zone
const ZONES_CAR=[

// ---------- rate matching ----------
function pkgOf(name,bike){
  const n=String(name||'').toLowerCase().replace(/\s+/g,' ');
  const c=n.replace(/[^a-z0-9]/g,'');               // spacing-proof copy
  if(c.indexOf('removal')>=0)return null;           // film removal is labour
  // a bike only ever has one package, whatever the car service was called
  if(bike)return (c.indexOf('fullcar')>=0||c.indexOf('fullfront')>=0)?'full_bike':null;
  if(c.indexOf('fullcar')>=0)return 'full_car';
  if(c.indexOf('fullfront')>=0 && c.indexOf('basic')<0)return 'full_front';
  if(c.indexOf('front3')>=0)return 'front_3';
  return null;                                       // part / a la carte
}
// Service names are often typed by hand: "AXFILM  K - SERIES", "AXFilm K-Series",
// "AXFILM K SERIES". Strip everything but letters and digits before comparing.
function norm_(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function findRate(catHint,name,bike){
  if(!bike){
    const exact=RATES.filter(function(r){return r.service_match===name})[0];
    if(exact)return exact;
    const near=RATES.filter(function(r){return r.service_match&&norm_(r.service_match)===norm_(name)})[0];
    if(near)return near;
  }
  const p=pkgOf(name,bike);
  if(!p)return null;
  const nName=norm_(name);
  // brand is the longest brand string that appears in the service name
  let best=null;
  RATES.forEach(function(r){
    if(r.package!==p||!r.brand)return;
    if(nName.indexOf(norm_(r.brand))>=0){
      if(!best||r.brand.length>best.brand.length)best=r;
    }
  });
  return best;
}
function filmLines(job){
  const out=[]; const bike=isBike(job);
  (job.services||[]).forEach(function(s){
    const nm=(typeof s==='string')?s:(s&&s.desc?s.desc:'');
    if(!nm)return;
    const r=findRate(null,nm,bike);
    if(r&&Number(r.amount)>0)out.push({name:nm,rate:r});
  });
  return out;
}

// ---------- NEW JOBS ----------
async function loadNew(){
  const box=el('v_new');
  box.innerHTML='<div class="card"><div class="empty">Loading...</div></div>';
  const since=Date.now()-45*86400000;
  const j=await sb.from('gl_jobs')
    .select('id,plate,model,car_type,services,created_at,stage,ready_at')
    .gte('created_at',since).order('created_at',{ascending:false}).limit(200);
  if(j.error){box.innerHTML='<div class="card"><div class="empty">Could not load jobs</div></div>';return}
  // one entry per FILM SERVICE - a car with PPF + tint is two separate
  // commission orders, so each team is paid from its own pool
  let items=[];
  (j.data||[]).forEach(function(x){
    filmLines(x).forEach(function(l){ items.push({job:x,line:l}) });
  });
  const ids=items.map(function(it){return it.job.id});
  if(ids.length){
    const c=await sb.from('gl_comm_orders').select('job_id,service_name').in('job_id',ids);
    const sk=await sb.from('gl_comm_skips').select('job_id,service_name').in('job_id',ids);
    const seen={};
    (c.data||[]).forEach(function(x){seen[x.job_id+'||'+(x.service_name||'')]=1});
    (sk.data||[]).forEach(function(x){seen[x.job_id+'||'+(x.service_name||'')]=1});
    items=items.filter(function(it){return !seen[it.job.id+'||'+it.line.name]});
  }
  if(!items.length){
    box.innerHTML='<div class="card"><div class="sec">NEW JOBS</div><div class="empty">No film jobs waiting &#10003;</div></div>';
    return;
  }
  // deposit then balance often creates two job cards for one installation -
  // flag same plate + same service so it is not paid twice
  const dupKey=function(it){return String(it.job.plate||'').replace(/\s/g,'').toUpperCase()+'|'+norm_(it.line.name)};
  const seenDup={};
  items.forEach(function(it){const k=dupKey(it);seenDup[k]=(seenDup[k]||0)+1});
  // also check whether one was already entered
  const done={};
  (function(){ (window.__COMM_DONE__||[]).forEach(function(x){done[x]=1}) })();

  box.innerHTML='<div class="card"><div class="sec">NEW JOBS ('+items.length+')</div>'+
    (Object.keys(seenDup).filter(function(k){return seenDup[k]>1}).length
      ? '<div class="warn">Same plate and service appears more than once &mdash; usually a deposit and a balance job card for one installation. Pay it once and remove the other.</div>'
      : '')+
    items.map(function(it,i){
      const bike=isBike(it.job);
      const isDup=seenDup[dupKey(it)]>1;
      return '<div class="jrow" data-i="'+i+'">'+
        '<div class="pl">'+esc(it.job.plate||'-')+'</div>'+
        '<div class="mid"><div>'+esc(it.job.model||'')+
          (bike?' <span class="pill" style="background:var(--gold);color:#000">BIKE</span>':'')+'</div>'+
        '<div class="sub2">'+esc(it.line.name)+
          (isDup?' <span class="pill" style="background:var(--red)22;color:var(--red);border:1px solid var(--red)">DUPLICATE?</span>':'')+
        '</div></div>'+
        '<div class="rm">'+rm(it.line.rate.amount)+'</div>'+
        '<button class="skipx" title="Not needed">&times;</button></div>';
    }).join('')+'</div>';
  Array.from(box.querySelectorAll('.jrow')).forEach(function(d,i){
    d.onclick=function(){openForm(items[i].job,items[i].line)};
    const x=d.querySelector('.skipx');
    if(x)x.onclick=function(e){e.stopPropagation();skipItem(items[i],d)};
  });
}


// remove a film job that needs no commission (duplicate card, redo, warranty job)
async function skipItem(it,row){
  if(!confirm('Remove '+(it.job.plate||'')+' - '+it.line.name+' from the list?\n\nNo commission will be paid for it.'))return;
  const gu=await sb.auth.getUser();
  const r=await sb.from('gl_comm_skips').insert({
    job_id:it.job.id, service_name:it.line.name,
    staff_email:gu.data.user?gu.data.user.email:''});
  if(r.error && r.error.code!=='23505'){toast('Could not remove');return}

function tapZone(i,name,btn){

function addPerson(name,role){
  CUR.people.push({name:name||'',role:role||'junior',pct:0});

}
function renderPeople(){
  const tb=el('f_people');
  tb.innerHTML=CUR.people.map(function(p,i){
    return '<tr>'+
      '<td><select onchange="setP('+i+',\'name\',this.value)"><option value="">-</option>'+
        TECHS.map(function(t){return '<option'+(t===p.name?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></td>'+
      '<td><select onchange="setP('+i+',\'role\',this.value)">'+
        '<option value="senior"'+(p.role==='senior'?' selected':'')+'>Senior</option>'+
        '<option value="junior"'+(p.role==='junior'?' selected':'')+'>Junior</option></select></td>'+

    '</tr>';
  }).join('');

}
function setP(i,k,v){ CUR.people[i][k]=(k==='pct')?Number(v):v; if(k==='role')autoPct(); calc(); }
function rmP(i){ CUR.people.splice(i,1); renderPeople(); calc(); }
function autoPct(){
  ['senior','junior'].forEach(function(role){
    const idx=CUR.people.map(function(p,i){return p.role===role?i:-1}).filter(function(i){return i>=0});
    if(!idx.length)return;
    const each=Math.floor(100/idx.length);
    let left=100-each*idx.length;
    idx.forEach(function(i,k){ CUR.people[i].pct=each+(k===0?left:0) });
  });
  const tb=el('f_people');
  if(tb)Array.from(tb.querySelectorAll('input[type=number]')).forEach(function(inp,i){ inp.value=CUR.people[i].pct });
}

function bandOf(){
  const s=el('f_start').value, e=el('f_end').value;
  if(!s||!e)return {band:'ontime',f:1,auto:true};
  const sd=new Date(s), ed=new Date(e);
  const onTime=new Date(sd.getTime()+CUR.target*3600000);
  if(ed<=onTime)return {band:'ontime',f:1,auto:true};
  const nd=new Date(sd); nd.setDate(nd.getDate()+1); nd.setHours(23,59,59,999);
  if(ed<=nd)return {band:'nextday',f:0.5,auto:true};
  return {band:'late',f:0,auto:true};
}
function calc(){
  if(!CUR)return;
  let b=bandOf();
  const ov=el('f_band').value;
  if(ov){ b={band:ov,f:ov==='ontime'?1:ov==='nextday'?0.5:0,auto:false} }
  CUR.band=b;
  const lbl={ontime:'ON TIME - 100%',nextday:'NEXT DAY - 50%',late:'LATE - 0%'}[b.band];
  const col={ontime:'var(--green)',nextday:'var(--amber)',late:'var(--red)'}[b.band];
  el('f_timing').innerHTML='<div style="margin-top:8px;font-weight:800;color:'+col+'">'+lbl+
    (b.auto?'':' (manual)')+'</div>';

  let pool=CUR.base*b.f;
  const sen=CUR.people.filter(function(p){return p.role==='senior'&&p.name});
  const jun=CUR.people.filter(function(p){return p.role==='junior'&&p.name});
  // if one team is absent, its share goes to the team that did the work
  let sPool=pool*SENIOR_POOL, jPool=pool*JUNIOR_POOL;
  let note='';
  if(!sen.length&&jun.length){ jPool=pool; sPool=0; note='No senior assigned - full pool to junior team.'; }
  if(!jun.length&&sen.length){ sPool=pool; jPool=0; note='No junior assigned - full pool to senior team.'; }
  CUR.pool=pool;

  let total=0;
  CUR.people.forEach(function(p,i){
    const teamPool=p.role==='senior'?sPool:jPool;
    const teamList=p.role==='senior'?sen:jun;
    const amt=(p.name&&teamList.length)?(teamPool*(Number(p.pct)||0)/100):0;
    p.amount=+amt.toFixed(2); total+=p.amount;
    const c=el('amt_'+i); if(c)c.textContent=rm(amt);
  });
  el('f_total').textContent=rm(total);

  const sp=sen.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  const jp=jun.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  let msg='';
  if(sen.length&&sp!==100)msg+='Senior percentages total '+sp+'% (should be 100%). ';
  if(jun.length&&jp!==100)msg+='Junior percentages total '+jp+'% (should be 100%). ';
  el('f_check').innerHTML = msg ? ('<div class="warn">'+msg+'</div>')
                          : (note? ('<div class="warn">'+note+'</div>')
                          : '<div class="ok">Split adds up correctly.</div>');
}

let SCAN_STREAM=null;
function stopScan(){
  if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(function(t){t.stop()});SCAN_STREAM=null}
  const v=el('f_video'); if(v){v.classList.add('hide');v.srcObject=null}
  const b=el('f_stopbtn'); if(b)b.classList.add('hide');
}
async function scanSerial(){
  const v=el('f_video');
  try{
    SCAN_STREAM=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}}, audio:false });
    v.srcObject=SCAN_STREAM;
    v.setAttribute('playsinline','');   // iPhone will not inline-play without this
    v.muted=true;
    v.classList.remove('hide');
    el('f_stopbtn').classList.remove('hide');
    await v.play();
  }catch(e){
    toast('Camera blocked - allow camera access, or type the code');
    stopScan(); return;
  }
  // fast path where the browser has it (Chrome/Android), jsQR everywhere else (incl. iPhone)
  let det=null;
  try{ if('BarcodeDetector' in window) det=new BarcodeDetector(); }catch(e){}
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async function(){
    if(!SCAN_STREAM)return;
    if(v.readyState===v.HAVE_ENOUGH_DATA){
      let code=null;
      if(det){
        try{ const r=await det.detect(v); if(r&&r.length)code=r[0].rawValue; }catch(e){}
      }
      if(!code && window.jsQR){
        cv.width=v.videoWidth; cv.height=v.videoHeight;
        if(cv.width&&cv.height){
          cx.drawImage(v,0,0,cv.width,cv.height);
          const img=cx.getImageData(0,0,cv.width,cv.height);
          const q=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
          if(q&&q.data)code=q.data;
        }
      }
      if(code){
        addSerial(code);
        toast('Scanned: '+code);
        if(navigator.vibrate)navigator.vibrate(60);
        stopScan(); return;
      }
    }
    requestAnimationFrame(tick);
  };
  tick();
}

async function loadList(which){
  const box=el(which==='pend'?'v_pend':'v_done');
  box.innerHTML='<div class="card"><div class="empty">Loading...</div></div>';
  const st=which==='pend'?['pending','hold']:['approved','paid'];
  const r=await sb.from('gl_comm_orders').select('*').in('status',st)
    .order('created_at',{ascending:false}).limit(80);
  if(r.error||!r.data||!r.data.length){
    box.innerHTML='<div class="card"><div class="empty">Nothing here</div></div>';return;
  }
  // gl_comm_orders stores no customer name, so resolve it from the linked job
  // (one batched query for the whole list), falling back to gl_walkin by plate
  // for older orders whose job row has since gone.
  const NAMES={};
  try{
    const ids=r.data.map(function(o){return o.job_id}).filter(Boolean);
    if(ids.length){
      const jr=await sb.from('gl_jobs').select('id,name,workshop_name,cust_type').in('id',ids);
      (jr.data||[]).forEach(function(j){
        NAMES[j.id]=(j.name||j.workshop_name||'').trim();
      });
    }
    const missing=r.data.filter(function(o){ return !NAMES[o.job_id] && o.plate; })
                        .map(function(o){ return String(o.plate).trim().toUpperCase(); });
    if(missing.length){
      const wr=await sb.from('gl_walkin').select('plate,name').in('plate',[...new Set(missing)]);
      const byPlate={};
      (wr.data||[]).forEach(function(w){
        const k=String(w.plate||'').trim().toUpperCase();
        if(k && w.name && !byPlate[k]) byPlate[k]=w.name;
      });
      r.data.forEach(function(o){
        const k=String(o.plate||'').trim().toUpperCase();
        if(!NAMES[o.job_id] && byPlate[k]) NAMES['P:'+k]=byPlate[k];
      });
    }
  }catch(e){ /* names are a nicety - never block the list */ }
  const custName=function(o){
    return NAMES[o.job_id] || NAMES['P:'+String(o.plate||'').trim().toUpperCase()] || '';
  };
  box.innerHTML='<div class="card"><div class="sec">'+(which==='pend'?'WAITING APPROVAL':'APPROVED')+' ('+r.data.length+')</div>'+
    r.data.map(function(o,i){
      const tot=(o.splits||[]).reduce(function(a,b){return a+Number(b.amount||0)},0);
      const col=o.status==='hold'?'var(--red)':o.status==='paid'?'var(--green)':'var(--amber)';
      return '<div class="jrow" data-i="'+i+'">'+
        '<div class="pl">'+esc(o.plate||'-')+'</div>'+
        '<div class="mid"><div>'+esc(o.model||'')+'</div>'+
        (custName(o)?'<div class="sub2" style="color:#F5C518">'+esc(custName(o))+'</div>':'')+
        '<div class="sub2">'+esc((o.splits||[]).map(function(s){return s.name}).join(', '))+' &middot; '+myt(o.created_at)+'</div></div>'+
        '<span class="pill" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'55">'+String(o.status).toUpperCase()+'</span>'+
        '<div class="rm">'+rm(tot)+'</div></div>';
    }).join('')+'</div>';
  Array.from(box.querySelectorAll('.jrow')).forEach(function(d,i){
    d.onclick=function(){openOrder(r.data[i],which)};
  });
}

async function decide(id,status){
  const pin=prompt('Manager PIN to '+status.toUpperCase()+':');
  if(pin!==APPROVE_PIN){ if(pin!==null)toast('Wrong PIN'); return }
  let patch={status:status};
  if(status==='hold'){
    const note=prompt('Reason for hold (QC / rework):')||'';
    patch.qc_flag=true; patch.qc_note=note;
    const m=prompt('Film wasted on redo, in metres (optional):');
    if(m&&!isNaN(m))patch.rework_metres=Number(m);
  }
  const r=await sb.from('gl_comm_orders').update(patch).eq('id',id);
  if(r.error){toast('Error: '+r.error.message);return}
  toast(status==='paid'?'Marked as paid':status==='hold'?'Put on hold':'Approved');
  setTab(status==='approved'||status==='paid'?'done':'pend');
}

// ---------- PDF: same layout as the paper Commission Order ----------
function commPDF(o){
  if(!window.jspdf||!window.jspdf.jsPDF){toast('PDF library not loaded');return}
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({unit:'mm',format:'a4'});

  if((o.serials||[]).length){

    const ser=d.splitTextToSize((o.serials||[]).join(',  '),W-36);
    val(ser,L+34,y); y+=Math.max(6,ser.length*5)+2;

  line(y); y+=8;

  // installation table
  d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(0);
  d.text('INSTALLATION:',L,y); y+=5;
  const cols=[L,L+52,L+96,L+134,L+166];
  d.setFillColor(240);d.rect(L,y-4,W,7,'F');
  ['STAFF','TEAM','WHO HANDLE?','COMM RATE','FINAL COMM'].forEach(function(h,i){d.text(h,cols[i]+1,y)});
  y+=5;
  d.setFont('helvetica','normal');d.setFontSize(9);
  const zoneOf=function(name){
    return (o.zones||[]).filter(function(z){
      return Array.isArray(z.staff)?(z.staff.indexOf(name)>=0):(z.staff===name);
    }).map(function(z){return z.zone}).join(', ');
  };
  (o.splits||[]).forEach(function(s){
    const zs=d.splitTextToSize(zoneOf(s.name)||'-',36);
    const h=Math.max(6,zs.length*4.2);
    d.text(String(s.name||''),cols[0]+1,y);
    d.text(String(s.role||'').toUpperCase(),cols[1]+1,y);
    d.text(zs,cols[2]+1,y);
    d.text(String(s.pct||0)+'%',cols[3]+1,y);
    d.setFont('helvetica','bold');
    d.text(rm(s.amount),cols[4]+1,y);
    d.setFont('helvetica','normal');
    y+=h; line(y-2);
  });
  y+=4;

  // timing + totals
  const half=L+100;
  lab('START:',L,y);   val(o.start_at?myt(o.start_at):'-',L+24,y);
  lab('BASE:',half,y);  val(rm(o.base_amount),half+30,y);
  y+=6;
  lab('END:',L,y);     val(o.end_at?myt(o.end_at):'-',L+24,y);
  lab('TIMING:',half,y);val(String(o.timing_band||'').toUpperCase()+'  x'+o.timing_factor,half+30,y);
  y+=6;
  lab('DELIVER:',L,y); val(o.deliver_at?myt(o.deliver_at):'-',L+24,y);
  const tot=(o.splits||[]).reduce(function(a,b){return a+Number(b.amount||0)},0);
  d.setFont('helvetica','bold');d.setFontSize(11);
  d.text('COMMISSION FEE:',half,y); d.text(rm(tot),half+40,y);
  y+=10;

  if(o.notes){ lab('NOTES:',L,y); const n=d.splitTextToSize(o.notes,W-24); val(n,L+24,y); y+=Math.max(6,n.length*5); }
  if(o.qc_flag){ d.setTextColor(200,40,40);d.setFont('helvetica','bold');
    d.text('QC REWORK RAISED'+(o.qc_note?(' - '+o.qc_note):''),L,y); y+=7; d.setTextColor(0); }

  // signatures
  y=Math.max(y+8,236);
  line(y); y+=8;
  const sig=[['MANAGER SIGN',L],['BD SIGN',L+92]];
  const sig2=[['FINANCE SIGN',L],['MD SIGN',L+92]];
  d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(110);
  sig.forEach(function(s){d.text(s[0],s[1],y);d.setDrawColor(120);d.line(s[1],y+14,s[1]+62,y+14)});
  y+=24;
  sig2.forEach(function(s){d.text(s[0],s[1],y);d.setDrawColor(120);d.line(s[1],y+14,s[1]+62,y+14)});

  d.setFontSize(8);d.setTextColor(150);
  d.text('Status: '+String(o.status||'').toUpperCase()+'   |   Generated '+myt(new Date())+'   |   GrandLab Detailing',L,289);

  const fn='COMM_'+String(o.plate||'').replace(/[^A-Za-z0-9]+/g,'')+'_'+
    new Date(o.created_at||Date.now()).toISOString().slice(0,10)+'.pdf';
  d.save(fn);
}

async function saveRates(){
  const rows=el('v_rates')._rows||[];
  const changed=[];
  rows.forEach(function(x){
    const a=el('ra_'+x.id), h=el('rh_'+x.id), c=el('rc_'+x.id);
    if(!a)return;
    const amt=Number(a.value)||0;
    const th=h.value===''?null:Number(h.value);
    const act=!!c.checked;
    if(amt!==Number(x.amount)||th!==(x.target_hours==null?null:Number(x.target_hours))||act!==!!x.active){
      changed.push({id:x.id,amount:amt,target_hours:th,active:act,was:x.amount});
    }
  });
  if(!changed.length){toast('Nothing changed');return}
  const pin=prompt(changed.length+' rate'+(changed.length===1?'':'s')+' changed. Manager PIN to save:');
  if(pin!==APPROVE_PIN){ if(pin!==null)toast('Wrong PIN'); return }
  for(const c of changed){
    const r=await sb.from('gl_comm_rates')
      .update({amount:c.amount,target_hours:c.target_hours,active:c.active,updated_at:new Date().toISOString()})
      .eq('id',c.id);
    if(r.error){toast('Error: '+r.error.message);return}
  }
  toast(changed.length+' rate'+(changed.length===1?'':'s')+' updated');
  loadRates();
}

     '<table><thead><tr><th>Staff</th><th style="width:96px">Team</th><th style="width:70px">%</th>'+

     '<button class="btn btn2" style="margin-top:10px" onclick="eAdd()">+ ADD STAFF</button>'+

function dtLocal(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return new Date(d.getTime()+8*3600000).toISOString().slice(0,16);
}
function eAdd(){ EDIT.people.push({name:'',role:'junior',pct:0}); eRender(); }
function eRm(i){ EDIT.people.splice(i,1); eRender(); }
function eSet(i,k,v){ EDIT.people[i][k]=(k==='pct')?Number(v):v; eCalc(); }
function eRender(){
  el('e_people').innerHTML=EDIT.people.map(function(p,i){
    return '<tr>'+
      '<td><select onchange="eSet('+i+',\'name\',this.value)"><option value="">-</option>'+
        TECHS.map(function(t){return '<option'+(t===p.name?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></td>'+
      '<td><select onchange="eSet('+i+',\'role\',this.value)">'+
        '<option value="senior"'+(p.role==='senior'?' selected':'')+'>Senior</option>'+
        '<option value="junior"'+(p.role==='junior'?' selected':'')+'>Junior</option></select></td>'+
      '<td><input type="number" min="0" max="100" value="'+p.pct+'" onchange="eSet('+i+',\'pct\',this.value)"></td>'+
      '<td class="rm" id="eamt_'+i+'">RM0.00</td>'+
      '<td><button style="border:none;background:none;color:var(--red);cursor:pointer;font-size:16px" onclick="eRm('+i+')">&times;</button></td>'+
    '</tr>';
  }).join('');
  eCalc();
}
function eCalc(){
  const base=Number(el('e_base').value)||0;
  const band=el('e_band').value;
  const f=band==='ontime'?1:band==='nextday'?0.5:0;
  const pool=base*f;
  const sen=EDIT.people.filter(function(p){return p.role==='senior'&&p.name});
  const jun=EDIT.people.filter(function(p){return p.role==='junior'&&p.name});
  let sPool=pool*SENIOR_POOL, jPool=pool*JUNIOR_POOL;
  if(!sen.length&&jun.length){jPool=pool;sPool=0}
  if(!jun.length&&sen.length){sPool=pool;jPool=0}
  let total=0;
  EDIT.people.forEach(function(p,i){
    const list=p.role==='senior'?sen:jun;
    const tp=p.role==='senior'?sPool:jPool;
    const amt=(p.name&&list.length)?(tp*(Number(p.pct)||0)/100):0;
    p.amount=+amt.toFixed(2); total+=p.amount;
    const c=el('eamt_'+i); if(c)c.textContent=rm(amt);
  });
  el('e_total').textContent=rm(total);
  EDIT.pool=pool; EDIT.factor=f; EDIT.band=band; EDIT.base=base;
  const sp=sen.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  const jp=jun.reduce(function(a,b){return a+(Number(b.pct)||0)},0);
  let msg='';
  if(sen.length&&sp!==100)msg+='Senior total '+sp+'%. ';
  if(jun.length&&jp!==100)msg+='Junior total '+jp+'%. ';
  el('e_check').innerHTML=msg?('<div class="warn">'+msg+'should be 100%</div>')
                             :'<div class="ok">Split adds up correctly.</div>';
}
async function saveEdit(id){
  const named=EDIT.people.filter(function(p){return p.name});
  if(!named.length){toast('Add at least one staff member');return}
  const r=await sb.from('gl_comm_orders').update({
    base_amount:EDIT.base, timing_band:EDIT.band, timing_factor:EDIT.factor,
    payout_pool:EDIT.pool, splits:named,
    start_at:el('e_start').value?new Date(el('e_start').value).toISOString():null,
    end_at:el('e_end').value?new Date(el('e_end').value).toISOString():null,
    notes:el('e_notes').value.trim()
  }).eq('id',id);
  if(r.error){toast('Error: '+r.error.message);return}
  toast('Order updated');
  setTab('pend');
}

// ---------- REPORT ----------
async function loadReport(mon){
  const box=el('v_report');
  const now=new Date();
  const m=mon||new Date(now.getTime()+8*3600000).toISOString().slice(0,7);
  // same 24th-to-23rd cycle used for payroll
  const yy=Number(m.slice(0,4)), mm=Number(m.slice(5,7));
  const fromD=new Date(yy,mm-2,24), toD=new Date(yy,mm-1,24);
  const from=fromD.toLocaleDateString('en-CA'), to=toD.toLocaleDateString('en-CA');
  const r=await sb.from('gl_comm_orders').select('*')
    .gte('created_at',from+'T00:00:00+08:00').lt('created_at',to+'T00:00:00+08:00')
    .order('created_at');
  const rows=r.data||[];
  const per={};
  let paid=0, held=0, jobs=rows.length;
  rows.forEach(function(o){
    const t=(o.splits||[]).reduce(function(a,b){return a+Number(b.amount||0)},0);
    if(o.status==='hold')held+=t; else paid+=t;
    (o.splits||[]).forEach(function(s){
      if(!s.name)return;
      per[s.name]=per[s.name]||{name:s.name,jobs:0,amt:0,hold:0};
      per[s.name].jobs++;
      if(o.status==='hold')per[s.name].hold+=Number(s.amount||0);
      else per[s.name].amt+=Number(s.amount||0);
    });
  });
  const list=Object.keys(per).map(function(k){return per[k]}).sort(function(a,b){return b.amt-a.amt});
  box.innerHTML='<div class="card">'+
    '<div class="row"><div><label>Commission month</label>'+
      '<input type="month" id="rp_mon" value="'+m+'" onchange="loadReport(this.value)"></div></div>'+
    '<div class="hint">Cycle: '+from+' to '+
      new Date(toD.getTime()-86400000).toLocaleDateString('en-CA')+'  (24th to 23rd)</div>'+
    '<div class="hint" style="color:var(--gold)">Pay out on '+payDay_(m)+'</div>'+
    '<div class="row" style="margin-top:8px"><div><label>Film jobs</label><div class="big">'+jobs+'</div></div>'+
    '<div><label>Commission</label><div class="big">'+rm(paid)+'</div></div>'+
    '<div><label>On hold</label><div class="big" style="color:var(--red)">'+rm(held)+'</div></div></div></div>'+
    '<div class="card"><div class="sec">BY STAFF</div>'+
    (list.length?('<table><thead><tr><th>Staff</th><th>Jobs</th><th>Commission</th><th>On hold</th></tr></thead><tbody>'+
      list.map(function(p){
        return '<tr><td>'+esc(p.name)+'</td><td>'+p.jobs+'</td><td class="rm">'+rm(p.amt)+'</td>'+
        '<td style="color:var(--red)">'+(p.hold?rm(p.hold):'-')+'</td></tr>';
      }).join('')+'</tbody></table>'):'<div class="empty">No commission this month yet</div>')+
    (rows.length?'<button class="btn btn2" style="margin-top:12px" onclick="monthPDF()">DOWNLOAD MONTHLY PDF FOR FINANCE</button>':'')+
    '</div>';
  box._data={month:m,from:from,toShown:new Date(toD.getTime()-86400000).toLocaleDateString('en-CA'),
             rows:rows,list:list,paid:paid,held:held,jobs:jobs};
}


// commission for a cycle is paid on the 15th of the month after the cycle ends
function payDay_(m){
  const yy=Number(m.slice(0,4)), mm=Number(m.slice(5,7));
  const d=new Date(yy,mm,15);          // cycle ends 23rd of month mm -> pay 15th of mm+1
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
}
function payDue_(m){
  const yy=Number(m.slice(0,4)), mm=Number(m.slice(5,7));
  return new Date(yy,mm,15);
}

    d.text(String(o.status||'').toUpperCase().slice(0,8),c2[4]+1,y);
    d.setFont('helvetica','bold'); d.text(rm(tot),c2[5]+1,y); d.setFont('helvetica','normal');
    y+=5.6; d.setDrawColor(225); d.line(L,y-4,R,y-4);
  });
  y+=6;
  d.setFont('helvetica','bold');d.setFontSize(11);
  d.text('TOTAL PAYABLE',c2[3]+1,y); d.text(rm(d0.paid),c2[5]+1,y);
  y+=18;
  d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(110);
  [['PREPARED BY',L],['FINANCE',L+60],['APPROVED BY',L+120]].forEach(function(s){
    d.text(s[0],s[1],y); d.setDrawColor(120); d.line(s[1],y+13,s[1]+48,y+13);
  });
  d.save('COMMISSION_'+d0.month+'.pdf');
}
</script>
